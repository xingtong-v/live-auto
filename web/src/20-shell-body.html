
</head>
<body>
<!--__BOOT__-->

<div class="topbar">
  <div class="brand">
    <div class="logo">切</div>
    <h1>直播切片助手</h1>
    <span class="sub" id="brandSub"><span class="live-dot" id="healthDot"></span><span id="brandText">加载中…</span></span>
  </div>
  <div class="top-right">
    <div class="mode">
      <span id="modeText">半自动 · 需确认后发布</span>
      <button class="switch" id="modeSwitch" title="切换全自动 / 半自动"></button>
    </div>
    <div class="mode" id="subMode" title="切片是否把转写烧成字幕。字幕准不准取决于转写引擎：本地 Fun-ASR 有字级时间戳（实测偏差 ±0.2 秒）；云端 ASR 的句级时间窗不可靠（实测 15 个字的句子占了 0→30.9 秒），烧出来会与声音错位。">
      <span id="subText">字幕：加载中…</span>
      <button class="switch" id="subSwitch" title="开启 / 关闭字幕烧录（下一次切片生效）"></button>
    </div>
    <button class="ghost" id="btnRepairStuck" title="进程被强杀后任务会停在「切片中」这类状态，点这里修回可操作状态">修复卡住</button>
    <button class="ghost" id="btnCheckNow">立即检查</button>
    <button class="ghost" id="btnImport">导入录播</button>
    <button class="ghost" id="btnSetting">设置</button>
  </div>
</div>

<div class="tabs" id="tabs">
  <!-- P1-7（2026-10-13）：页签**分组**（分隔线 + 悬停说明）+ 每个页签一句"什么时候来这儿"。
       为什么用 title 而不是加一行说明文字：不动布局、不占高度，且鼠标一停就能看到。
       三个分组：干活（任务/实时监控）｜运维（健康面板/待删回收站）｜资产（稿件表现/切片库/Prompt）。 -->
  <button class="tab on" data-view="tasks" title="日常入口：看场次列表、审核切片、改标题、发布">任务</button>
  <button class="tab" data-view="monitor" title="正在跑什么、在等什么、为什么没动（默认 5 秒自动刷新）">实时监控</button>
  <button class="tab" data-view="observe" title="边录边转的进度、压制/上传队列与 ETA、我们进程的显存与内存（默认 5 秒自动刷新）">运行观测</button>
  <span class="tabsep" style="width:1px;height:16px;background:var(--border);margin:0 8px;display:inline-block;vertical-align:middle"></span>
  <button class="tab" data-view="health" title="现在有没有需要你处理的事（待办）/ 错误 / 磁盘 / 自检">健康面板</button>
  <!-- ★ 2026-10-11 用户要求：「将这两个（查看回收站 / 查看待删清单）放到成本的位置，然后将成本放到稿件表现里」；
       随后又要求「待删清单和回收站放一起」—— 两者本来就是同一条生命周期上的两段（待删 → 已删可恢复），
       合并成一页两段，顺带去掉重复了两遍的"最近已删除"列表。 -->
  <button class="tab" data-view="trash" title="用完即删的宽限期内可反悔 / 已删除的可恢复（按天折叠）">待删 / 回收站<span id="pendingTabBadge"></span></button>
  <span class="tabsep" style="width:1px;height:16px;background:var(--border);margin:0 8px;display:inline-block;vertical-align:middle"></span>
  <button class="tab" data-view="perf" title="长期资产视角：已发布稿件的播放/点赞/评分，以及月度成本">稿件表现</button>
  <button class="tab" data-view="clips" title="跨场次找切片：按标题/状态/评分检索，可试看、可跳到那一场">切片库</button>
  <button class="tab" data-view="prompts" title="选片与标题的提示词（改这里会影响后续场次的挑选质量）">Prompt</button>
</div>

<div id="viewTasks">
  <div class="app">
    <aside class="col col-left">
      <div class="searchbar">
        <input id="searchInput" placeholder="搜索标题 / 日期 / 任务 ID">
        <div class="filters" id="statusFilters">
          <button data-status="" class="on">全部</button>
          <button data-status="processing">处理中</button>
          <button data-status="review">待审核</button>
          <button data-status="published">已发布</button>
          <button data-status="failed">失败</button>
        </div>
        <button class="ghost" id="btnMulti" title="多选：批量删除任务（一次清理一批已发布的场次）">多选</button>
      </div>
      <!-- 测试夹具开关（默认隐藏；由 renderTaskList 按实际条数填充，没有夹具时这里是空的） -->
      <div id="fixtureToggleBar" style="padding:0 12px 6px"></div>
      <div id="multiBar" style="display:none"></div>
      <div id="taskList"></div>
    </aside>
    <main class="col col-mid"><div id="detail"><div class="empty">正在加载…</div></div></main>
    <aside class="col col-right">
      <div class="col-label">发布排期</div>
      <div id="schedule"></div>
    </aside>
  </div>
</div>

<div id="viewOther" style="display:none"><div class="fullpage" id="otherPage"></div></div>

<!-- ============ 设置弹窗 ============ -->
<div class="mask" id="cfgMask"><div class="modal">
  <div class="modal-head"><h2>设置</h2><button class="x" onclick="closeCfg()">✕</button></div>
  <div class="modal-body" id="cfgBody"></div>
  <div class="modal-foot">
    <span class="tip">保存后热加载，对新步骤立即生效；已在排期的切片不受影响</span>
    <span id="cfgIssues" style="margin-left:auto;font-size:12px"></span>
    <button class="btn-plain" onclick="closeCfg()">取消</button>
    <button class="primary" id="btnSaveCfg" style="margin-left:0">保存配置</button>
  </div>
</div></div>

<!-- ============ 通用弹窗 ============ -->
<div class="mask" id="infoMask"><div class="modal wide">
  <div class="modal-head"><h2 id="infoTitle">详情</h2>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn-sm" id="infoCopy">一键复制</button>
      <button class="x" onclick="closeInfo()">✕</button>
    </div>
  </div>
  <div class="modal-body" id="infoBody"></div>
  <div class="modal-foot"><span class="tip" id="infoTip"></span>
    <button class="btn-plain" style="margin-left:auto" onclick="closeInfo()">关闭</button></div>
</div></div>

<div id="toast"></div>
