      <div class="field"><label>下播确认窗口（秒）</label><input class="inp num" id="c_offlineConfirmSec" value="${c.room.offlineConfirmSec}">
        <div class="hintline">断流误触发的防线：持续非直播 ≥ 该窗口才判定本场结束（硬约束 #19）</div></div>
      <div class="field"><label>历史对账间隔（分钟）</label><input class="inp num" id="c_reconcileIntervalMin" value="${c.room.reconcileIntervalMin}"></div>
      <div class="field"><label>录制器类型</label>
        <select class="inp" id="c_recorderType">
          ${['builtin', 'bililiverecorder', 'blrec', 'ddtv', 'oneliverec', 'custom'].map((t) => `<option value="${t}" ${c.recorder.type === t ? 'selected' : ''}>${{ builtin: '内置引擎（无对外事件源，用轮询）', bililiverecorder: '录播姬', blrec: 'blrec', ddtv: 'DDTV', oneliverec: 'oneliverec', custom: '其它 / custom' }[t]}</option>`).join('')}
        </select>
        <div class="hintline">首选方案：让录制器<b>直接配置两个 webhook 目标</b>（本服务 + biliLive-tools），零转发零单点故障</div></div>
    </div></div>

  <div class="group"><h3>切片与选片</h3>
    <p class="gdesc">控制 LLM 每场产出多少候选、哪些默认勾选；单场可在任务页临时覆盖。</p>
    <div class="fields">
      <div class="field"><label>每场最多候选切片数</label><input class="inp num" id="c_maxCandidates" value="${c.clip.maxCandidates}"></div>
      <div class="field"><label>推荐阈值（低于此分默认不勾选）</label><input class="inp num" id="c_autoSelectScoreFloor" value="${c.clip.autoSelectScoreFloor}">
        <div class="hintline">两个闸门分工（2026-10-12 澄清）：<b>这一项只管"勾不勾"</b> —— 分数 ≥ 它就会被勾上；<b>自动投多少</b>另由 <span class="mono-sm">clip.autoSelectTopN</span>（当前 ${c.clip.autoSelectTopN}，本页没有控件，改 config.json）决定：按评分降序只自动投前 N 个，超出部分仍保持勾选、但需要你点一下发布（会写一条含分数的日志）。想"达标就全投"就把它调大（99 = 实质不设限）。</div></div>
      <div class="field"><label>片段时长范围（秒）</label><div class="ctl">
        <input class="inp num" id="c_minDurationSec" value="${c.clip.minDurationSec}"><span style="color:var(--text-3)">—</span>
        <input class="inp num" id="c_maxDurationSec" value="${c.clip.maxDurationSec}"></div></div>
      <div class="field"><label>前后缓冲（秒）</label><input class="inp num" id="c_bufferSec" value="${c.clip.bufferSec}"></div>
      <div class="field"><label>画面烧入弹幕</label><div class="inline-switch">
        <button class="switch sm ${c.clip.burnDanmaku ? 'on' : ''}" id="c_burnDanmaku"></button>
        <span>${c.clip.burnDanmaku ? '开启（原生弹幕，无错字风险）' : '关闭（切片画面无弹幕）'}</span></div></div>
      <div class="field"><label>源文件是否已烧弹幕</label><div class="inline-switch">
        <button class="switch sm ${c.clip.fullVideoHasDanmaku ? 'on' : ''}" id="c_fullVideoHasDanmaku"></button>
        <span>${c.clip.fullVideoHasDanmaku ? '是（切片时不再传 ASS，避免叠双层弹幕）' : '否（切片时传入整场 ASS）'}</span></div>
        <div class="hintline">该值由压制预设或本场配置决定，<b>不允许运行时猜测</b>（硬约束 #12）</div></div>
      <div class="field"><label>ffmpeg 预设 ID</label><input class="inp" id="c_ffmpegPresetId" value="${esc(c.clip.ffmpegPresetId)}">
        <div class="hintline">从 biliLive-tools 的预设读取参数；切片必须重编码，禁止 stream copy</div></div>
      <div class="field"><label>编码参数覆盖（JSON，可留空）</label><input class="inp" id="c_ffmpegOptionsOverride" value="${esc(JSON.stringify(c.clip.ffmpegOptionsOverride || {}))}"></div>
      <div class="field full"><label>多分P 稿件的「切片分P」标题模板</label>
        <input class="inp" id="c_partTitleTemplate" value="${esc(c.publish.partTitleTemplate || '')}" placeholder="留空 = 沿用 P3 标题 的旧行为；例：{anchor}切片{n} {title}">
        <div class="hintline">可用变量：<span class="mono-sm">{n}</span> 分P 序号、<span class="mono-sm">{title}</span> 切片标题、
          <span class="mono-sm">{anchor}</span> 主播名、<span class="mono-sm">{date}</span> 录制日期、
          <span class="mono-sm">{mainTitle}</span> 稿件主标题。<b>实测创作中心里看到的「P3 主播收到…」就是默认模板的产物</b>。</div>
        <div class="hintline" id="partTitlePreview"></div></div>
      <div class="field full"><label>投稿体检</label><div class="ctl">
        <button class="btn-sm" id="btnAuditCurrent">对最近的场次跑一次体检</button>
        <span class="hintline">列出本场投了几次、有没有重复稿件、bvid 是否可信、标题有没有硬伤。也可以在某场任务详情页点「投稿体检」。</span></div></div>
      <div class="field full"><label>回收站 / 待删清单</label><div class="ctl">
        <span class="hintline">这两项已经<b>搬到顶部标签栏、并合并成一页</b>（2026-10-11）：
        「待删 / 回收站」里第一段是「用完即删」的待删（宽限期内可取消），第二段是回收站（已删除、可恢复、超期自动清理）——
        不用再翻设置。</span></div></div>
      <div class="field full"><label>回收站保留天数</label><div class="ctl">
        <input class="inp" id="c_trashDays" type="number" min="0" max="90" step="1" style="width:90px" value="${Number(c.cleanup.trashDays)}">
        <span class="hintline">超过这个天数的条目会被<b>自动彻底删除</b>（每天检查一次）；在「回收站」页每个日期上也能看到还剩几天到期。
          <b>0 = 不用回收站</b>：删除任务会直接永久删除，误点了也恢复不了。</span></div></div>
      <div class="field full"><label>MCP 接口</label><div class="ctl">
        <button class="btn-sm" id="btnMcp">接入 Agent（Claude Code / Codex / Cursor）<span id="mcpBadge"></span></button>
        <span class="hintline">把整个切片助手暴露成 MCP 工具，Agent 就能直接用对话驱动流水线：看任务、重跑某阶段、查为什么没导入、取消删源。只监听 127.0.0.1，且必须带 token。</span></div></div>
      <div class="field full"><label>记录选片决策</label><div class="inline-switch">
        <button class="switch sm ${c.runtime.recordDecisions ? 'on' : ''}" id="c_recordDecisions"></button>
        <span>${c.runtime.recordDecisions ? '开启（记录你的勾选与取消，用于观察 LLM 的偏好偏差）' : '关闭（无法分析选片偏好）'}</span></div>
        <div class="hintline">记录含评分与理由、以及你编辑后的最终标题/时间范围/标签，仅存本机。</div></div>
    </div></div>

  <div class="group"><h3>字幕与术语表</h3>
    <p class="gdesc">转写结果烧成字幕（与弹幕合成同一个 ASS 交给切片接口）；术语表用来纠正 ASR 听错的人名与术语，
      并告诉选片模型这些词是专有名词、不要改写。</p>
    <div class="fields">
      <div class="field"><label>画面烧入字幕</label><div class="inline-switch">
        <button class="switch sm ${c.clip.burnSubtitles ? 'on' : ''}" id="c_burnSubtitles"></button>
        <span>${c.clip.burnSubtitles ? '开启（字幕烧进画面）' : '关闭（画面只有弹幕）'}</span></div>
        <div class="hintline">字幕位置比弹幕更高、字号更大，两者不会叠在一起。
          <b>字幕准不准取决于转写引擎</b>：本地 Fun-ASR 有字级时间戳（实测偏差 ±0.2 秒）；云端 ASR 的句级时间窗不可靠（实测 15 个字的句子占了 0→30.9 秒），烧出来会与声音错位。
          顶栏那个「字幕」开关可以随时切，不用进这里。</div></div>
      <div class="field"><label>字幕字号（0 = 自动）</label><input class="inp num" id="c_subtitleFontSize" value="${c.clip.subtitle.fontSize}"></div>
      <div class="field"><label>每行最多几个字</label><input class="inp num" id="c_subtitleMaxChars" value="${c.clip.subtitle.maxCharsPerLine}"></div>
      <div class="field"><label>单条最短显示（秒）</label><input class="inp num" id="c_subtitleMinDur" value="${c.clip.subtitle.minDurationSec}"></div>
      <div class="field full"><label>主播 / 常驻嘉宾（一行一个）</label>
        <textarea class="inp" id="c_glossaryAnchors" rows="2" placeholder="甲主播">${esc(glossary.anchors.join('\n'))}</textarea></div>
      <div class="field full"><label>术语 / 梗 / 栏目名（一行一个）</label>
        <textarea class="inp" id="c_glossaryTerms" rows="4" placeholder="后半夜后悔时代&#10;闪身步">${esc(glossary.terms.join('\n'))}</textarea>
        <div class="hintline">会注入到「分块要点」和「选片起标题」的提示词里，让模型知道这些词的正确写法。</div></div>
      <div class="field full"><label>纠错规则（一行一条，写成 <span class="mono-sm">错→对</span>；正则加前缀 <span class="mono-sm">re:</span>）</label>
        <textarea class="inp" id="c_glossaryRepl" rows="4" placeholder="闪身部→闪身步&#10;re:\\d+次红包→很多次红包">${esc(glossary.replacements.map((r) => `${r.regex ? 're:' : ''}${r.from}→${r.to}`).join('\n'))}</textarea>
        <div class="hintline">转写完成后做确定性替换，按书写顺序生效（先写的先跑）。<b>改完保存即生效，不需要重新转写、不重复花钱。</b></div></div>
      <div class="field full"><label>热词表</label><div class="ctl">
        <button class="btn-sm" id="btnCopyHotWords">复制热词（一行一个）</button>
        <button class="btn-sm" id="btnCopyHotWords2">复制热词（逗号分隔）</button>
        <span class="hintline">本项目的 ASR 走 biliLive-tools，实测它的 <span class="mono-sm">/ai/subtitle</span> 只收
          file/modelId/startTime/endTime/offset/song 六个参数，<b>没有热词入参</b>。所以热词在这里只能作为可复制清单：
          换成本地 whisper（initial_prompt）或云厂商控制台的「定制热词」时可直接粘贴。</span></div>
        <div class="hintline">术语表文件：<span class="mono-sm">${esc(glossary.path)}</span>（也可以直接用记事本改，保存即生效）</div></div>
    </div></div>

  <div class="group"><h3>AI 配置</h3>
    <p class="gdesc">字幕识别复用 biliLive-tools 中已配置的模型与凭据，本服务不重复管理。内容分析（LLM）由本服务自研调用。</p>
    <div class="fields">
      <div class="field full"><label>字幕识别模型</label>
        <input class="inp" readonly value="在 biliLive-tools 设置 → AI 配置 中指定（必须勾选 ASR 标签）">
        <div class="hintline">转写用于内容分析、选片，以及烧成画面字幕（可在上方「字幕与术语表」里关闭）。未配置该模型时 /ai/subtitle 会直接抛错（陷阱 #5）。</div></div>
      <div class="field full"><label>服务预设</label>
        <select class="inp" id="c_llmPreset">
          ${Object.entries({ deepseek: 'DeepSeek（推荐：结构化抽取强，支持错峰半价与缓存折扣）', aliyun: '阿里云百炼 · 通义千问（与字幕识别同一个 Key）', zhipu: '智谱 GLM-Flash（有免费档，适合先跑通链路）', ollama: '本地 Ollama（完全离线，需自备显卡）', custom: '自定义' }).map(([k, v]) => `<option value="${k}" ${c.llm.preset === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}
        </select>
        <div class="hintline" id="presetNote"></div></div>
      <div class="field full"><label>LLM 接口地址</label><input class="inp" id="c_llmUrl" value="${esc(c.llm.summary.baseUrl)}"></div>
      <div class="field"><label>API Key</label><div class="ctl">
        <input class="inp" type="password" id="c_llmKey" value="${esc(c.llm.summary.apiKey)}">
        <button class="btn-sm" data-pwd="c_llmKey">显示</button></div></div>
      <div class="field"><label>模型名（分块与总结）</label><div class="ctl">
        <input class="inp" id="c_llmModel" value="${esc(c.llm.summary.model)}">
        <button class="btn-sm" data-test="llm">测试</button></div>
        <div class="testres" id="res-llm"></div></div>
      <div class="field full"><label>选片专用模型（留空则同上）</label>
        <input class="inp" id="c_llmSelectModel" value="${esc(c.llm.select.model)}" placeholder="建议填更强的型号，仅用于选片与起标题（每场 1–2 次）">
        <div class="hintline" id="escalationHint"></div></div>
      <div class="field"><label>分块时长（分钟）</label><input class="inp num" id="c_chunkMinutes" value="${c.llm.chunkMinutes}"></div>
      <div class="field"><label>分块并发</label><input class="inp num" id="c_chunkConcurrency" value="${c.llm.chunkConcurrency}"></div>
      <div class="field full"><label>转写引擎</label>
        <select class="inp" id="c_asrProvider">
          <option value="bililive-tools" ${c.asr.provider === 'bililive-tools' ? 'selected' : ''}>云端（biliLive-tools → 阿里云 DashScope）：按时长计费，最快</option>
          <option value="local-funasr" ${c.asr.provider === 'local-funasr' ? 'selected' : ''}>本地 Fun-ASR-Nano（阿里云开源）：免费，同素材实测字错率 8.8%，慢约 5 倍</option>
          <option value="whisper-cpp" ${c.asr.provider === 'whisper-cpp' ? 'selected' : ''}>本地 faster-whisper：免费，字错率约 17%（比 Fun-ASR 差一倍）—— 已被 Fun-ASR 压过，不推荐</option>
        </select>
        <div class="hintline">本地引擎需要先建好环境：Fun-ASR 用 <span class="mono-sm">node tools/local-asr/setup-funasr.mjs</span>，whisper 用 <span class="mono-sm">.venv-asr</span>。本地跑不产生任何云端费用。</div>
        <div class="hintline">两个<b>只改配置、界面上刻意没给开关</b>的项，连同实测结论写在这儿，免得你到处找：<br>
          · <span class="mono-sm">asr.silenceTrim.enabled</span> 静音裁剪：实测 480.4 s → 468.2 s，<b>只省 12 秒</b>（字幕条数与覆盖完全一致）⇒ <b>默认关，不建议开</b>；<br>
          · <span class="mono-sm">asr.worker.enabled</span> 转写放独立进程：实测 549.5 s vs 进程内 466.6 s，<b>慢约 18%</b>，换来的是"ASR 崩溃/OOM 不拖垮主链" ⇒ 要崩溃隔离就开，赶时间就关。</div></div>
      <div class="field"><label>Fun-ASR 设备</label>
        <select class="inp" id="c_funasrDevice">
          <option value="auto" ${c.asr.localFunasr.device === 'auto' ? 'selected' : ''}>auto（有 CUDA 就用）</option>
          <option value="cuda" ${c.asr.localFunasr.device === 'cuda' ? 'selected' : ''}>cuda</option>
          <option value="cpu" ${c.asr.localFunasr.device === 'cpu' ? 'selected' : ''}>cpu</option>
        </select></div>
      <div class="field"><label>Fun-ASR 推理引擎</label>
        <select class="inp" id="c_funasrEngine">
          <option value="auto" ${c.asr.localFunasr.engine === 'auto' ? 'selected' : ''}>auto（优先 vLLM，失败退 PyTorch）</option>
          <option value="pytorch" ${c.asr.localFunasr.engine === 'pytorch' ? 'selected' : ''}>pytorch（实测 4 小时素材约 43 分钟）</option>
          <option value="vllm" ${c.asr.localFunasr.engine === 'vllm' ? 'selected' : ''}>vllm（官方 bench 快 16 倍，需另装）</option>
        </select></div>
      <div class="field full"><label>Fun-ASR 解码器用 bf16（省显存）</label><div class="inline-switch">
        <button class="switch sm ${c.asr.localFunasr.llmDtype === 'bf16' ? 'on' : ''}" id="c_funasrBf16"></button>
        <span>${c.asr.localFunasr.llmDtype === 'bf16' ? '开启（显存 −33%，推理 +10%）' : '关闭（fp32 默认，显存多占约 1.1 GB）'}</span></div>
        <div class="hintline">同素材实测（300 秒，GPU 空闲）：峰值显存 <b>3493 → 2354 MB（−33%）</b>，墙钟 87.8 → 89.5 秒（+2%），字幕 130 条中 128 条逐字相同、2 条同音字差异，<b>时间戳逐条完全一致</b> ⇒ 切片边界不受影响。打游戏同时转写、显存吃紧时最有用。改完<b>下一场转写即生效</b>（缓存键含精度，不会拿旧结果糊弄）。</div></div>
      <div class="field"><label>Fun-ASR 每句字数上限</label><input class="inp num" id="c_funasrMaxChars" value="${c.asr.localFunasr.maxCharsPerCue}">
        <div class="hintline">按标点切句时一条字幕最多几个字，与字幕排版保持一致</div></div>
      <div class="field"><label>Fun-ASR 模型路径（Python）</label><input class="inp" id="c_funasrPython" value="${esc(c.asr.localFunasr.pythonPath || '')}" placeholder="留空 = 项目内 .venv-funasr"></div>
      <div class="field full"><label>Fun-ASR 字级时间戳</label><div class="inline-switch">
        <button class="switch sm ${c.asr.localFunasr.timestamps !== false ? 'on' : ''}" id="c_funasrTimestamps"></button>
        <span>${c.asr.localFunasr.timestamps !== false ? '开启（时间戳偏差 ±0.2s，推荐）' : '关闭（退化成 VAD 段粒度，偏差 ±2s）'}</span></div>
        <div class="hintline">开启后每句的时间取该句首字与末字的真实时刻（CTC 强制对齐），而不是整段的起止。</div></div>
      <div class="field"><label>热词上限（术语表 → Fun-ASR）</label><input class="inp num" id="c_funasrHotwordsMax" value="${c.asr.localFunasr.hotwordsMax ?? 80}">
        <div class="hintline">热词不是越多越好：超上限的部分会被丢掉（日志里会说明丢了几个）</div></div>
      <div class="field full"><label>把术语表当热词喂给 Fun-ASR</label><div class="inline-switch">
        <button class="switch sm ${c.asr.localFunasr.hotwordsEnabled !== false ? 'on' : ''}" id="c_funasrHotwords"></button>
        <span>${c.asr.localFunasr.hotwordsEnabled !== false ? '开启（推荐）' : '关闭'}</span></div>
        <div class="hintline">术语表（<span class="mono-sm">data/glossary.json</span> 的 anchors + terms）会作为 <span class="mono-sm">hotwords</span> 传给本地 Fun-ASR —— <b>只有它支持热词</b>（云端 biliLive-tools 的 /ai/subtitle 不透传热词）。同素材实测：目标词命中 5→8 次、相对云端基准的字错率 5.47%→5.03%，耗时无变化。改了术语表要<b>重新转写</b>才生效（缓存键含热词指纹，会自动重算，不会拿旧结果糊弄）。</div></div>
      <div class="field full"><label>ASR 分段时长（分钟）</label><input class="inp num" id="c_asrSegmentMinutes" value="${c.asr.segmentMinutes}">
        <div class="hintline">/ai/subtitle 是同步阻塞接口，4 小时全片一次调用会挂 20–40 分钟；必须分段且 startTime/endTime 成对（硬约束 #7）。本地 Fun-ASR 会自动忽略它（整文件一次调用，省掉重复加载模型）。</div></div>
      <div class="field"><label>ASR 单价（元/小时，用于估算）</label><input class="inp num" id="c_asrPrice" value="${c.asr.unitPricePerHour}"></div>
      <div class="field"><label>转写输入源</label>

     在这之前挂计数，计数会被当成标题文字一起吞掉（实测显示成"连接2 项"）。 */

/* 分组标题右侧挂「N 项」计数。理由：9 个分组默认全收起，用户找一项得逐个点开；
   有了计数，至少能先判断"这里像不像有我要的东西"再决定展开哪个。
   ⚠️ 挂到 <summary>（增强层重建出来的），不是原来的 <h3>。 */
function annotateCfgGroups() {
  $$('#cfgBody details.cfggroup').forEach((d) => {
    const sum = d.querySelector('summary');
    if (!sum || sum.querySelector('.gcount')) return;
    const n = d.querySelectorAll('.field').length;
    if (!n) return;
    const chip = document.createElement('span');
    chip.className = 'gcount';
    chip.textContent = `${n} 项`;
    sum.appendChild(chip);
  });
}

/* 超长说明折两行 + 「展开」按钮。
   为什么用 CSS line-clamp 而不是把文字切两段：说明里带 <b> / <span class="mono-sm">
   这类标签，按字数切会把标签切断。line-clamp 只影响显示、不动 DOM，最安全。
   ⚠️ 动态更新的那几个说明（用 id 取的）要跳过 —— 它们的内容会被整体重写。 */
const HINT_KEEP_IDS = ['roomPickHint', 'partTitlePreview', 'cfgSearchNote', 'presetNote', 'tagHint'];
function collapseLongHints() {
  $$('#cfgBody .hintline').forEach((el) => {
    if (el.dataset.hintDone) return;
    if (el.id && HINT_KEEP_IDS.includes(el.id)) return;
    if (el.querySelector('details')) return;
    el.dataset.hintDone = '1';
    if (el.textContent.trim().length < 110) return;   // 短的照旧
    el.classList.add('hint-clamped');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'hint-toggle';
    btn.textContent = '展开';
    btn.setAttribute('aria-expanded', 'false');
    btn.onclick = (ev) => {
      ev.preventDefault();
      el.classList.remove('hint-clamped');
      btn.remove();
    };
    el.after(btn);
  });
}

/**
 * 排期预览：把「首片/末片什么时候发、我指定的时间是否被推迟」直接显示出来。
 * 这些没有理由让用户自己按公式算。
 */
function renderDtimePlanPreview() {
  const el = $('#hintPlan');
  if (!el) return;
  const v = ($('#c_firstPublishAt') || {}).value || '';
  const b = state.bootstrap || {};
  const plan = b.dtimePlan || {};
  if (!v) {
    el.className = plan.scheduled === false ? 'hintline warn' : 'hintline';
    el.textContent = plan.scheduled === false
      ? '当前是「立即发布」：投稿不带 dtime，稿件过审即公开 —— 首片/末片时间不适用（要错峰发布就关掉「立即发布」）'
      : `自动排期：首片约 ${plan.firstText || '—'}，末片约 ${plan.lastText || '—'}（间隔 ${fmtSpan(plan.gapSec || (b.config && b.config.publish.clipGapSec) || 300)}）${plan.note ? ` · ${plan.note}` : ''}`;
    return;
  }
  const ms = Date.parse(v.replace(' ', 'T'));
  if (!Number.isFinite(ms)) { el.className = 'hintline warn'; el.textContent = '无法解析这个时间'; return; }
  const earliestMs = (plan.earliestAllowed || 0) * 1000;
  if (ms / 1000 < Math.floor(Date.now() / 1000) + 1200) {
    el.className = 'hintline warn';
    el.textContent = `⚠ 这个时间距现在不足 1200 秒（本项目硬约束 #4 的余量下限；B站平台底线是 300 秒）—— 实际会推迟到 ${plan.earliestAllowedText || '最早合法时间'} 发布`;
  } else {
    el.className = 'hintline ok';
    el.textContent = `✓ 首片 ${fmtTime(ms)} 发布，其余按间隔顺延`;
  }
}

function updateEscalationHint() {
  const sum = $('#c_llmModel').value.trim();
  const sel = $('#c_llmSelectModel').value.trim();
  const el = $('#escalationHint');
  if (!el) return;
  if (sel && sel === sum) {
    el.className = 'hintline warn';
    el.textContent = '⚠️ 与总结档配置为同一模型：「契约校验失败升级重跑」会退化为同模型重试一次，仍失败即直接降级。建议配一个更强的模型。';
  } else {
    el.className = 'hintline';
    el.textContent = '契约校验失败时会升级到该模型重跑，而不是在便宜模型上原地重试。';
  }
}
function updateTagHint() {
  const el = $('#hintTags');
  if (!el) return;
  const n = $('#c_defaultTags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean).length;
  el.className = n > 10 ? 'hintline warn' : 'hintline';
  el.textContent = n > 10 ? `已填 ${n} 个，超出 B站上限 10 个` : `已填 ${n} 个（上限 10 个；投稿时排在「必带标签」与 LLM 按内容生成的标签之后，只用来补足剩余名额，不会挤掉它们）`;
}
/* 必带标签：这些词永远在最前、优先占位，所以它们的个数直接决定 LLM 内容词还剩几个位置 */
function updateIdentityTagHint() {
  const el = $('#hintIdentityTags');
  if (!el) return;
  const list = $('#c_identityTags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  const n = list.length;
  const hasHolder = list.some((s) => /\{(主播|主播名|主播昵称|昵称)\}/.test(s));
  el.className = n > 10 ? 'hintline warn' : 'hintline';
  el.textContent =
    (n > 10 ? `已填 ${n} 个，超出 B站上限 10 个；` : `已填 ${n} 个（上限 10 个）：`) +
    `这些词永远排在切片标签最前面、优先占位，剩下的名额给 LLM 按内容生成的标签，重复的自动去重。` +
    (hasHolder
      ? '其中 {主播} 会在投稿时替换成本场主播名（例如 乙主播）；该场没识别出主播名时这一条整条跳过，任务里会写明。'
      : '提示：想让每个稿件都带上主播名，加一个 {主播}（等同 {主播名} / {昵称}）。');
}

function bindCfg() {
  /* 设置面板瘦身：分组折叠 + 搜索 + 常用快跳 + 危险标注（纯增强层，见 enhanceCfgPanel 的说明） */
  enhanceCfgPanel();
  $$('#cfgBody [data-pwd]').forEach((b) => b.onclick = () => {
    const el = document.getElementById(b.dataset.pwd);
    const show = el.type === 'password';
    el.type = show ? 'text' : 'password';
    b.textContent = show ? '隐藏' : '显示';
  });
  $$('#cfgBody [data-test]').forEach((b) => b.onclick = async () => {
    const kind = b.dataset.test;
    const resEl = document.getElementById('res-' + kind);
    const old = b.textContent;
    b.disabled = true; b.textContent = '测试中…';
    resEl.className = 'testres'; resEl.textContent = '';
    try {
      const body = kind === 'llm' ? { target: 'llm', slot: 'summary' }
        : kind === 'alert' ? { target: 'alert', channel: b.dataset.ch || 'serverchan' }
        : { target: 'bililive' };
      const r = await api('/api/test', { method: 'POST', body });
      resEl.className = 'testres ' + (r.ok ? 'ok' : 'err');
      resEl.textContent = r.message || (r.ok ? '成功' : '失败');
    } catch (e) {
      resEl.className = 'testres err';
      resEl.textContent = e.message;
    }
    b.disabled = false; b.textContent = old;
  });
  const preset = $('#c_llmPreset');
  preset.onchange = () => {
    const p = LLM_PRESETS[preset.value];
    if (preset.value !== 'custom') {
      $('#c_llmUrl').value = p.url;
      $('#c_llmModel').value = p.model;
    }
    $('#presetNote').textContent = p.note;
    updateEscalationHint();
  };
  $('#c_llmModel').oninput = updateEscalationHint;
  $('#c_llmSelectModel').oninput = updateEscalationHint;
  $('#c_defaultTags').oninput = updateTagHint;
  if ($('#c_identityTags')) $('#c_identityTags').oninput = updateIdentityTagHint;

  // 首片发布时间：快捷按钮 + 实时预览
  const firstAt = $('#c_firstPublishAt');
  if (firstAt) {
    firstAt.oninput = renderDtimePlanPreview;
    firstAt.onchange = renderDtimePlanPreview;
  }
  const clearBtn = $('#btnClearFirstAt');
  if (clearBtn) clearBtn.onclick = () => {
    if (firstAt) firstAt.value = '';
    renderDtimePlanPreview();
    toast('已改为自动排期');
  };
  /** 本地时间 → datetime-local 需要的 YYYY-MM-DDTHH:mm */
  const toLocalInput = (ms) => {
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  $$('#cfgBody [data-quick]').forEach((b) => (b.onclick = () => {
    if (!firstAt) return;
    const kind = b.dataset.quick;
    const now = Date.now();
    let ms;
    if (kind === '+3h') {
      ms = now + 3 * 3600_000;
    } else {
      const d = new Date(now);
      d.setDate(d.getDate() + 1);
      d.setHours(kind === 'tomorrow8' ? 8 : 20, 0, 0, 0);
      ms = d.getTime();
    }
    // 不能早于本项目余量下限（提交后 1200 秒）；更早的话实际也会被推迟，这里直接给合法值更省事
    const floor = now + 1200_000;
    if (ms < floor) ms = floor;
    firstAt.value = toLocalInput(ms);
    renderDtimePlanPreview();
  }));

  const tgl = (id, cb) => { const el = $(id); if (el) el.onclick = () => { const on = el.classList.toggle('on'); cb(on, el); }; };
  tgl('#c_burnDanmaku', (on, el) => el.nextElementSibling.textContent = on ? '开启（原生弹幕，无错字风险）' : '关闭（切片画面无弹幕）');
  tgl('#c_burnSubtitles', (on, el) => el.nextElementSibling.textContent = on ? '开启（字幕烧进画面）' : '关闭（画面只有弹幕）');
  /* 热词开关：文案要跟着状态变 —— 关掉时用户唯一能看到的反馈就是这行字，
     否则"点了没反应"会被当成按钮坏了（这个坑本项目在其它开关上踩过）。 */
  tgl('#c_funasrHotwords', (on, el) => el.nextElementSibling.textContent = on ? '开启（推荐）' : '关闭');
  tgl('#c_funasrTimestamps', (on, el) => el.nextElementSibling.textContent = on ? '开启（时间戳偏差 ±0.2s，推荐）' : '关闭（退化成 VAD 段粒度，偏差 ±2s）');
  /* 解码器精度开关：关 = 不发这个字段（fp32 默认）。文案跟着状态变，顺带把实测数字写在脸上 ——
     "省 1.1 GB 显存、推理慢 10%"是这个开关唯一的取舍，用户不需要去翻文档。 */
  tgl('#c_funasrBf16', (on, el) => el.nextElementSibling.textContent = on ? '开启（显存 −33%，推理 +10%）' : '关闭（fp32 默认，显存多占约 1.1 GB）');
  /* 多直播间：第 1 行是主房间（**id 保持 `c_roomId`** ——「常用」快跳、配置覆盖检查、
     读取按钮都按这个 id 找它，换 id 会连累三处），「＋ 添加直播」加的行在保存时收进 `room.roomIds`。
     「从 biliLive-tools 读取」（2026-10-13 用户要求：不要手打）只填输入框、不自动保存 ——
     配置写入仍由「保存」按钮走同一条路，行为可预期。 */
  {
    const list = $('#roomList');
    const rowsOf = () => (list ? Array.from(list.querySelectorAll('.roomrow')) : []);
    /** 第一行不允许删（主直播间必填）；其余行显示「移除」。
        主行用 visibility 而不是 display 隐藏：按钮仍然占位，几行输入框才对得齐（实测差 46px）。 */
    const syncRows = () => {
      rowsOf().forEach((row, i) => {
        const tag = row.querySelector('.roomtag');
        if (tag) tag.textContent = i === 0 ? '主' : '';
        const del = row.querySelector('[data-room-del]');
        if (del) del.style.visibility = i === 0 ? 'hidden' : '';
      });
    };
    const bindDel = (row) => {
      const del = row.querySelector('[data-room-del]');
      if (del) del.onclick = () => { row.remove(); syncRows(); };
    };
    rowsOf().forEach(bindDel);
    /* 记住最后聚焦的房间输入框：点「读取」按钮后焦点已经不在输入框上了，
       所以必须在点击的那一刻就锁定目标，否则永远只会填到第一行。 */
    let focusedInput = null;
    if (list) {
      list.addEventListener('focusin', (e) => {
        const t = e.target;
        if (t && t.tagName === 'INPUT') focusedInput = t;
      });
    }
    const addRoomRow = (value) => {
      if (!list) return null;
      const row = document.createElement('div');
      row.className = 'roomrow';
      row.innerHTML = '<input class="inp" data-room-extra placeholder="附加直播间，例如 12345678"><span class="roomtag"></span><button class="btn-sm" data-room-del title="移除这个直播间">移除</button>';
      const input = row.querySelector('input');
      if (input) input.value = value || '';
      list.appendChild(row);
      bindDel(row);
      syncRows();
      return input;
    };
    const addBtn = $('#btnAddRoom');
    if (addBtn) addBtn.onclick = () => { const el = addRoomRow(''); if (el) el.focus(); };
    syncRows();

    const b = $('#btnFetchRooms');
    if (b) {
      b.onclick = async () => {
        const hint = $('#roomPickHint');
        const box = focusedInput && document.contains(focusedInput) ? focusedInput : $('#c_roomId');
        if (!hint || !box) return;
        hint.textContent = '读取中…';
        try {
          const r = await (await fetch('/api/llc-rooms')).json();
          const rooms = r.rooms || [];
          if (!rooms.length) {
            hint.innerHTML = '没读到房间号：' + esc(r.error || '（biliLive-tools 里还没配直播间）') + '。可以在它的「设置 → 录制」里先添加直播间。';
            return;
          }
          if (rooms.length === 1) {
            box.value = rooms[0].roomId;
            hint.innerHTML = '已填入 <b>' + esc(rooms[0].roomId) + '</b>' + (rooms[0].remark ? '（备注：' + esc(rooms[0].remark) + '）' : '') + ' —— 记得点「保存」生效。';
            return;
          }
          /* 多个房间：列出来让用户点（带备注与开关状态，否则认不出哪个是哪个） */
          hint.innerHTML =
            '读到 ' + rooms.length + ' 个直播间，点一个填入：' +
            rooms
              .map((x) => {
                const tag = [x.remark ? esc(x.remark) : '', x.open === false ? '未开启' : '', x.autoPartMerge ? '自动合并分P' : ''].filter(Boolean).join(' · ');
                return `<button class="btn-sm" data-room="${esc(x.roomId)}">${esc(x.roomId)}${tag ? '（' + tag + '）' : ''}</button>`;
              })
              .join(' ');
          hint.querySelectorAll('[data-room]').forEach((el) => {
            el.onclick = () => {
              box.value = el.getAttribute('data-room') || '';
              hint.innerHTML = '已填入 <b>' + esc(box.value) + '</b> —— 记得点「保存」生效。（当前配置里是 ' + esc(r.current || '空') + '）';
            };
          });
        } catch (e) {
          hint.innerHTML = '读取失败：' + esc(e.message);
        }
      };
    }
  }
  /* 边录边转写（P1-6）：文案跟着状态变，并在"刚打开"时明确提示要重启 ——
     否则用户点了、看着是开的，而预转写循环要等下次启动才创建（这一点在实现里是刻意的）。 */
  tgl('#c_incrementalEnabled', (on, el) => el.nextElementSibling.textContent = on ? '开启（录完只剩最后一段要转）· 需重启服务才生效' : '关闭（等整段录完才开始转）');
  { const cp = $('#btnCopyHotWords'); if (cp) cp.onclick = () => copyText(hotWordsFromForm().perLine, '热词（一行一个）'); }
  { const cp = $('#btnCopyHotWords2'); if (cp) cp.onclick = () => copyText(hotWordsFromForm().commaSeparated, '热词（逗号分隔）'); }
  // 分P 标题模板实时预览：模板写错（变量拼错）肉眼很难发现，这里直接渲染出来
  {
    const el = $('#c_partTitleTemplate');
    const prev = $('#partTitlePreview');
    const render = () => {
      if (!el || !prev) return;
      const tpl = el.value.trim();
      if (!tpl) { prev.innerHTML = '当前：<span class="mono-sm">P3 有人中了20次红包？主播直呼搞不懂</span>（默认）'; return; }
      const sample = ['有人中了20次红包？主播直呼搞不懂', '主播漏看前辈弹幕连声道歉：我眼神真不行'];
      const out = sample.map((t, i) => renderPartTitleClient(tpl, { n: i + 3, title: t, anchor: '甲主播', date: '2026-09-20', mainTitle: '已进入后半夜后悔时代 2026-09-20', kind: '切片' }));
      const bad = /\{[a-zA-Z]+\}/.test(out.join(''));
      prev.innerHTML = `预览：<span class="mono-sm">${out.map((x) => esc(x)).join('<br>')}</span>` +
        (bad ? ' <span style="color:#c8811a">⚠ 有变量没被替换 —— 检查拼写（可用 {n} {title} {anchor} {date} {mainTitle} {kind}）</span>' : '');
    };
    if (el) { el.oninput = render; render(); }
  }
  { const ab = $('#btnAuditCurrent'); if (ab) ab.onclick = () => {
    const t = state.tasks[0];
    if (!t) { toast('还没有任务'); return; }
    closeCfg();
    state.activeId = t.id;
    loadDetail().then(() => {
      const btn = document.querySelector('[data-act="publish-audit"]');
      if (btn) btn.click(); else toast('请在该场任务详情页点「投稿体检」');
    }).catch((e) => toast(e.message));
  }; }

  // MCP 接口：把端点、token 与可直接粘贴的接入命令摊给用户
  // 为什么必须做成界面：token 在 config.json 里，让用户自己去翻文件再拼命令，等于没做这个功能。
  { const mb = $('#btnMcp'); if (mb) mb.onclick = async () => {
    try {
      const r = await api('/api/mcp');
      const cmd = (id, label, text) => `
        <div style="margin-top:10px"><div style="font-size:12px;color:var(--text-3);margin-bottom:4px">${label}</div>
        <pre class="raw" style="white-space:pre-wrap;word-break:break-all;cursor:pointer" data-copy="${esc(text)}" title="点击复制">${esc(text)}</pre></div>`;
      openInfo('MCP 接口（Agent 接入）', `
        <p style="font-size:13px">状态：${r.enabled
          ? (r.paired ? '<b style="color:#2a7">已启用，已配对</b>' : '<b style="color:#c8811a">已启用，但还没生成 token（重启服务会自动生成）</b>')
          : '<b style="color:#c33">未启用</b>（config.json 里把 mcp.enabled 设为 true，重启后生效）'}<br>
        端点：<span class="mono-sm">${esc(r.endpoint)}</span>　共 <b>${r.toolCount}</b> 个工具（其中只读 <b>${r.readOnlyToolCount}</b> 个）</p>
        <h4 style="margin-top:14px">接入命令（点击代码块即复制）</h4>
        ${cmd('claude', 'Claude Code', r.commands.claudeCode)}
        ${cmd('codex', 'Codex', r.commands.codex)}
        ${cmd('cursor', 'Cursor（~/.cursor/mcp.json 里的片段）', r.commands.cursorJson)}
        ${cmd('curl', '动手验证（列出所有工具）', r.commands.curl)}
        <h4 style="margin-top:14px">安全边界</h4>
        <ul style="font-size:var(--fs-s);color:var(--text-2);padding-left:18px;line-height:1.7">
          ${r.safety.map((s) => `<li>${esc(s)}</li>`).join('')}
        </ul>
        <h4 style="margin-top:14px">Agent 能做什么</h4>
        <p style="font-size:var(--fs-s);color:var(--text-2);line-height:1.7">
        可以直接对它说：「现在有什么任务在跑」「<span class="mono-sm">manual-xxx</span> 这场为什么没出片」「把这场从 ANALYZED 重跑」
        「我新录的那场怎么没导入」「取消删源录播」「这场跑一次投稿体检」。</p>`);
      $$('#infoBody [data-copy]').forEach((el) => (el.onclick = () => {
        const text = el.dataset.copy || '';
        void navigator.clipboard?.writeText(text).then(
          () => toast('已复制到剪贴板'),
          () => toast('复制失败，请手动选中复制', 4000),
        );
      }));
    } catch (e) { toast('读取 MCP 信息失败：' + e.message, 5000); }
  }; }

  tgl('#c_fullVideoHasDanmaku', (on, el) => el.nextElementSibling.textContent = on ? '是（切片时不再传 ASS，避免叠双层弹幕）' : '否（切片时传入整场 ASS）');
  tgl('#c_recordDecisions', (on, el) => el.nextElementSibling.textContent = on ? '开启（记录你的勾选与取消，用于观察 LLM 的偏好偏差）' : '关闭（无法分析选片偏好）');
  tgl('#c_isOnlySelf', (on, el) => el.nextElementSibling.textContent = on ? '开启' : '关闭（公开可见）');
  tgl('#c_autoPublish', (on, el) => el.nextElementSibling.textContent = on ? '全自动（分析完直接排期发布）' : '半自动（需确认后发布）');
  tgl('#c_immediatePublish', (on, el) => {
    el.nextElementSibling.textContent = on ? '开启 —— 稿件过审后直接公开' : '关闭 —— 按公式定时发布';
    paintScheduleHints(clipModeFromForm());
  });
  /* 切片投稿方式：两选一（追加切片投稿 / 单独投稿）。
     chip 是多选语义，这里手动互斥 —— 点一个必须关掉另一个，否则界面上会出现"两个都亮"，
     而保存时只能取一个（那种界面就是在骗人）。 */
  {
    const chips = $$('#c_clipPublishMode .chip');
    const paint = (mode) => {
      chips.forEach((el) => el.classList.toggle('on', el.dataset.mode === mode));
      const h = document.getElementById('hintClipMode');
      if (h) {
        h.className = 'hintline';
        h.textContent = clipModeHint(mode, state.bootstrap.config.publish);
      }
      /* multiPart 是这个开关的实现口径，界面上把它如实显示出来：
         用户手改过 config.json 时两个值可能打架，先看见比保存后才发现好。 */
      const mp = state.bootstrap.config.publish.multiPart;
      if (h && ((mode === 'append') !== (mp === true))) {
        h.className = 'hintline warn';
        h.textContent += `（注意：config.json 里 publish.multiPart=${mp}，与这个选择不一致 —— 保存后二者会被同步成一致）`;
      }
      /* ★ 排期三处提示跟着**当前选中**的模式重画（还没保存也立刻反映）：
         单独投稿是「固定定时投稿 + 设置里的间隔/抖动」，唯一真正不参与的旋钮是
         publish.immediatePublish。 */
      paintScheduleHints(mode);
    };
    chips.forEach((el) => (el.onclick = () => paint(el.dataset.mode === 'standalone' ? 'standalone' : 'append')));
    paint(clipModeOf(state.bootstrap.config.publish));
  }
  tgl('#c_deleteRaw', (on, el) => el.nextElementSibling.textContent = on ? '开启（省空间）' : '关闭');
  tgl('#c_keepOnFail', (on, el) => el.nextElementSibling.textContent = on ? '开启（便于重跑）' : '关闭');
  $$('#c_channels .chip').forEach((ch) => ch.onclick = () => ch.classList.toggle('on'));
  $$('#c_events .chip').forEach((ch) => ch.onclick = () => ch.classList.toggle('on'));
  const gap = $('#c_submitGapSec');
  gap.oninput = () => {
    const v = Number(gap.value);
    const el = $('#hintGap');
    if (!(v >= 1200)) {
      el.className = 'hintline warn';
      el.textContent = `本项目硬约束 #4 要求定时发布距该稿件提交时刻 ≥ 1200 秒，${v} 秒会被拦下（B站平台底线是 300 秒，多出来的是防风控的自律余量）`;
    } else {
      el.className = 'hintline ok';
      el.textContent = `✓ 合规（≥ 1200 秒）`;
    }
  };
  /* 「相邻切片间隔 / 随机抖动」一改就立刻重算公式 —— 用户最需要当场看到的是
     「我填的 100 会不会被抬到 300」「我填的 900 会不会被压」，而不是保存后才发现。
     口径仍只由 `scheduleFormula()` 一份实现给出（与服务端同一套规则）。 */
  const repaintFormulaFromForm = () => {
    const pub = { ...((state.bootstrap && state.bootstrap.config && state.bootstrap.config.publish) || {}) };
    for (const [sel, key] of [['#c_submitGapSec', 'submitGapSec'], ['#c_clipGapSec', 'clipGapSec'], ['#c_jitterSec', 'jitterSec']]) {
      const el = $(sel);
      if (!el) continue;
      const v = Number(el.value);
      if (Number.isFinite(v)) pub[key] = v;
    }
    const f = scheduleFormula(pub, clipModeFromForm());
    const el = $('#hintGap');
    if (el) {
      el.className = f.warn ? 'hintline warn' : 'hintline ok';
      el.textContent = f.text;
    }
  };
  for (const sel of ['#c_clipGapSec', '#c_jitterSec']) {
    const el = $(sel);
    if (el) el.oninput = repaintFormulaFromForm;
  }
}

/**
 * 把术语表两个输入框的内容整理成数组。
 * 一行一个，忽略空行与以 # 开头的注释行。
 */
function linesOf(id) {
  const el = document.getElementById(id);
  if (!el) return [];
  return String(el.value || '')
    .split('\n')
    .map((s) => s.trim())
    .filter((s) => s && !s.startsWith('#'));
}

/**
 * 解析纠错规则输入框：每行 `错→对`，正则加 `re:` 前缀。
 *
 * 分隔符接受 `→`、`->`、`=>`（用户从别处粘贴时三种都可能出现）。
 * 认不出来的行会被收集起来提示，而不是静默丢弃 —— 静默丢弃会让人以为规则生效了。
 */
function parseReplacementLines(text) {
  const out = [];
  const bad = [];
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    const m = /^(re:)?([\s\S]*?)\s*(?:→|->|=>)\s*([\s\S]*)$/.exec(line);
    if (!m) { bad.push(line); continue; }
    const from = m[2].trim();
    const to = m[3].trim();
    if (!from) { bad.push(line); continue; }
    out.push({ from, to, ...(m[1] ? { regex: true } : {}) });
  }
  return { out, bad };
}

/**
 * 分P 标题模板的前端渲染（与服务端 `renderPartTitle` 同一套规则）。
 *
 * 为什么在前端也实现一份：模板是用户在输入框里现敲的，必须**边敲边看**。
 * 为了不让两份实现漂移，这里只支持同样的 6 个变量，未知变量原样保留并给出警告
 * （服务端行为一致：未知变量不替换）。
 */
function renderPartTitleClient(template, vars) {
  const map = { n: vars.n, title: vars.title, anchor: vars.anchor, date: vars.date, mainTitle: vars.mainTitle, kind: vars.kind };
  return String(template || 'P{n} {title}')
    .replace(/\{(n|title|anchor|date|mainTitle|kind)\}/g, (_, k) => String(map[k] ?? ''))
    .replace(/\s{2,}/g, ' ')
    .trim();
}

          <div class="row ${c.wouldOverwrite && c.wouldOverwrite.length ? 'bad' : ''}"><span class="t">${c.wouldOverwrite && c.wouldOverwrite.length ? '!' : '·'}</span><span class="s"><b>继续保存会覆盖掉的字段</b><br>${list(c.wouldOverwrite, '（无 —— 界面上的值与磁盘一致，重新加载后重试即可）')}</span></div>
        </div>
        <p style="color:var(--text-3)">磁盘版本 <code>${esc(c.actual)}</code> · 界面版本 <code>${esc(c.expected)}</code></p>
        <p><b>推荐「重新加载」</b>：把外部改动读进表单，确认无误后再保存。只有当你确定要以界面为准时才用「强制覆盖」。</p>
        <div style="display:flex;gap:8px;margin-top:12px">

          <button class="btn-sm" data-cfgfix="force">强制覆盖（以界面为准）</button>
        </div>`, c.hint);
      $$('#infoBody [data-cfgfix]').forEach((b) => (b.onclick = async () => {
        closeInfo();
        if (b.dataset.cfgfix === 'reload') {
          await openCfg();

        } else {
          await saveCfg(true);
        }
      }));
    } else {
      toast('保存失败：' + e.message, 5000);
    }
  }
  btn.disabled = false; btn.textContent = '保存配置';
}

/**
 * 读「切片投稿方式」这一组 chip 的当前选择（两选一，默认「追加切片投稿」）。
 *
 * 为什么单独成函数：渲染初值、点击切换、saveCfg 存盘三处都要用同一个口径 ——
 * 各写一遍迟早会漂移（那种漂移的表现是"界面上选的是单独投稿、存下去是追加"，最难查）。
 */
function clipModeFromForm() {
  const on = $$('#c_clipPublishMode .chip').find((el) => el.classList.contains('on'));
  return on && on.dataset.mode === 'standalone' ? 'standalone' : 'append';
}

/**
 * 相邻切片间隔的**平台底线**（秒）：B站 要求每片的 dtime 晚于**它自己**的提交时刻 300 秒。
 *
 * 与服务端 `STANDALONE_CLIP_GAP_SEC`（`src/config.ts`）是同一个数。这里重复一个常量是
 * **故意的**：设置面板要在用户还没保存、只是切换「切片投稿方式」时就把生效值算出来给用户看，
 * 而那时还没有服务端算好的口径可读。两边算法必须一致（间隔 = max(300, 用户值)、
 * 抖动 = min(用户值, max(0, 间隔 - 30))），`tools/verify-clip-gap-ui.ts` 会拿生产函数对账。
 */
const CLIP_GAP_FLOOR_SEC = 300;

/**
 * 「公式」那一行的**唯一**生成处（首次渲染与切换模式/开关后刷新共用）。
 *
 * 为什么必须这么写：这句话是用户核对 dtime 的唯一凭据。曾经的错误形态有两种 ——
 *   ① 单独投稿下写死 `random(0,0)`、`×300`，而用户明明在设置里填了 500/120（本次要修的）；
 *   ② 抖动被夹取时静默显示成"没夹"，用户以为生效了，实际每片间隔比预期小。
 * 所以这里两个数一律按**生效值**写，并且凡是被抬/被夹就在后面括号里说清原因。
 *
 * @returns `{ text, warn }` —— `warn` 为 true 时调用方把这一行染成警示色（有值没完全生效）。
 */
function scheduleFormula(publish, mode) {
  const p = publish || {};
  const standalone = mode === 'standalone';
  const submitGap = Number(p.submitGapSec) || 1200;
  /* 用户填的数（负数/NaN 一律当没填）：这一步只做"取值"，不做任何业务夹取 */
  const wantGapRaw = Math.floor(Number(p.clipGapSec));
  const wantGap = Number.isFinite(wantGapRaw) && wantGapRaw > 0 ? wantGapRaw : CLIP_GAP_FLOOR_SEC;
  const wantJitterRaw = Math.floor(Number(p.jitterSec));
  const wantJitter = Number.isFinite(wantJitterRaw) && wantJitterRaw > 0 ? wantJitterRaw : 0;
  /* 生效值：与服务端 resolveClipPublishSchedule + effectiveJitterSec 完全同一套规则 */
  const gap = standalone ? Math.max(CLIP_GAP_FLOOR_SEC, wantGap) : wantGap;
  const cap = Math.min(wantJitter, Math.max(0, gap - 30));

  const reasons = [];
  if (standalone && wantGap < CLIP_GAP_FLOOR_SEC) {
    reasons.push(`你填的间隔 ${wantGap} 秒低于 B站 平台底线 ${CLIP_GAP_FLOOR_SEC} 秒，实际按 ${gap} 秒排`);
  }
  if (wantJitter > cap) {
    reasons.push(`你填的抖动 ${wantJitter} 秒已自动压到 ${cap} 秒（抖动必须小于片间隔，否则排期倒挂）`);
  }

  let text = `公式：dtime = 提交时刻 + ${submitGap} + (N-1)×${gap} + random(0,${cap})`;
  if (standalone) text += '　（单独投稿：固定定时投稿，片间隔与抖动都按上面这两项生效）';
  if (reasons.length) text += `　（${reasons.join('；')}）`;
  return { text, warn: reasons.length > 0 };
}

/**
 * 按**当前选中的模式**刷新与排期有关的三处提示（还没保存也立刻反映）。
 *
 * ★ 2026-10-17 口径更正（用户要求「这里改成对定时投稿也生效」）：
 *   单独投稿下「相邻切片间隔 / 随机抖动」**对切片生效**，只有两条硬边界 ——
 *   ① 间隔不得低于平台底线 300 秒；② 抖动必须小于间隔（防排期倒挂）。
 *   唯一仍不参与的是「立即发布」（固定定时投稿，不传 dtime 就没有"按间隔发"）。
 *   所以这里不再说"那两项不生效"，而是把**生效值**与**被抬/被夹的原因**一起写出来：
 *   这类"改了配置没完全生效"比完全不生效更容易让人抓狂。
 */
function paintScheduleHints(mode) {
  const publish = (state.bootstrap && state.bootstrap.config && state.bootstrap.config.publish) || {};
  const standalone = mode === 'standalone';
  const f = scheduleFormula(publish, mode);

  /* ① 公式：写**生效值**，被抬/被夹要说明原因 */
  const g = document.getElementById('hintGap');
  if (g) {
    g.className = f.warn ? 'hintline warn' : 'hintline ok';
    g.textContent = f.text;
  }

  /* ② 「相邻切片间隔」下方的生效说明 */
  const u = document.getElementById('hintClipGapUse');
  if (u) {
    u.className = 'hintline';
    u.textContent = standalone
      ? '当前是「单独投稿」：切片固定走定时投稿，片间隔就用上面这个数 —— 低于 300 秒会被抬到 300（B站 要求每片 dtime 晚于它自己的提交时刻 300 秒）；下面的「随机抖动」也生效，上限会被压到「片间隔 − 30」以内以保证不倒挂。'
      : '生效前提：① 关闭「立即发布」（立即发布不传 dtime，没有发布时间可排）；② 切片投稿方式选「单独投稿」（多分P 稿件只有一个发布时间，片子之间排不开）。';
  }

  /* ③ 「立即发布」下方的说明：单独投稿下它对切片失效（但对完整版仍有效） */
  const imm = document.getElementById('hintImmediate');
  if (imm) {
    const sw = $('#c_immediatePublish');
    const isOn = Boolean(sw && sw.classList.contains('on'));
    if (standalone) {
      imm.className = 'hintline warn';
      imm.textContent =
        '当前是「单独投稿」：切片固定定时投稿（片间隔见上方「相邻切片间隔」，最低 300 秒），这个开关对切片不生效' +
        '—— 但由本服务投完整版时仍按它走（开启则过审即公开）。';
    } else {
      imm.className = isOn ? 'hintline warn' : 'hintline';
      imm.textContent = isOn
        ? '⚠️ 投稿不带 dtime，稿件过审即公开。这会绕过本项目硬约束 #4（dtime ≥ 提交后 1200 秒）—— 该约束是防风控的自律措施，不是 B站规则。试跑期建议关闭。'
        : 'B站只在「传了 dtime」时才要求它 ≥ 提交后 2 小时；本模式满足硬约束 #4。';
    }
  }
}

/**
 * 「切片投稿方式」的说明文案（纯文本：渲染时过 esc()、切换时用 textContent，都不解析标签）。
 *
 * 必须写清楚差别 —— 光看「追加 / 单独」两个词猜不出实际后果：
 * 等不等完整版稿件、占几个每日额度、还能不能错峰。
 */
function clipModeHint(mode, publish) {
  const wait = Number(publish && publish.resumeWaitMin) || 90;
  const wantGap = Number(publish && publish.clipGapSec) || 300;
  if (mode === 'standalone') {
    /* ★ 2026-10-17：间隔/抖动在这里**是生效的**（间隔 300 保底、抖动 < 间隔），
       文案必须跟着改 —— 否则用户会因为这句「不参与切片排期」而不敢动那两个控件。 */
    const gap = Math.max(CLIP_GAP_FLOOR_SEC, wantGap);
    const jitter = Math.min(Math.max(0, Number(publish && publish.jitterSec) || 0), Math.max(0, gap - 30));
    return (
      `单独投稿：每个切片各自投一个稿件（标题/封面/标签各自独立），固定走定时投稿、每片相隔 ${gap} 秒` +
      `（${gap % 60 === 0 ? `${gap / 60} 分钟` : `${Math.floor(gap / 60)} 分 ${gap % 60} 秒`}）` +
      `${jitter > 0 ? `、每片再加 0~${jitter} 秒随机抖动` : '等距'}发布（间隔低于 300 秒会被抬到 300，抖动大于等于间隔会被压到「间隔 − 30」）。` +
      `也不用等 biliLive-tools 的完整版稿件（「立即发布」在该模式下对切片不参与 —— 固定定时投稿才有发布时间可排）。` +
      `代价是每片占 1 个每日额度。保存后对后续步骤生效（已投出的稿件不动）。`
    );
  }
  return (
    `追加切片投稿：切片作为「同一个稿件」的分P 追加进去（完整版归 biliLive-tools 时进它那个稿件，` +
    `归本服务时与完整版/纯享版合成 2+N 稿件）。一次投稿只占 1 个每日额度；代价是整个稿件只有一个发布时间` +
    `（相邻切片错峰不生效），且要等完整版稿件投出来（最多 ${wait} 分钟）。保存后对后续步骤生效。`
  );
}

/* 「报告文件已不存在」的提示条。
 *
 * 为什么要有它：`data/error-report/*.json` 会被清理，也可能当初就没写成功（磁盘满/被 kill），
 * 而 `errors.jsonl` 的事件行（同步追加）还在。服务端现在会**用事件行合成**一份最小报告
 * （`reportFileMissing: true`）。合成件缺的是请求上下文 / biliLive-tools 日志 / 堆栈 ——
 * 必须在弹窗里如实说明，否则用户会把"细节没了"当成"这个错本来就这么点信息"。
 * 三个页签（任务详情 / 健康 / 实时监控）共用这一份，避免以后改一处漏两处。 */
function reportNote(r) {
  const missing = !!(r && r.reportFileMissing);
  return {
    note: missing
      ? `<div class="warnbox">⚠ 原始报告文件已不存在（可能已被清理，或当初写盘失败）。以下内容由
         <code>errors.jsonl</code> 的事件行合成：时间、阶段、类型、消息、重试次数是真的，
         请求上下文 / biliLive-tools 侧日志 / 堆栈已不可得。</div>`
      : '',
    tip: missing ? '降级内容（仅事件记录）—— 已脱敏，可一键复制' : '报告已脱敏，可直接复制给开发者',
  };
}

/* ★ 2026-10-16（UI 评审 L-3）：窄屏（<1320px）的排期抽屉开关。
   为什么要有：三栏原来写死 280|1fr|300，1280 笔记本上中栏只剩 700px，
   工具条换行、底栏压住正文。现在窄屏把排期收成右侧抽屉，宽度还给中栏。 */
function openScheduleDrawer() {
  const el = $('#colRight'); if (!el) return;
  el.classList.add('open');
  const b = $('#btnSchedule'); if (b) b.setAttribute('aria-expanded', 'true');
}
function closeScheduleDrawer() {
  const el = $('#colRight'); if (!el) return;
  el.classList.remove('open');
  const b = $('#btnSchedule'); if (b) b.setAttribute('aria-expanded', 'false');
}
(function bindScheduleDrawer() {
  const b = $('#btnSchedule');
  if (b) b.onclick = () => {
    const el = $('#colRight');
    if (el && el.classList.contains('open')) closeScheduleDrawer(); else openScheduleDrawer();
  };
  /* 点抽屉外面任意地方收起（只在抽屉确实打开时生效，避免抢别处的点击） */
  document.addEventListener('click', (ev) => {
    const el = $('#colRight');
    if (!el || !el.classList.contains('open')) return;
    if (el.contains(ev.target) || (b && b.contains(ev.target))) return;
    closeScheduleDrawer();
  }, true);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeScheduleDrawer();
  });
})();

/* ★ 2026-10-16：主题切换。
   首屏的 data-theme 已经由 00-shell-head.html 里的内联脚本设好（避免闪白），
   这里只负责"点一下换一个"和把按钮文案同步过去。
   为什么不做成右上角的开关（switch）：它会和「全自动」「字幕」两个开关并排，
   三个长得一样的开关放在一起，用户会以为都是"功能开关"而不是"外观设置"。 */
(function bindThemeToggle() {
  const btn = $('#btnTheme');
  if (!btn) return;
  const root = document.documentElement;
  const isDark = () => root.getAttribute('data-theme') === 'dark';
  const paint = () => {
    const dark = isDark();
    btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    const t = $('#themeText'); if (t) t.textContent = dark ? '浅色' : '深色';
    const i = $('#themeIcon'); if (i) i.textContent = dark ? '☀' : '◐';
    btn.title = dark ? '切换到浅色主题' : '切换到深色主题';
  };
  btn.onclick = () => {
    const next = isDark() ? 'light' : 'dark';
    if (next === 'dark') root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    try { localStorage.setItem('liveauto.theme', next); } catch (e) { /* 隐私模式，忽略 */ }
    paint();
    /* 切主题会让 canvas / iframe 里的旧配色过时，提示一下但不强制刷新 */
    toast(next === 'dark' ? '已切换到深色主题' : '已切换到浅色主题');
  };
  /* 没手动选过时，跟随系统：用户在系统里切了深色，这里要跟着变 */
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onSys = (ev) => {
      let saved = null;
      try { saved = localStorage.getItem('liveauto.theme'); } catch (e) { /* 忽略 */ }
      if (saved) return;                  // 手动选过就以手动为准
      if (ev.matches) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
      paint();
    };
    if (mq.addEventListener) mq.addEventListener('change', onSys);
    else if (mq.addListener) mq.addListener(onSys);
  }
  paint();
})();

/* ---------------------------------------------------------------------------
 * 导入录播（参考 biliLive-tools 的做法：列出可导入的录播让用户点选）
 *
 * 为什么不再让人粘贴路径：实测那条路上有三个坑 ——
 *   1. 用户得自己去资源管理器复制绝对路径，还容易复制错；
 *   2. 同一个直播间一次录制会产生 3–5 个文件（原始 flv / `-弹幕版.mp4` / `_PART000.flv`），
 *      根本分不清该选哪个，**错选 `-弹幕版` 就会烧出双层弹幕**；
 *   3. 弹幕文件要自己找（文件名对不上就找不到），导错了要到流水线跑失败才发现。
 * 所以改成：清单（biliLive-tools 录制历史 ∪ 扫盘）→ 点选 → 预览（配对的弹幕、时长、
 * 预估 ASR 费用、是否已导入、是否仍在录制）→ 确认导入。手动填路径作为兜底保留。
 * ------------------------------------------------------------------------- */
$('#btnImport').onclick = () => {
  openInfo('导入录播文件', `
    <div class="barstrip" style="gap:8px">
      <span style="font-size:var(--fs-s);color:var(--text-3)">可导入的录播</span>
      <button class="btn-sm" id="impRefresh">刷新清单</button>
      <span id="impScanInfo" class="hintline" style="margin-left:auto"></span>
    </div>

    <details id="impDirsBox" style="margin:8px 0 12px">
      <summary style="cursor:pointer;font-size:var(--fs-s);color:var(--text-2)">扫描目录（录播没显示出来？在这里加）</summary>
      <div id="impDirs" style="margin-top:8px"></div>
      <div class="ctl" style="margin-top:8px">
        <input class="inp" id="impDirAdd" placeholder="例如 D:\\录播  或  ~/Videos/bili（支持 ~）">
        <button class="btn-sm" id="impDirAddBtn">添加</button>
      </div>
      <p class="hintline">biliLive-tools 自己的保存目录会自动包含（不用手填）；上面列出的「手动」目录才是额外要扫的。</p>
    </details>

    <div id="impList" class="timeline" style="max-height:320px;overflow:auto">
      <div class="row"><span class="s" style="color:var(--text-3)">正在扫描录播目录…</span></div>
    </div>

    <h3 style="margin:14px 0 6px">导入参数</h3>
    <div class="fields" style="grid-template-columns:1fr">
      <div class="field"><label>视频文件绝对路径（必填）</label><input class="inp" id="impVideo" placeholder="从上面的清单点选，或直接粘贴路径"></div>
      <div class="field"><label>弹幕文件绝对路径（可选，XML 用于信号分析 / ASS 用于烧录）</label><input class="inp" id="impDanma"></div>
      <div class="field"><label>标题（可选）</label><input class="inp" id="impTitle" placeholder="留空则用文件名"></div>
      <div class="field"><label>房间号（可选）</label><input class="inp" id="impRoom" value="${esc(BOOT.roomId)}"></div>
    </div>
    <div id="impPreview"></div>
    <p class="hintline">用途：补跑漏掉的场次、测试新 prompt、处理其他渠道获得的录播。会跑完整链路（受当前 dry-run / 付费开关约束）。</p>
    <div style="margin-top:12px"><button class="primary" style="margin-left:0" id="impGo">创建任务并开始处理</button></div>`);

  /**
   * 渲染扫描范围：哪些目录是自动来的（biliLive-tools 的保存目录）、
   * 哪些是用户手动加的（可移除），以及这次实际扫了哪些、历史查了哪些房间。
   *
   * 为什么要显示这些：用户反馈过「路径太绝对，我还有别的主播的录播没显示」——
   * 只有把「扫了哪里」摊开，用户才知道该往哪里加目录。
   */
  const renderDirs = (info) => {
    const box = $('#impDirs');
    if (!box) return;
    const rows = [];
    for (const d of info.detectedDirs || []) {
      rows.push(`<div class="row"><span class="t" style="color:var(--text-3)">自动</span><span class="s">
        <span class="mono-sm" style="word-break:break-all">${esc(d)}</span>
        <br><span style="color:var(--text-3);font-size:var(--fs-meta)">来自 biliLive-tools 的保存目录</span></span></div>`);
    }
    for (const d of info.configuredDirs || []) {
      rows.push(`<div class="row"><span class="t" style="color:var(--text-3)">手动</span><span class="s">
        <span class="mono-sm" style="word-break:break-all">${esc(d)}</span>
        <button class="btn-sm" data-rmdir="${esc(d)}" style="margin-left:8px">移除</button></span></div>`);
    }
    if (!rows.length) rows.push('<div class="row"><span class="s" style="color:var(--text-3)">（还没有额外目录）</span></div>');
    const scanned = (info.scanRoots || []).length
      ? `<p class="hintline">本次实际扫描：${(info.scanRoots || []).map((r) => `<span class="mono-sm">${esc(r)}</span>`).join('　')}</p>`
      : '';
    const hist = info.historyTotal
      ? `<p class="hintline">录制历史：查了 ${info.roomIds.length} 个房间（${(info.roomIds || []).join('、')}）共 ${info.historyTotal} 条${info.historyMissing ? `，其中 <span style="color:#c8811a">${info.historyMissing} 条的文件已不在磁盘</span>` : ''}</p>`
      : '';
    box.innerHTML = `<div class="timeline">${rows.join('')}</div>${scanned}${hist}`;
    $$('#impDirs [data-rmdir]').forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      try {
        await api('/api/recordings/dirs', { method: 'POST', body: { remove: b.dataset.rmdir } });
        toast('已移除扫描目录：' + b.dataset.rmdir);
        loadList(true);
      } catch (e) { toast('移除失败：' + e.message, 5000); b.disabled = false; }
    }));
  };

  /* 清单的两级结构：先按「正在录制 / 已录制完成 / 已导入过」分桶，再渲染。
     分桶与渲染分开，是为了让折叠只重画 DOM，不必重新请求 /api/recordings。 */
  let lastList = null;
  let lastBuckets = null;

  const rowHtml = (i) => {
    const c = lastList.candidates[i];
    const flags = [];
    /* 在「自动导入目录」里的文件要标出来：两条路（轮询自动捡 / 你手动点）会分别记成
       「自动导入」和「手动导入」，用户需要事先知道这件事，而不是事后奇怪为什么标手动 */
    const w = state.watch;
    if (w && w.enabled && (w.dirs || []).some((d) => c.videoPath.toLowerCase().startsWith(String(d).toLowerCase()))) {
      flags.push('<span style="color:var(--blue,#00aeec)">在自动导入目录</span>');
    }
    if (c.possiblyRecording) flags.push('<span style="color:#c8811a">可能仍在录制</span>');
    /* 碎片合并：同一场直播被 CDN 每隔几分钟断一次、落成好几个文件。
       两个状态都要标出来，否则用户看到"3.3 分钟的一场"会以为录短了：
         · 还在等 → 说明还剩多久（等安静后整场一起导入，不再一场拆成好几个任务）
         · 已合并 → 说明由几段拼成（导入后就是整场） */
    if (c.stitch && (c.stitch.fragmentCount || 1) > 1) {
      if (c.stitchWaiting) {
        const left = Math.max(0, Math.round((c.stitch.quietSec || 0) - (c.stitch.newestAgeSec || 0)));
        flags.push(`<span style="color:#c8811a">已拼 ${c.stitch.fragmentCount} 段碎片，等安静 ${left} 秒</span>`);
      } else {
        flags.push(`<span style="color:var(--blue,#00aeec)">已合并 ${c.stitch.fragmentCount} 段碎片（整场）</span>`);
      }
    }
    /* 合并不全：已经导过其中几段。剩下的仍会被导入（已导过的不会重复转写），
       所以要如实说明，否则用户看到"没标已导入"会以为是全新的。 */
    if (c.importedParts && c.importedParts.covered < c.importedParts.total) {
      flags.push(`<span style="color:#c8811a">已导过 ${c.importedParts.covered}/${c.importedParts.total} 段</span>`);
    }
    if (c.importedBy) flags.push('<span style="color:#c8811a">已导入</span>');
    if (c.hasDanmakuInPicture) flags.push('<span style="color:#c8811a">画面已烧弹幕</span>');
    if (!c.usable) flags.push('<span style="color:#c33">文件不可用</span>');
    if (c.asr && c.asr.cacheHits >= c.asr.windows && c.asr.windows > 0) flags.push('<span style="color:var(--green)">ASR 已缓存</span>');
    return `<div class="row" data-imp="${i}" style="cursor:pointer">
      <span class="t">${esc(c.group)}</span>
      <span class="s"><b>${esc(c.title)}</b> ${flags.join(' ')}<br>
        <span style="color:var(--text-3)">${esc(c.summary)}${c.asr ? ` · 预估 ASR ¥${c.asr.estCost.toFixed(2)}（${c.asr.cacheHits}/${c.asr.windows} 段已缓存）` : ''}</span><br>
        <span class="mono-sm" style="color:var(--text-3);word-break:break-all">${esc(c.videoPath)}</span></span>
    </div>`;
  };

  /** 可折叠分组的表头（点一下展开/收起）。展开状态记在 state.impOpen 上 —— 点「刷新清单」
      或缓存过期重扫时，不会把用户刚展开的那组又收回去。 */
  const groupHtml = (key, label) => {
    const open = !!state.impOpen[key];
    const rows = open ? lastBuckets[key].map(rowHtml).join('') : '';
    return `<div class="impgroup${open ? ' open' : ''}" data-g="${key}" title="${open ? '收起' : '展开'}这 ${lastBuckets[key].length} 场">
      <span class="caret">▸</span><span>${label}</span><span class="cnt">${lastBuckets[key].length} 场</span>
    </div>${rows}`;
  };

  const bindList = () => {
    /* 点分组表头 → 只重画清单（不重新扫描） */
    $$('#impList .impgroup[data-g]').forEach((el) => (el.onclick = () => {
      state.impOpen[el.dataset.g] = !state.impOpen[el.dataset.g];
      renderList();
    }));
    // 点一行 → 填进表单并预览
    $$('#impList .row[data-imp]').forEach((el) => (el.onclick = () => {
      const c = lastList.candidates[Number(el.dataset.imp)];
      if (!c) return;
      $$('#impList .row[data-imp]').forEach((x) => (x.style.background = ''));
      el.style.background = 'var(--bg-2,#f5f7fa)';
      $('#impVideo').value = c.videoPath;
      $('#impDanma').value = c.danmaPath || '';
      $('#impTitle').value = c.title || '';
      showPreview(c.videoPath);
    }));
  };

  const renderList = () => {
    const box = $('#impList');
    const b = lastBuckets;
    const parts = [];
    if (b.live.length) {
      /* 「正在录制」永远展开、不可折叠 —— 这正是用户打开这个对话框要看的东西 */
      parts.push(`<div class="impgroup live"><span>● 正在录制</span><span class="cnt">${b.live.length} 场</span></div>`);
      parts.push(b.live.map(rowHtml).join(''));
    } else {
      /* 没有在录的场次时给一句明确的话，否则用户只看到两个收起的表头会以为清单坏了 */
      parts.push('<div class="impgroup none"><span>● 当前没有正在录制的场次</span></div>');
    }
    if (b.idle.length) parts.push(groupHtml('idle', '已录制完成 · 未导入'));
    if (b.imported.length) parts.push(groupHtml('imported', '已导入过'));
    box.innerHTML = parts.join('');
    bindList();
  };

  /** 载入清单；refresh=1 时绕过服务端 20 秒缓存 */
  const loadList = async (refresh) => {
    const box = $('#impList');
    box.innerHTML = '<div class="row"><span class="s" style="color:var(--text-3)">正在扫描录播目录…</span></div>';
    try {
      const r = await api('/api/recordings' + (refresh ? '?refresh=1' : ''));
      renderDirs(r);
      $('#impScanInfo').textContent = `共 ${r.count} 场${r.cached ? '（缓存）' : ''}`;
      if (!r.candidates.length) {
        box.innerHTML = '<div class="row"><span class="s" style="color:var(--text-3)">没有找到可导入的录播。可在「设置」里加扫描目录，或直接在下面粘贴绝对路径。</span></div>';
        return;
      }
      /* 分桶：正在录制 / 已录制完成未导入 / 已导入过。
         判定顺序很重要 —— "已导入过但这会儿还在录"的文件要归到「正在录制」，
         因为它属于"当前正在发生、需要你注意"的那一类。 */
      const buckets = { live: [], idle: [], imported: [] };
      r.candidates?.forEach((c, i) => {
        if (c.possiblyRecording) buckets.live.push(i);
        else if (c.importedBy) buckets.imported.push(i);
        else buckets.idle.push(i);
      });

/* ============================================================================
 * 运行观测（/api/monitor + /api/observe，默认 5 秒自动刷新）
 *
 * 为什么再开一页（而不是塞进「实时监控」）：
 *   实时监控回答的是"任务视角"——这一场跑到哪、在等什么、为什么没动。
 *   但守着直播的人还要看**机器视角**的四件事，它们在监控页里没有位置：
 *     ① 边录边转到底转了没有（每场已完成 N/M 段、最近几轮 tick 的判定）
 *     ② 压制/上传在跑什么、进度多少、还要多久（biliLive-tools 的队列明细）
 *     ③ 我们自己的资源占用（进程内存、本地 ASR 的精度与显存峰值）
 *     ④ 最近几场（状态、切片数、开始时间）
 *
 * 2026-10-13 加，起因：验证「边录边转」时只能命令行 grep 日志。
 * 同日第二版（用户反馈"显示得不够清楚"）：
 *   · 时间全部转**本地时区**（日志存的是 UTC，原来直接显示 ⇒ 比用户的钟慢 8 小时）；
 *   · 判定区滤掉"循环已启动"这类噪声，并按类型上色；
 *   · 队列显示任务名 + 进度条 + 已跑时长 + ETA + 产物
 *     （biliLive-tools 的字段是 taskId/progress/output/startTime，原来按 id 取 ⇒ 界面一直是"-"）；
 *   · 顶部加总览条。
 *
 * ⚠️ 样式**从这里注入**，不写进 10-style.css：实测把 CSS 追加到那个文件会被构建当正文带进页面
 *    （截图里页面顶部出现一大段 CSS 源码）。注入式还顺带保证"只有进过这一页才加载这段样式"。
 * ========================================================================== */

const OBSERVE_INTERVAL_MS = 5000;

/** 一次性注入本页样式（幂等：靠 id 判断） */
function ensureObserveStyle() {
  if (document.getElementById('observe-style')) return;
  const el = document.createElement('style');
  el.id = 'observe-style';
  el.textContent = `
.obs-summary .card-head { align-items: baseline; gap: 12px; flex-wrap: wrap; }
.obs-sum { color: var(--text-3, #666); font-size: 13px; }
.obs-sum b { color: var(--text-1, #111); font-size: 15px; padding: 0 2px; }
.obs-tbl td, .obs-tbl th { padding-top: 9px; padding-bottom: 9px; }
.obs-strong { font-weight: 600; }
.obs-bar { display: inline-block; width: 120px; height: 7px; border-radius: 4px; background: var(--border, #e5e7eb); vertical-align: middle; overflow: hidden; }
.obs-bar > i { display: block; height: 100%; background: #3b82f6; border-radius: 4px; transition: width .3s ease; }
.obs-bar > i.ok { background: #10b981; }
.obs-note { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--border, #eee); font-size: 13px; }
.obs-note:first-of-type { border-top: none; }
.obs-sub { margin: 12px 0 4px; font-weight: 600; color: var(--text-3, #666); font-size: 13px; }
/* ④ 用表格：列清楚、一眼扫完（用户明确要的形态）。
   table-layout:fixed + 首列省略号 ⇒ 窄窗口也不会把后面的列挤出屏幕。 */
.obs-tl { table-layout: fixed; }
.obs-tl th:nth-child(1), .obs-tl td:nth-child(1) { width: 42%; }
.obs-tl th:nth-child(2), .obs-tl td:nth-child(2) { width: 17%; }
.obs-tl th:nth-child(3), .obs-tl td:nth-child(3) { width: 16%; }
.obs-tl th:nth-child(4), .obs-tl td:nth-child(4) { width: 25%; }
.obs-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.obs-nowrap { white-space: nowrap; }
.obs-dim { color: var(--text-3, #999); font-size: 12px; }
`;
  document.head.appendChild(el);
}

function stopObserve() {
  const o = state.obs;
  if (o && o.timer) {
    clearInterval(o.timer);
    o.timer = null;
  }
}

function startObserve() {
  const o = (state.obs = state.obs || { timer: null, data: null, paused: false });
  ensureObserveStyle();
  stopObserve();
  if (o.paused) return;
  o.timer = setInterval(() => {
    loadObserve().catch(() => {});
  }, OBSERVE_INTERVAL_MS);
}

async function loadObserve() {
  const o = (state.obs = state.obs || { timer: null, data: null, paused: false });
  const [mon, obs] = await Promise.all([
    fetch('/api/monitor').then((r) => r.json()),
    fetch('/api/observe').then((r) => r.json()),
  ]);
  o.data = { mon, obs, at: new Date() };
  const box = $('#otherPage');
  if (box && state.view === 'observe') renderObserve(box);
}

/* ── 显示辅助 ───────────────────────────────────────────────────────────── */

/** ISO / 毫秒 → 本地 时:分:秒（日志存 UTC，必须转，否则比用户的钟慢 8 小时） */
function obsTime(v) {
  if (!v) return '—';
  const d = typeof v === 'number' ? new Date(v) : new Date(String(v));
  if (Number.isNaN(d.getTime())) return String(v).slice(11, 19);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}

/** ISO → 本地 月-日 时:分（跨天时看得出是哪天） */
function obsStamp(v) {
  if (!v) return '—';
  const d = new Date(String(v));
  if (Number.isNaN(d.getTime())) return String(v);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function obsDur(sec) {
  if (sec === null || sec === undefined || Number.isNaN(sec)) return '—';
  const s = Math.round(sec);
  if (s < 60) return s + ' 秒';
  if (s < 3600) return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
  return (s / 3600).toFixed(1) + ' 小时';
}

function obsAgo(sec) {
  if (sec === null || sec === undefined || Number.isNaN(sec)) return '—';
  return obsDur(sec) + '前';
}

function obsMB(bytes) {
  if (!bytes && bytes !== 0) return '—';
  return bytes > 1073741824 ? (bytes / 1073741824).toFixed(2) + ' GB' : (bytes / 1048576).toFixed(1) + ' MB';
}

function obsBar(pct, kind) {
  const p = pct === null || pct === undefined ? null : Math.max(0, Math.min(100, pct));
  return `<span class="obs-bar"><i class="${kind || ''}" style="width:${p === null ? 0 : p}%"></i></span>`;
}

function obsFile(name, keep) {
  const s = String(name || '');
  const n = keep || 46;
  if (s.length <= n) return s;
  const ext = (s.match(/\.[a-z0-9]+$/i) || [''])[0];
  return s.slice(0, n - ext.length - 1) + '…' + ext;
}

/** 状态/类型 → 中文。映射表由服务端下发（见 server.ts 的 STATUS_LABELS），这里只做兜底。 */
function obsLabel(map, raw) {
  const key = String(raw ?? '');
  return (map && map[key]) || key || '—';
}
function obsStatusText(raw) {
  return obsLabel((state.obs && state.obs.data && state.obs.data.mon && state.obs.data.mon.statusLabels) || null, raw);
}
function obsClipStatusText(raw) {
  return obsLabel((state.obs && state.obs.data && state.obs.data.mon && state.obs.data.mon.clipStatusLabels) || null, raw);
}
function obsTypeText(raw) {
  return obsLabel((state.obs && state.obs.data && state.obs.data.mon && state.obs.data.mon.llcTypeLabels) || null, raw);
}
function obsQueueStatusText(raw) {
  return obsLabel((state.obs && state.obs.data && state.obs.data.mon && state.obs.data.mon.llcStatusLabels) || null, raw);
}

/* 说明：这里曾经有个 obsSteps() 画"五个阶段胶囊"。用户反馈"难看而且难懂"后删掉 ——
   阶段信息用状态文案表达（"转写中 3/10" / "已发布"）比五个胶囊更省地方也更好懂。
   组件删了，但把理由留在这里，免得以后又有人加回来。 */

function obsNoteKind(msg) {
  if (/让路/.test(msg)) return { cls: 'b-wait', label: '让路' };
  if (/已转 \d+\/\d+/.test(msg)) return { cls: 'b-done', label: '已转' };
  if (/本轮无新段可转/.test(msg)) return { cls: 'b-run', label: '无新段' };
  if (/没有候选场次|本轮无事/.test(msg)) return { cls: '', label: '空闲' };
  if (/出错|失败/.test(msg)) return { cls: 'b-fail', label: '出错' };
  return { cls: '', label: '其它' };
}

function renderObserve(box) {
  const o = state.obs && state.obs.data;
  if (!o) {
    box.innerHTML = '<div class="empty">加载中…</div>';
    return;
  }
  ensureObserveStyle();
  const { mon, obs } = o;
  const mem = obs.memory || {};
  const recording = obs.recording || [];
  const pre = obs.preTranscribe || [];
  const queue = obs.queue || [];
  const tl = obs.timeline || [];

  /* 现在有没有在录（录制器自报 + 文件是否在长）。
     ⚠️ 必须在这里声明：下面的判定行过滤要用它；漏声明会导致整个 renderObserve 抛 ReferenceError，
     页面永远停在“加载中…”（这个坑我踩过一次，靠“用了却没声明”的静态自查才发现）。 */
  const liveNow = Number((obs.recorder && obs.recorder.live) || 0) > 0 || recording.some((r) => r.growing);

  const notes = (obs.preTranscribeLog || [])
    .filter((l) => !/循环已启动/.test(l.msg))
    .slice(-6)
    .reverse();

  const qRows = queue
    .map((q) => {
      const pct = q.progress === null || q.progress === undefined ? null : q.progress;
      return `<tr>
        <td><span class="badge" title="${esc(q.type)}">${esc(obsTypeText(q.type))}</span></td>
        <td class="obs-strong">${esc(obsFile(q.name || q.taskId, 40))}</td>
        <td><span class="badge ${q.status === 'running' ? 'b-run' : ''}" title="${esc(q.status)}">${esc(obsQueueStatusText(q.status))}</span></td>
        <td>${obsBar(pct)} <span class="mono-sm">${pct === null ? '—' : pct + '%'}</span></td>
        <td class="mono-sm">${obsDur(q.elapsedSec)}</td>
        <td class="mono-sm">${q.etaSec === null || q.etaSec === undefined ? '—' : obsDur(q.etaSec)}</td>
        <td class="mono-sm" title="${esc(q.output || '')}">${esc(obsFile((q.output || '').split(/[\\/]/).pop() || '—', 34))}</td>
      </tr>`;
    })
    .join('');

  const recRows = recording
    .map(
      (r) => `<tr>
        <td class="obs-strong" title="${esc(r.name)}">${esc(obsFile(r.name, 52))}</td>
        <td class="mono-sm">${obsMB(r.sizeBytes)}</td>
        <td class="mono-sm">${r.rateMBps === null || r.rateMBps === undefined ? '—' : r.rateMBps.toFixed(2) + ' MB/s'}</td>
        <td class="mono-sm">${obsAgo(r.ageSec)}</td>
        <td>${r.growing ? '<span class="badge b-run">在写</span>' : '<span class="badge">已停</span>'}</td>
      </tr>`,
    )
    .join('');

  // 「进行中」= 仍在写或最近 30 分钟更新过；历史进度文件不计入（它只是缓存，不占界面）。
  // 必须声明在 preRows / preHistory 之前 —— 放后面就是 TDZ，整页渲染抛异常。
  const preActive = pre.filter((p) => p.stillWriting || Number(p.ageSec) <= 1800);
  const preRows = preActive
    .map((p) => {
      const pct = p.total > 0 ? Math.round((p.done / p.total) * 100) : 0;
      /* 每条记录都打状态标签（2026-10-14 用户两次问「没在录了为什么还有进度」）：
         这一栏读的是录像目录里的**进度文件**，不是"当前录制状态"，所以必须说清它属于哪种：
           · 仍在写 → 这一场正在录；
           · 已导入 → 那场已经进过流水线（记录留着只为命中缓存），不会再变；
           · 历史   → 超过 1 小时没更新且没查到对应任务（多半是旧场次留下的）。
      ★ 2026-10-15 用户报「文件对不上」：进度记录按"分段清单指纹"存，是**历史快照** ——
        同一场分段变多之后旧指纹还在，且记录的段数停在当时那一刻。所以这里：
        ① 被更新的指纹（superseded）单独标出来，不冒充当前进度；
        ② 记录的段数与**磁盘现有段数**不一致时，把磁盘数字也写出来（"记录 1/1 · 磁盘 4 段"），
           免得拿旧数字假装是现在。 */
      const state = p.superseded
        ? '<span class="badge">旧指纹</span>'
        : p.stillWriting
          ? '<span class="badge b-run">仍在写</span>'
          : p.imported
            ? '<span class="badge b-done">已导入</span>'
            : p.ageSec > 3600
              ? '<span class="badge">历史</span>'
              : '<span class="badge b-done">最近</span>';
      const segNote =
        Number(p.diskSegs) > Number(p.total)
          ? ` <span class="obs-dim" title="进度记录是历史快照，磁盘上这一场已经有更多分段">· 磁盘现有 ${p.diskSegs} 段</span>`
          : '';
      return `<tr>
        <td><span class="obs-strong">${esc(p.name)}</span><span class="obs-dim">${p.dir ? ' · ' + esc(p.dir) : ''}</span></td>
        <td>${obsBar(pct, 'ok')} <span class="mono-sm">${p.done}/${p.total} 段</span>${segNote}</td>
        <td>
          ${p.mode === 'fallback' ? '<span class="badge b-fail">已回退整段</span>' : '<span class="badge b-done">分段增量</span>'}
          ${state}
        </td>
        <td class="mono-sm">${obsAgo(p.ageSec)}</td>
      </tr>`;
    })
    .join('');
  /* 「进行中」只算**仍在写或最近 30 分钟更新过**的；其余算历史记录（保留在表里，但不计入数字）——
     否则一场直播结束、任务也被策略清理之后，这一栏会永远挂着"1 场有进度"。 */
  const preHistory = pre.length - preActive.length;

  /* 空闲时把“本轮跳过”这类纯噪声收起来（用户要求“干净、没有误解的界面”）；
     有直播时照常逐条显示，便于排障。 */
  const NOISE = new RegExp(["没有直播在录", "本轮跳过", "循环已启动", "本轮无事", "本轮无新段可转"].join("|"));
  const noteRows = (liveNow ? notes : notes.filter((l) => !NOISE.test(String(l.msg || ""))))
    .map((l) => {
      const k = obsNoteKind(l.msg);
      return `<div class="obs-note"><span class="badge ${k.cls}">${k.label}</span><span class="mono-sm">${obsTime(l.atIso || l.at)}</span><span>${esc(l.msg)}</span></div>`;
    })
    .join('');

  /* ④ 每场两行：第一行"标题 + 中文状态"，第二行"阶段链 + 切片数 + 开始时间 + 短 id"。
     为什么不用表格：窄窗口下后面的列会被切掉（用户截图里只剩"场次"一列），
     而"哪里在跑、跑到哪一步"恰恰是后面那几列的信息。 */
  /* ④ 表格（用户 2026-10-13 明确要求这个形态："UI 做成这样呢，中文标题"）。
     演进史，免得再走回头路：
       ① 只有一串 id 的表格 ⇒ 看不懂；
       ② 我改成"两行式 + 五个阶段胶囊" ⇒ 用户说"难看而且难懂"（已完成的场次五个胶囊全亮，等于没说）；
       ③ 收成两行式（无胶囊）⇒ 用户仍要**表格**这个形态。
     最终：**表格** + 第一列显示**中文标题**（id 放悬停） + 状态中文 + 时间本地且带"多久前"。
     时间由客户端按 createdAt 算（服务端不再下发冗余字段）。 */
  const tlRows = tl
    .map((t) => {
      const title = t.title && t.title.length > 1 ? t.title : String(t.id).replace(/^auto-/, '');
      const chip = /PUBLISHED/.test(t.status) ? 'b-done' : /FAIL|ERROR/.test(t.status) ? 'b-fail' : 'b-run';
      const startedSec = t.createdAt ? Math.max(0, Math.round((Date.now() - new Date(t.createdAt).getTime()) / 1000)) : null;
      return `<tr>
        <td class="obs-title" title="${esc(t.id)}">${esc(title)}</td>
        <td><span class="badge ${chip}" title="${esc(t.status)}">${esc(t.statusText || obsStatusText(t.status))}</span></td>
        <td class="obs-nowrap">${t.clips} 片 · 选中 ${t.selected}</td>
        <td class="obs-nowrap mono-sm">${esc(obsStamp(t.createdAt))}${startedSec === null ? '' : `<span class="obs-dim">（${obsAgo(startedSec)}）</span>`}</td>
      </tr>`;
    })
    .join('');

  const health = (obs.asrHealth || [])
    .slice(-3)
    .reverse()
    .map((h) => `<div class="obs-note"><span class="mono-sm">${obsTime(h.atIso || h.at)}</span><span>${esc(h.msg)}</span></div>`)
    .join('');

  /* ★ 2026-10-13 用户要求"做一个检测 biliLive-tools 的直播录制检测"。
     原来"录制中"是数**文件正在长**的个数（事后近似）；现在优先用 biliLive-tools 录制器自报的
     `liveInfo.living` / `state`（真信号），文件那套只作交叉校验与兜底。
     两个来源不一致时把两边都写出来 —— 不一致本身就是值得看的信息。 */
  const rec = (o.obs && o.obs.recorder) || { ok: false, recording: 0, live: 0, recorders: [] };
  const growingN = recording.filter((r) => r.growing).length;
  const recN = rec.ok ? Number(rec.live || 0) : null;
  const recLabel = !rec.ok
    ? `录制中 <b>?</b>（biliLive-tools 问不到）`
    : recN === 0 && growingN === 0
      ? `录制中 <b>0</b>（录制器全部空闲）`
      : `录制中 <b>${recN}</b>${growingN && growingN !== recN ? `（文件在写 ${growingN}）` : ''}`;
  const summary = [
    recLabel,
    /* ⚠️ 措辞必须把"两种场次"分开（2026-10-14 用户截图问「当检测到录制中时这里才会运行」）：
       原来只写「边录边转 N 场」，会被读成"正在录 N 场"—— 但它其实是**有预转写进度记录**的场次数，
       与"此刻在不在录"无关（录制结束后那一条会一直留着，等导入时命中）。
       现在写成「有进度 N 场（录制中 M 场）」，一眼能分清。 */
    preActive.length
      ? `边录边转 <b>${preActive.length}</b> 场进行中${pre.filter((p) => p.stillWriting).length ? `（仍在写 <b>${pre.filter((p) => p.stillWriting).length}</b> 场）` : ''}`
      : '边录边转 <b>空闲</b>',
    `压制/上传 <b>${queue.length}</b> 个`,
    `内存 <b>${mem.rssMB ?? '—'}</b> MB`,
    `同步于 ${o.at.toLocaleTimeString('zh-CN', { hour12: false })}`,
  ].join(' · ');

  box.innerHTML = `
    <div class="card obs-summary">
      <div class="card-head">
        <b>运行观测</b>
        <span class="obs-sum">${summary}</span>
        <button class="btn-sm" id="obsPause">${state.obs.paused ? '继续刷新' : '暂停刷新'}</button>
      </div>
      <div class="hintline">只读页：边录边转进度、压制/上传明细、资源与 ASR 体检。时间一律<b>本地时区</b>（日志里存的是 UTC）。</div>
      ${rec.ok && rec.recorders.length
        ? `<div class="hintline">biliLive-tools 录制器（${rec.recorders.length} 个）：${rec.recorders
            .map(
              (x) =>
                `<b>${esc(x.owner || x.channelId)}</b> 房间 ${esc(x.channelId)} · ${
                  x.living ? '<span class="badge b-run">正在直播</span>' : '<span class="badge">未开播</span>'
                } · 录制器 ${esc(x.state || '?')}${x.lastRecordSec === null ? '' : ` · 上次录制 ${obsAgo(x.lastRecordSec)}`}`,
            )
            .join('　|　')}</div>`
        : `<div class="hintline">biliLive-tools 录制器状态问不到（${esc(rec.error || '接口异常')}）—— 此时"录制中"退回按文件是否在写判断，不影响边录边转。</div>`}
    </div>

    ${/* ★ 2026-10-16（UI 评审 IA-2）：空态不再占整张卡片。
          改版前 ①②③ 三张空卡片合计占掉约 350px，把真正有数据的「④ 最近几场」挤出首屏。
          现在没有内容时收成一行虚线摘要条，有内容才展开成完整卡片（含那条长说明）。 */ ''
    }${recRows
      ? `<div class="card">
      <div class="card-head"><b>① 正在录制的文件</b><span class="badge b-run">${recording.length} 个</span></div>
      <table class="tbl obs-tbl"><thead><tr><th>文件</th><th>大小</th><th>速率</th><th>最后写入</th><th>状态</th></tr></thead><tbody>${recRows}</tbody></table>
    </div>`
      : `<div class="empty-strip"><b>① 正在录制的文件</b><span class="badge b-idle">0 个</span>
      <span class="tail">当前没有在写的录制文件 · 每轮目录轮询的结论见「实时监控」页</span></div>`}

    ${preRows
      ? `<div class="card">
      <div class="card-head"><b>② 边录边转（预转写）</b><span class="badge b-done">${preActive.length} 场进行中${preActive.length && preHistory ? ` · 另有 ${preHistory} 条历史记录` : ''}</span></div>
      <table class="tbl obs-tbl"><thead><tr><th>场次</th><th>已完成</th><th>路径</th><th>更新</th></tr></thead><tbody>${preRows}</tbody></table>
      <div class="hintline">粒度：biliLive-tools 会把一场直播切成多个分段文件（<span class="mono-sm">.ts</span> / <span class="mono-sm">-PART001.ts</span>…）。<b>正在写的那个分段不会转</b>（末次写入距今不到 2 分钟即视为"仍在写入"），写完之后的下一次检查就会转它 —— 所以一场 4 小时的直播，下播时通常只剩最后一个分段要转。</div>
      ${noteRows ? `<div class="obs-sub">最近判定（已滤掉"循环已启动"这类噪声）</div>${noteRows}` : ''}
    </div>`
      : `<div class="empty-strip"><b>② 边录边转（预转写）</b><span class="badge b-idle">当前空闲</span>
      <span class="tail">当前没有直播在录，也没有进行中的转写</span></div>`}

    <!-- ★ 2026-10-14：原来这里的「④ 跑完自动关机」卡片**已迁出**为独立页签
         （顶栏「自动关机」，见 20-shell-body.html 的 data-view="autoshutdown" + 39-其它页签 的 iframe）。
         原因：这一页每 5 秒整块重渲染，卡片再怎么只改文本也会被带着抖 —— 用户连报两次"界面一直抖"，
         最终方案是让它有自己的文档（/api/shutdown/page）。此处不再保留重复入口。 -->

    ${qRows
      ? `<div class="card">
      <div class="card-head"><b>③ 压制 / 上传队列</b><span class="badge b-run">${queue.length} 个进行中</span></div>
      <table class="tbl obs-tbl"><thead><tr><th>类型</th><th>任务</th><th>状态</th><th>进度</th><th>已跑</th><th>预计还需</th><th>产物</th></tr></thead><tbody>${qRows}</tbody></table>
      <div class="hintline">完整版（弹幕版 + 纯享版）由 biliLive-tools 压制与上传；它投出去之后，等完整版的切片才会被追加成分P。</div>
    </div>`
      : `<div class="empty-strip"><b>③ 压制 / 上传队列</b><span class="badge b-idle">队列空闲</span>
      <span class="tail">完整版压制与上传由 biliLive-tools 负责</span></div>`}

    <div class="card">
      <div class="card-head"><b>④ 最近几场</b></div>
      ${
        tlRows
          ? `<table class="tbl obs-tbl obs-tl"><thead><tr><th>场次（标题）</th><th>状态</th><th>切片</th><th>开始</th></tr></thead><tbody>${tlRows}</tbody></table>`
          : '<div class="empty">台账为空</div>'
      }
    </div>

    <div class="card">
      <div class="card-head"><b>⑤ 资源与 ASR 体检</b></div>
      <table class="tbl obs-tbl"><tbody>
        <tr><td>进程内存</td><td>RSS ${mem.rssMB ?? '—'} MB · 堆 ${mem.heapUsedMB ?? '—'}/${mem.heapTotalMB ?? '—'} MB</td></tr>
        <tr><td>磁盘</td><td>${mon.disk ? Math.round(Number(mon.disk.freeGB ?? 0)) + ' GB 可用（阈值 ' + Math.round(Number(mon.disk.thresholdGB ?? 0)) + ' GB）' : '—'}</td></tr>
        <tr><td>服务运行时长</td><td>${mem.uptimeSec ? obsDur(mem.uptimeSec) : '—'}</td></tr>
        <tr><td>监听目录</td><td class="mono-sm">${esc((obs.watchDirs || []).join('  ·  ') || '—')}</td></tr>
      </tbody></table>
      ${health ? `<div class="obs-sub">最近几次本地转写（精度 / 显存峰值）</div>${health}` : '<div class="empty" style="margin-top:8px">还没有本地转写体检记录</div>'}
    </div>
  `;

  const btn = $('#obsPause');
  if (btn) {
    btn.onclick = () => {
      state.obs.paused = !state.obs.paused;
      if (state.obs.paused) stopObserve();
      else startObserve();
      renderObserve(box);
    };
  }

  /* ④ 跑完自动关机：状态 + 三个按钮（2026-10-14）。
     状态走专用接口 `/api/shutdown`，**不塞进 monitor 载荷** —— 免得为了一个开关动两处接口。
     渲染后异步取一次；按钮每次渲染都重新绑定（onclick 赋值是幂等的）。 */
}
/* ============================================================================
 * 启动
 * ========================================================================== */
(async function init() {
  // 自检：把关键元素的存在性打出来，便于排查「点了没反应」
  console.info('%c[live_auto] UI 构建 ' + UI_BUILD, 'color:#00aeec;font-weight:bold');
  const probe = ['#taskList', '#btnRepairStuck', '#btnSetting', '#btnImport', '#tabs'];
  console.info('[live_auto] 关键元素:', probe.map((x) => x + '=' + (document.querySelector(x) ? 'OK' : 'MISSING')).join(' '));

  try {
    await loadBootstrap();
    await refreshAll();
  } catch (e) {
    $('#detail').innerHTML = `<div class="errbar"><div class="ico">!</div><div class="txt"><b>初始化失败</b><br>${esc(e.message)}<br>
      <span style="color:var(--text-3)">请确认服务已启动，并且你是通过 http://127.0.0.1:${state.bootstrap ? '' : ''}${location.port} 访问（不是通过其它主机名）。</span></div></div>`;
  }
  /* 构建指纹巡检（2026-10-25）：页面开着的时候有人改了代码，这里能自己转红，
     不用刷新页面才发现"咦怎么还是旧行为"。30 秒一次，只读一个很小的 JSON。 */
  setInterval(async () => {
    if (document.hidden) return;
    try {
      const b = await api('/api/build');
      renderBuildTag({ id: b.running && b.running.id, diskId: b.disk && b.disk.id, stale: b.stale, at: b.running && b.running.latestMtimeMs, note: b.note });
    } catch { /* 服务重启中会短暂失败，忽略 */ }
  }, 30000);
  // 自动刷新：有任务在处理时 4 秒，否则 20 秒
  setInterval(async () => {
    if (document.hidden) return;
    const active = state.tasks.some((t) => ['TRANSCRIBING', 'ANALYZING', 'CLIPPING', 'PUBLISHING', 'TRANSCRIBED', 'PENDING', 'RECORDED'].includes(t.status));
    if (state.view !== 'tasks') return;
    if (state.dirty.size) return;
    await refreshAll(true).catch(() => {});
  }, 8000);
})();
</script>
</body>
</html>
