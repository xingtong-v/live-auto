<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直播切片助手</title>
<!-- ★ 2026-10-16：主题必须在**首屏渲染之前**定下来。
     放在这里（head、body 之前）而不是等 46-启动.js 跑完再设 ——
     否则每次刷新都会先闪一下浅色底再变深，深色下特别刺眼。
     取值优先级：localStorage → 系统偏好(prefers-color-scheme) → 浅色。 -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('liveauto.theme');
    var dark = saved ? saved === 'dark'
      : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) { /* 隐私模式下 localStorage 会抛，忽略即可，退回浅色 */ }
})();
</script>
<style>
  /* ============================================================================
   * 设计令牌（2026-10-16 UI 评审落地）
   *
   * 为什么要有这一层：改版前全文件有 16 级字号、13 种圆角、33 种颜色，都是各写各的。
   * 现在收敛成一张表，规则只有三条：
   *   ① 字号只允许从 --fs-* 取；相邻两级至少差 1px，正文不小于 12px
   *   ② 圆角只允许 sm / md / pill 三档
   *   ③ 所有用于**文字**的颜色，对比度必须 ≥ 4.5:1（WCAG AA 小字门槛）
   *
   * 对比度实测（白底 / --bg 底）：
   *   --text   17.58 / 16.28      --text-2  5.79 / 5.30
   *   --text-3  4.98 /  4.57      --blue    5.51
   *   --pink    4.82              --green   5.39
   *
   * 品牌粉拆成两个：--pink 供文字与主按钮（够深才达标）；
   * --pink-deco 保留原来的亮粉，只用于不承载文字的装饰面（进度条等）。
   * ========================================================================== */
  :root{
    color-scheme: light;
    /* ---- 颜色 ---- */
    --bg:#f4f5f7; --card:#fff; --border:#e3e6ea; --border-2:#eef0f3;
    --text:#18191c; --text-2:#5c6169; --text-3:#6b7078; --text-4:#6b7078;
    --pink:#c73f6c; --pink-deco:#fb7299; --pink-hover:#b33560; --pink-soft:#fff1f5;
    --blue:#0b6ea8; --blue-soft:#e9f4fb;
    --green:#0f7a48; --green-soft:#e8f6ee;
    --amber:#8a5a00; --amber-soft:#fdf3e0;
    --red:#b3261e; --red-soft:#fdeceb;
    --violet:#5a4296; --violet-soft:#f0ecfa;
    --focus:#3a6bd6;

    /* ---- 面与线（深色模式只需要换这一组）----
       为什么单独抽出来：改版前这些值散在 60 多处硬编码（#fafbfc / #f7fcff / #b9d6ea…），
       做深色主题必须逐个找出来覆盖，一定会漏。抽成令牌后，深色块只改值。 */
    --surface-2:#fafbfc;      /* 次级面：hover 行、次级工具条 */
    --surface-3:#f1f2f4;      /* 三级面：禁用态、tag 底、滚动条滑块 */
    --border-strong:#cfd3d8;  /* hover 边框 */
    --scroll:#dcdfe3;         /* 滚动条滑块 */
    --inverse-bg:#1f2329;     /* 反色面（提示条 toast）*/
    --on-accent:#ffffff;      /* 实心强调色上的文字 */
    --shadow-a:rgba(0,0,0,.05);

    /* 强调色的"淡底 / 描边"成套：徽章、提示条、警示框 */
    --blue-line:#b9d6ea; --blue-tint:#f7fcff;
    --green-line:#c9e6d6;
    --amber-line:#ecd9a8; --amber-tint:#fffbf2; --amber-ink:#6f4800;
    --red-line:#eebfbb; --red-tint:#fdeceb;
    --violet-line:#e3dbf3;
    --warm-tint:#fff8f4; --warm-line:#f3d9cb;

    /* ---- 排版（7 级，取代原来的 16 级）---- */
    --fs-micro:11px; --fs-meta:12px; --fs-s:13px; --fs-body:14px;
    --fs-title:16px; --fs-h2:20px; --fs-num:24px;

    /* ---- 间距（4px 基数）---- */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px;

    /* ---- 圆角（3 档，取代原来的 13 档）---- */
    --r-sm:8px; --r-md:12px; --r-pill:999px;
    --radius:12px;               /* 兼容旧引用 */

    /* ---- 控件高度（3 档）---- */
    --h-sm:28px; --h-md:32px; --h-lg:40px;
    /* 底部操作栏的实际占位高度。1280 宽时它会换行到 98px，所以内边距必须跟着它走 ——
       改版前中栏写死 60px，结果底栏被盖住了 5 个内容元素（含 3 条本场要点）。 */
    --actionbar-h:112px;

    /* ---- 阴影 ---- */
    --sh-1:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.05);
    --sh-2:0 2px 4px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.07);
    --sh-3:0 4px 12px rgba(15,23,42,.08),0 20px 48px rgba(15,23,42,.16);
  }
  /* ============================================================================
   * 深色主题（2026-10-16 用户要求）
   *
   * 只换令牌值，不重写任何组件规则 —— 这就是把面/线抽成令牌的回报。
   * 对比度全部实测过（底为卡片 #1e2026 / 页底 #16181d，AA 小字门槛 4.5:1）：
   *   正文 13.51 / 次级 7.22 / 三级 5.08   ✓
   *   粉 6.85 · 蓝 7.42 · 绿 7.35 · 琥珀 7.71 · 红 6.20 · 紫 6.75   ✓
   *   六套徽章 6.04 ~ 7.06   ✓
   * 注意两处刻意的差异：
   *   ① 深色下主按钮用「亮粉底 + 深字」（7.83:1），而不是白字 ——
   *      白字压在亮粉上只有 2.38:1，深色界面里反而读不清。
   *   ② 文字色整体提亮而不是把浅色的值直接搬过来，否则深底上全部不达标。
   * ========================================================================== */
  [data-theme="dark"]{
    color-scheme: dark;
    --bg:#16181d; --card:#1e2026; --border:#31353d; --border-2:#272b32;
    --text:#e8eaed; --text-2:#a8adb5; --text-3:#8b9099; --text-4:#8b9099;
    --pink:#f287ab; --pink-deco:#f287ab; --pink-hover:#f79cba; --pink-soft:#3a2230;
    --blue:#6cb8e0; --blue-soft:#17313f;
    --green:#4cc38a; --green-soft:#1d3a2c;
    --amber:#e0a94a; --amber-soft:#3b2f18;
    --red:#f07f75; --red-soft:#3d2220;
    --violet:#b39ae8; --violet-soft:#2c2440;
    --focus:#8ab4f8;

    --surface-2:#23262d;      /* 比 card 略亮：深色下"次级面"要提亮才有层次 */
    --surface-3:#2a2e35;
    --border-strong:#3d434c;
    --scroll:#3d434c;
    --inverse-bg:#e8eaed;
    --on-accent:#1a1014;      /* 亮粉底上用深字：7.83:1（白字只有 2.38:1）*/
    --shadow-a:rgba(0,0,0,.4);

    --blue-line:#2a4a5e; --blue-tint:#1a2b36;
    --green-line:#27503c;
    --amber-line:#4a3c1c; --amber-tint:#2b2415; --amber-ink:#e8b45c;
    --red-line:#552c28; --red-tint:#33201e;
    --violet-line:#3a3154;
    --warm-tint:#2b2318; --warm-line:#4a3c1c;
  }
  /* 提示条（toast）在深色下是"反色面"，文字要跟着反过来 */
  [data-theme="dark"] #toast{background:var(--inverse-bg);color:#16181d}
  /* 顶栏两个组合态：浅色下是浅绿/浅琥珀底，深色下要压暗并提亮文字 */
  [data-theme="dark"] .mode.ok{border-color:#2c5c42;background:#16301f;color:#6fce9e}
  [data-theme="dark"] .mode.warn,
  [data-theme="dark"] .mode.risk{border-color:#4a3c1c;background:#2b2415;color:#e8b45c}
  [data-theme="dark"] .switch.risk.on{background:#c9852a}
  [data-theme="dark"] .b-idle{background:var(--surface-3);color:var(--text-2)}
  /* 剩下这些是令牌没覆盖到的一次性色值 */
  [data-theme="dark"] .task .when > span:last-child::before{color:#5c636c}
  [data-theme="dark"] .stage .prog{color:#7cc4e8}
  [data-theme="dark"] .barstrip.info{color:#9fd0ea}
  [data-theme="dark"] .barstrip.warn{color:#e8b45c}
  [data-theme="dark"] .btn-detail{color:#b8a09c}
  [data-theme="dark"] .clip:hover{border-color:var(--border-strong)}
  [data-theme="dark"] .tinput.changed{border-color:#6b5522}
  [data-theme="dark"] .score.low .bar i{background:#d9930a}
  [data-theme="dark"] .linkbtn.danger:hover{color:#ffb3ac}
  [data-theme="dark"] .primary:disabled{background:var(--surface-3);color:#8b9099}
  [data-theme="dark"] .empty-strip{border-color:#383d45}
  [data-theme="dark"] .switch{background:#4a5058}
  [data-theme="dark"] .switch::after{background:#e8eaed}
  [data-theme="dark"] .score .bar{background:#33383f}
  [data-theme="dark"] .rep-same{color:#5c636c}
  [data-theme="dark"] .modal{box-shadow:0 24px 60px rgba(0,0,0,.6)}
  [data-theme="dark"] .task-menu,[data-theme="dark"] .ops-menu,[data-theme="dark"] .slot-menu{
    background:var(--card);box-shadow:0 8px 28px rgba(0,0,0,.55)}
  /* 墓碑态用的是几个一次性浅紫，令牌没覆盖到 */
  [data-theme="dark"] .clip.tomb{background:#1c1a24;border-color:#3a3154}
  [data-theme="dark"] .tomb-note{background:#241f33;border-color:#3a3154;color:#c9bde6}
  [data-theme="dark"] .tomb-note b{color:#ded4f5}
  [data-theme="dark"] .tomb-note a{color:var(--violet)}
  [data-theme="dark"] .tomb-meta{color:#a99fc4}
  [data-theme="dark"] .tomb-meta code{background:#2a2440;border-color:#3a3154}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:var(--fs-body)/1.7 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer} input,select,textarea{font:inherit}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}

  /* ---- 键盘可见焦点：改版前全站 0 条 :focus-visible，键盘用户完全无法定位 ---- */
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:inherit}
  .task:focus-visible{outline-offset:-2px}
  /* ---- 尊重系统的"减少动态效果"偏好（阶段条的 pulse 是无限动画）---- */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important;scroll-behavior:auto!important}
  }

  .topbar{height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:26px;height:26px;border-radius:var(--r-sm);background:var(--pink);color:var(--on-accent);
    display:grid;place-items:center;font-weight:700;font-size:var(--fs-s);flex:0 0 auto}
  .brand h1{margin:0;font-size:var(--fs-title);font-weight:600;white-space:nowrap}
  .brand .sub{color:var(--text-3);font-size:var(--fs-meta);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 构建徽章（2026-10-25）：默认是低调的等宽小标签；磁盘代码比进程新时转红并写明"需重启" */
  .build-tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1;
    font-variant-numeric:tabular-nums;padding:3px 7px;border-radius:var(--r-sm);
    background:var(--hover,rgba(127,127,127,.12));color:var(--text-3);cursor:help;white-space:nowrap;flex:0 0 auto}
  .build-tag.stale{background:rgba(229,72,77,.14);color:#e5484d;font-weight:600}
  .top-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 3px rgba(15,122,72,.15);display:inline-block;margin-right:6px}
  .live-dot.bad{background:var(--red);box-shadow:0 0 0 3px rgba(179,38,30,.15)}
  .mode{display:flex;align-items:center;gap:var(--sp-2);padding:5px 10px;border:1px solid var(--border);
    border-radius:var(--r-pill);font-size:var(--fs-meta);color:var(--text-2);background:var(--surface-2);white-space:nowrap}
  /* 字幕开关的两个"组合态"：本地 ASR 下烧字幕是绿的（时间戳可信），
     云端 ASR 下是琥珀色的（句级时间窗不可靠，会错位）——让这个已知坏组合在界面上看得见。 */
  .mode.ok{border-color:#a9d9bf;background:var(--green-soft);color:#0b5c36}
  .mode.warn{border-color:var(--amber-line);background:var(--amber-soft);color:var(--amber-ink)}
  /* 高风险设置（全自动·免确认发布）开启时单独走琥珀，不再和普通开关共用品牌粉 ——
     否则"会自动发文、不需要我确认"看起来和"字幕开关"一样无害。 */
  .mode.risk{border-color:var(--amber-line);background:var(--amber-soft);color:var(--amber-ink)}
  /* 开关：视觉尺寸保持 36×20，但用一层透明的 ::before 把**可点区域**撑到 44×28。
     为什么这么做而不是直接把开关做大：它是顶栏里最密的控件，放大 8px 会挤走旁边的
     模式文案；而 36×20 本身低于 WCAG 2.2 的 24×24 指针目标下限。撑点击区是标准解法。 */
  .switch{position:relative;width:36px;height:20px;border-radius:var(--r-pill);background:var(--border-strong);
    border:none;padding:0;transition:background .18s;flex:0 0 auto}
  .switch::before{content:"";position:absolute;inset:-4px -4px;border-radius:var(--r-pill)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:var(--card);transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on{background:var(--pink)}
  .switch.on::after{transform:translateX(16px)}
  .switch.risk.on{background:#b8791a}
  .switch.sm{width:32px;height:18px}
  .switch.sm::after{width:14px;height:14px}
  .switch.sm.on::after{transform:translateX(14px)}
  .ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);
    padding:6px 12px;border-radius:var(--r-sm);font-size:var(--fs-s);white-space:nowrap}
  .ghost:hover{border-color:var(--border-strong);color:var(--text)}
  .ghost.on{background:var(--pink-soft);border-color:var(--pink);color:var(--pink)}
  /* 图标 + 文字的按钮（目前只有主题切换）*/
  .icon-btn{display:inline-flex;align-items:center;gap:6px}
  .icon-btn>span:first-child{font-size:var(--fs-body);line-height:1}

  .tabs{display:flex;gap:4px;padding:8px 18px 0;background:var(--card);border-bottom:1px solid var(--border);
    position:sticky;top:56px;z-index:19;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:7px 14px;font-size:var(--fs-s);color:var(--text-2);border:none;background:none;
    border-bottom:2px solid transparent;border-radius:var(--r-sm) var(--r-sm) 0 0;flex:0 0 auto}
  .tab:hover{background:var(--surface-2)}
  .tab.on{color:var(--pink);border-bottom-color:var(--pink);font-weight:600}

  .app{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;height:calc(100vh - 56px - 41px)}
  .col{overflow-y:auto;height:100%}
  .col-left{border-right:1px solid var(--border);background:var(--card)}
  .col-mid{padding:0;display:flex;flex-direction:column;overflow:hidden}
  /* 中栏拆成「可滚动内容 + 固定页脚」两段：
     为什么不再用一个 sticky 的浮层 —— 实测它会横在切片卡片中间把正文盖住。
     固定页脚不参与滚动 ⇒ 任何滚动位置都不会与内容重叠，也不需要猜内边距要留多少。 */
  .col-mid > #detail{flex:1;min-height:0;overflow-y:auto;padding:18px 22px 24px}
  .col-mid > #detail::-webkit-scrollbar{width:8px}
  .col-mid > #detail::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:var(--r-sm)}
  .detail-foot{flex:0 0 auto;border-top:1px solid var(--border);background:var(--card)}
  .detail-foot:empty{display:none}
  .col-right{border-left:1px solid var(--border);background:var(--card);padding:16px 14px}
  .col::-webkit-scrollbar{width:8px}
  .col::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:var(--r-sm)}
  .col-label{font-size:var(--fs-meta);letter-spacing:.06em;color:var(--text-3);
    padding:14px 16px 8px;text-transform:uppercase}
  .fullpage{height:calc(100vh - 56px - 41px);overflow-y:auto;padding:18px 22px var(--actionbar-h)}

  .searchbar{padding:10px 12px 6px;display:flex;flex-direction:column;gap:var(--sp-2)}
  /* 「多选」是低频批量操作，不该占满一整行、把筛选器和任务列表切开 ——
     flex-column 默认 stretch，这里显式收回左对齐、只占自身宽度。 */
  .searchbar > #btnMulti{align-self:flex-start;font-size:var(--fs-meta);padding:5px 12px;min-height:var(--h-sm)}
  .searchbar input{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;font-size:var(--fs-s)}
  .searchbar input:focus{outline:none;border-color:var(--blue-line);box-shadow:0 0 0 3px rgba(11,110,168,.12)}
  .filters{display:flex;gap:5px;flex-wrap:wrap}
  /* 筛选 chips 补到 28px 高（原来 26px，低于 WCAG 2.2 指针目标下限）*/
  .filters button{font-size:var(--fs-meta);padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--border);
    background:var(--card);color:var(--text-2);min-height:var(--h-sm)}
  .filters button.on{border-color:var(--pink);background:var(--pink-soft);color:var(--pink);font-weight:600}

  .task{padding:11px 14px 12px;border-left:3px solid transparent;cursor:pointer;
    border-bottom:1px solid var(--border-2);position:relative}
  .task:hover{background:var(--surface-2)}
  .task.active{border-left-color:var(--pink);background:var(--pink-soft)}
  /* 时间行右侧给「⋯」让出 34px：改版前两者重叠 17px，把"00:43"的末两位盖掉了。
     用 margin-right（而不是 padding-right）—— padding 只缩内容区，盒子右边界仍在 265，
     和按钮的 244 还是叠着；margin 才是真的把盒子收回来。
     两个 <span>（日期 / 时长）之间补分隔符，否则会连读成 23:41:3000:43:45。 */
  .task .when{font-size:var(--fs-meta);color:var(--text-3);margin-bottom:3px;
    display:flex;justify-content:space-between;gap:var(--sp-2);margin-right:34px}
  .task .when > span:last-child::before{content:"·";margin-right:6px;color:var(--text-4)}
  .task .name{font-size:var(--fs-body);font-weight:500;line-height:1.45;margin-bottom:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .task .meta{font-size:var(--fs-meta);color:var(--text-3);display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
  /* 「⋯」默认隐藏，悬停 / 键盘聚焦 / 菜单已开时才出现 —— 常驻就会把时间压住 */
  .task .more{position:absolute;top:8px;right:7px;width:28px;height:28px;line-height:1;
    border:1px solid var(--border);background:var(--card);border-radius:var(--r-sm);color:var(--text-2);
    font-size:var(--fs-title);font-weight:600;padding:0;cursor:pointer;z-index:2;
    box-shadow:var(--sh-1);opacity:0;transition:opacity .15s}
  .task:hover .more,.task:focus-within .more,.task.menu-open .more{opacity:1}
  .task .more:hover{border-color:var(--blue-line);color:var(--blue);background:var(--blue-tint)}
  /* ---- 多选（批量删除） ---- */
  .task .pick{position:absolute;top:11px;left:9px;width:17px;height:17px;cursor:pointer;accent-color:var(--pink);z-index:2}
  .task.picked{background:var(--pink-soft);border-left-color:var(--pink)}
  .task.picked .name{font-weight:600}
  .multibar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
    padding:var(--sp-2) 10px;margin:6px 0 4px;background:var(--warm-tint);border:1px solid var(--warm-line);border-radius:var(--r-sm);font-size:var(--fs-s)}
  .multibar .cnt{color:var(--text-2)}
  .multibar .cnt b{color:var(--pink);font-size:var(--fs-body)}
  .multibar .btn-sm.danger{border-color:var(--red-line);color:var(--red)}
  .multibar .btn-sm[disabled]{opacity:.55;cursor:not-allowed}
  #btnMulti.on{border-color:var(--blue-line);color:var(--blue);background:var(--blue-tint)}
  .task-menu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-md);box-shadow:var(--sh-3);padding:4px;min-width:186px;font-size:var(--fs-s)}
  .task-menu button{display:block;width:100%;text-align:left;border:none;background:none;
    padding:8px 11px;border-radius:var(--r-sm);color:var(--text);font-size:var(--fs-s);min-height:var(--h-sm)}
  .task-menu button:hover{background:var(--bg)}
  .task-menu button.danger{color:var(--red)}
  .task-menu button.danger:hover{background:var(--red-soft)}
  .task-menu .sep{height:1px;background:var(--border-2);margin:4px 6px}
  .task-menu .head{padding:6px 11px 4px;font-size:var(--fs-meta);color:var(--text-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  /* 状态徽章整组重配：改版前实测 绿 2.39 / 黄 2.96 / 蓝 3.64，全部不达 AA；
     现在最低 4.84。徽章只有 11px，正落在要求最严的一档。 */
  .badge{padding:1px 7px;border-radius:var(--r-pill);font-size:var(--fs-micro);font-weight:500;white-space:nowrap}
  .b-done{background:var(--green-soft);color:var(--green)}
  .b-run{background:var(--blue-soft);color:var(--blue)}
  .b-wait{background:var(--amber-soft);color:var(--amber)}
  .b-fail{background:var(--red-soft);color:var(--red)}
  .b-idle{background:var(--surface-3);color:var(--text-3)}

  .stages{display:flex;align-items:center;gap:2px;margin-bottom:14px;flex-wrap:wrap}
  .stage{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:var(--r-pill);
    font-size:var(--fs-s);color:var(--text-3);background:var(--card);border:1px solid var(--border)}
  .stage .dot{width:15px;height:15px;border-radius:50%;background:var(--surface-3);color:var(--on-accent);
    display:grid;place-items:center;font-size:var(--fs-micro);font-weight:700}
  .stage.done{color:var(--green);border-color:var(--green-line)}
  .stage.done .dot{background:var(--green)}
  .stage.active{color:var(--blue);border-color:var(--blue-line);background:var(--blue-tint)}
  .stage.active .dot{background:var(--blue);animation:pulse 1.6s infinite}
  .stage.fail{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
  .stage.fail .dot{background:var(--red)}
  .stage .prog{font-size:var(--fs-meta);color:#3f7fa4;margin-left:2px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,110,168,.5)}50%{box-shadow:0 0 0 4px rgba(11,110,168,0)}}
  .arrow{color:var(--border-strong);font-size:var(--fs-meta)}

  .barstrip{display:flex;align-items:center;gap:10px;font-size:var(--fs-s);padding:9px 14px;
    border-radius:var(--r-md);margin-bottom:14px;border:1px solid var(--border);background:var(--card);color:var(--text-2);flex-wrap:wrap}
  .barstrip b{color:var(--text);font-weight:600}
  .barstrip.cost{background:var(--surface-2)}
  .barstrip.warn{background:var(--amber-tint);border-color:var(--amber-line);color:var(--amber-ink)}
  .barstrip.warn b{color:var(--amber)}
  .barstrip.info{background:var(--blue-tint);border-color:var(--blue-line);color:#0f5b83}
  .errbar{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) 15px;border-radius:var(--r-md);
    background:var(--red-soft);border:1px solid var(--red-line);margin-bottom:14px}
  .errbar .ico{width:20px;height:20px;border-radius:50%;background:var(--red);color:var(--on-accent);
    display:grid;place-items:center;font-size:var(--fs-meta);font-weight:700;flex:0 0 auto;margin-top:1px}
  .errbar .txt{font-size:var(--fs-s);color:#7a2c26;line-height:1.6;min-width:0}
  .errbar .txt b{color:var(--red)}
  .errbar .acts{margin-left:auto;display:flex;gap:var(--sp-2);flex:0 0 auto;flex-wrap:wrap}

  /* ---- 任务操作条（2026-10-16 评审 IA-1 分层）----------------------------------
   * 三层结构：常用动作常显 → 诊断类收进「更多 ▾」→ 删除独立在右端用红色区分。
   * 为什么：改版前 9 个按钮权重完全相同，用户看不出"日常下一步"是哪个。 */
  .ops-bar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
  .ops-main{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;min-width:0}
  .ops-meta{display:flex;align-items:center;gap:var(--sp-2);margin-left:auto;flex-wrap:wrap}
  .ops-id{font-size:var(--fs-meta);color:var(--text-3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ops-more{position:relative}
  .ops-more-btn{color:var(--text-2)}
  .ops-more-btn[aria-expanded="true"]{border-color:var(--blue-line);background:var(--blue-tint);color:var(--blue)}
  .ops-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:172px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
    box-shadow:var(--sh-3);padding:4px}
  .ops-menu[hidden]{display:none}
  .ops-menu button{display:block;width:100%;text-align:left;border:none;background:none;
    padding:8px 11px;border-radius:var(--r-sm);color:var(--text);font-size:var(--fs-s);min-height:var(--h-sm)}
  .ops-menu button:hover{background:var(--bg)}
  /* 删除任务：独立在最右，用红色文字而不是红色实心 ——
     它是低频且不可逆的动作，实心红会喧宾夺主，盖过真正的日常操作。 */
  .danger-ghost{border-color:var(--red-line);color:var(--red);background:var(--card);margin-left:var(--sp-1)}
  .danger-ghost:hover{background:var(--red-soft);border-color:var(--red-line)}
  .btn-retry{border:1px solid var(--red-line);background:var(--card);color:var(--red);padding:6px 13px;
    border-radius:var(--r-sm);font-size:var(--fs-s);white-space:nowrap;min-height:var(--h-sm)}
  .btn-retry:hover{background:var(--red-soft);border-color:var(--red-line)}
  .btn-detail{border:none;background:none;color:#8d5f5a;font-size:var(--fs-s);padding:6px 4px;min-height:var(--h-sm)}
  .btn-detail:hover{text-decoration:underline}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-1);
    padding:var(--sp-4) 18px;margin-bottom:14px}
  .card h2{margin:0 0 var(--sp-3);font-size:var(--fs-s);font-weight:600;color:var(--text);
    display:flex;align-items:center;gap:var(--sp-2)}
  .ai-tag{font-size:var(--fs-micro);padding:1px 6px;border-radius:var(--r-sm);background:var(--blue-soft);color:var(--blue);font-weight:400}
  .summary p{margin:0 0 10px}
  .summary ul{margin:6px 0 0;padding-left:20px;color:var(--text-2)}
  .summary li{margin-bottom:5px}
  .summary b{color:var(--text)}
  .summary h2,.summary h3{font-size:var(--fs-title);margin:14px 0 var(--sp-2)}
  .summary blockquote{margin:var(--sp-2) 0;padding:var(--sp-2) var(--sp-3);background:var(--amber-tint);border-left:3px solid var(--amber-line);
    border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--amber-ink);font-size:var(--fs-s)}
  .summary code{background:var(--bg);padding:1px 5px;border-radius:var(--r-sm);font-size:var(--fs-s)}

  details.scoped{margin:0 0 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--card)}
  details.scoped summary{padding:10px 16px;font-size:var(--fs-s);color:var(--text-2);cursor:pointer;
    list-style:none;display:flex;align-items:center;gap:var(--sp-2);min-height:var(--h-md)}
  details.scoped summary::-webkit-details-marker{display:none}
  details.scoped summary::before{content:"▸";color:var(--text-3)}
  details.scoped[open] summary::before{content:"▾"}
  details.scoped .inner{padding:2px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:13px 18px}
  details.scoped .inner .full{grid-column:1/-1}

  .clips-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 var(--sp-3);flex-wrap:wrap;gap:var(--sp-2)}
  .clips-head h3{margin:0;font-size:var(--fs-title);font-weight:600}
  .clips-head .hint{font-size:var(--fs-meta);color:var(--text-3)}
  .clip{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-1);
    padding:13px 15px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
  .clip:hover{border-color:var(--border-strong);box-shadow:var(--sh-2)}
  .clip.off{opacity:.55}
  .clip.degraded{background:var(--amber-tint);border-color:var(--amber-line)}
  .clip.failed{border-color:var(--red-line)}
  .clip-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
  .clip-head input[type=checkbox]{width:17px;height:17px;accent-color:var(--pink);cursor:pointer;margin:0}
  .tinput{width:82px;border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 6px;
    font-size:var(--fs-meta);color:var(--text-2);text-align:center}
  .tinput:focus{outline:none;border-color:var(--blue-line);background:var(--card);color:var(--text)}
  .tinput.changed{border-color:#e3bd6a;background:var(--amber-tint);color:var(--amber);font-weight:600}
  .dash{color:var(--text-3);font-size:var(--fs-meta)}
  /* 时长 / 体积这类元信息原来是 11.5px + #9499a0，读不出来；提到 12px + --text-2 */
  .dur{font-size:var(--fs-meta);color:var(--text-2);padding:1px 6px;background:var(--surface-3);border-radius:var(--r-sm)}
  .dur.bad{background:var(--red-soft);color:var(--red)}
  .changed-tag{font-size:var(--fs-meta);padding:1.5px 7px;border-radius:var(--r-sm);background:var(--amber-soft);color:var(--amber)}
  .score{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:var(--fs-s);font-weight:600}
  .score .bar{width:52px;height:4px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
  /* 进度条是纯装饰面、不承载文字 —— 这里保留亮粉做视觉锚点 */
  .score .bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--pink-deco)}
  .score.low .bar i{background:#d9930a}
  .title-row{display:flex;align-items:center;gap:9px;margin-bottom:var(--sp-2)}
  .clip-title{flex:1;min-width:0;border:1px solid transparent;background:var(--surface-2);border-radius:var(--r-sm);
    padding:7px 9px;font-size:var(--fs-body);font-weight:600;color:var(--text)}
  .clip-title:hover{background:var(--surface-2)}
  .clip-title:focus{outline:none;background:var(--card);border-color:var(--blue-line);box-shadow:0 0 0 3px rgba(11,110,168,.12)}
  .cnt{font-size:var(--fs-meta);color:var(--text-3);flex:0 0 auto;min-width:44px;text-align:right}
  .cnt.over{color:var(--red);font-weight:600}
  .degraded-note{font-size:var(--fs-meta);color:var(--amber);margin-bottom:var(--sp-2);display:flex;gap:6px;align-items:center}
  /* 墓碑拦截态：故意不投的切片。用灰紫而不是红色 —— 它不是错误，
     是「已经投过了」的保护动作，用红色会让人以为出了故障并去点重试。 */
  .clip.tomb{background:#faf9fc;border-color:#ded8ea}
  .pill.tomb{background:var(--violet-soft);color:var(--violet)}
  .tomb-note{font-size:var(--fs-meta);line-height:1.65;color:#4d4363;background:#f5f2fb;border:1px solid var(--violet-line);
    border-radius:var(--r-sm);padding:9px 11px;margin-bottom:9px}
  .tomb-note b{color:#40306b}
  .tomb-note a{color:var(--violet)}
  .tomb-meta{margin:5px 0;color:#5f5677;font-size:var(--fs-meta);word-break:break-all}
  .tomb-meta code{background:var(--card);border:1px solid var(--violet-line);border-radius:var(--r-sm);padding:0 4px}
  .linkbtn.danger{color:var(--red)}
  .linkbtn.danger:hover{color:#8c1d18}
  /* 错误报告降级提示：报告文件没了、内容由事件行合成时必须说清，
     否则用户会以为"细节本来就没有"。用琥珀色 —— 是"信息不完整"，不是"又出错了"。 */
  .warnbox{font-size:var(--fs-meta);line-height:1.6;color:var(--amber-ink);background:var(--amber-tint);border:1px solid var(--amber-line);
    border-radius:var(--r-sm);padding:var(--sp-2) 11px;margin-bottom:10px}
  .warnbox code{background:var(--card);border:1px solid var(--amber-line);border-radius:var(--r-sm);padding:0 4px;word-break:break-all}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .tags span{font-size:var(--fs-meta);padding:1.5px 8px;border-radius:var(--r-sm);background:var(--bg);color:var(--text-2)}
  .why{font-size:var(--fs-s);color:var(--text-2);margin:0 0 10px;padding-left:10px;border-left:2px solid var(--border)}
  .why b{color:var(--pink);font-weight:600}
  .clip-foot{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-s);flex-wrap:wrap}
  /* 行内文字链补 24px 最小可点高度（原来 20px，低于 WCAG 2.2 的 24×24 下限）*/
  .linkbtn{border:none;background:none;color:var(--blue);padding:0;
    display:inline-flex;align-items:center;min-height:24px}
  .linkbtn:hover{text-decoration:underline}
  .sched{margin-left:auto;color:var(--text-3)}
  .pill{font-size:var(--fs-meta);padding:1.5px 8px;border-radius:var(--r-pill);background:var(--green-soft);color:var(--green)}
  .pill.fail{background:var(--red-soft);color:var(--red)}
  .pill.wait{background:var(--amber-soft);color:var(--amber)}

  .sched-group{margin-bottom:20px}
  .sched-title{display:flex;align-items:center;justify-content:space-between;
    font-size:var(--fs-meta);color:var(--text-3);margin-bottom:9px}
  .sched-title b{color:var(--text);font-size:var(--fs-s);font-weight:600}
  .slot{display:flex;gap:var(--sp-2);padding:9px 0;border-bottom:1px dashed var(--border)}
  .slot:last-child{border-bottom:none}
  /* "待定"是"还没排期"这种**未设置**状态，不是操作也不是强调 —— 改用中性灰，
     把强调色让给真正需要跳出来的东西（改版前 14 行全是同一个粉色，强调色被稀释光了）*/
  .slot .t{font-variant-numeric:tabular-nums;font-size:var(--fs-meta);color:var(--text-3);font-weight:600;
    min-width:52px;font-family:ui-monospace,Consolas,monospace}
  .slot .t.tbd{font-weight:400}
  /* 「预计发布时间」两行式（2026-10-16 用户要求）：
     单独投稿 + 定时发布时，每个切片按「首片 + 序号 × 间隔」排出预计时间。
     不用「待定」二字一笔带过 —— 14 行全是同一个词等于没排期。
     行高收到 1.35、字号 11px：这一列只是索引，主角还是右边的标题。 */
  .slot .t.tbd{display:flex;flex-direction:column;gap:1px;min-width:64px;
    font-size:var(--fs-micro);line-height:1.35;font-family:inherit}
  .slot .t .eta{color:var(--text-4);font-size:10px;letter-spacing:.04em;font-style:normal}
  .slot .t .eta-t{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .slot .b{min-width:0;flex:1}
.slot .b .acts{margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.slot .b .acts .linkbtn{font-size:var(--fs-meta)}
  /* 排期行内的「⋯」菜单（2026-10-16 评审 IA-4）：
     把「改发布时间 / 删除」这两个低频动作从常驻文字链收进菜单，
     14 行从 42 个微型目标降到 14 个，同时把「编辑」这个真正常用的入口让出来。 */
  .slot-more{position:relative;display:inline-flex}
  .slot-more-btn{padding:0 6px;letter-spacing:1px;font-weight:700;color:var(--text-3)}
  .slot-more-btn:hover{color:var(--blue)}
  .slot-more-btn[aria-expanded="true"]{color:var(--blue)}
  .slot-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:126px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
    box-shadow:var(--sh-3);padding:4px}
  .slot-menu[hidden]{display:none}
  .slot-menu button{display:block;width:100%;text-align:left;border:none;background:none;
    padding:7px 10px;border-radius:var(--r-sm);color:var(--text);font-size:var(--fs-s);min-height:var(--h-sm);white-space:nowrap}
  .slot-menu button:hover{background:var(--bg)}
  .slot-menu button.danger{color:var(--red)}
  .slot-menu button.danger:hover{background:var(--red-soft)}
  .slot .b .n{font-size:var(--fs-s);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .slot .b .s{font-size:var(--fs-meta);color:var(--text-3);margin-top:2px}
  .published .n{color:var(--text-2)}

  /* 页脚里的操作栏：不再是浮层，所以去掉 sticky / 阴影 / 外边框 ——
     它是中栏的正常页脚，靠上边框与内容区隔开就够了。 */
  .actionbar{margin:0;display:flex;align-items:center;gap:var(--sp-3);background:var(--card);
    border:none;border-radius:0;padding:var(--sp-3) 22px;flex-wrap:wrap}
  .actionbar .info{font-size:var(--fs-s);color:var(--text-2)}
  .actionbar .info b{color:var(--text)}
  /* 主按钮：白字压在 #c73f6c 上 4.82:1（改版前 #fb7299 只有 2.64:1）*/
  .primary{margin-left:auto;background:var(--pink);color:var(--on-accent);border:none;border-radius:var(--r-sm);
    padding:9px 20px;font-size:var(--fs-s);font-weight:600;box-shadow:0 2px 8px rgba(199,63,108,.28);
    min-height:var(--h-lg)}
  .primary:hover{background:var(--pink-hover)}
  .primary:disabled{background:var(--surface-3);color:var(--text-3);box-shadow:none;cursor:not-allowed}
  .danger{border:1px solid var(--red-line);background:var(--card);color:var(--red);border-radius:var(--r-sm);padding:8px 16px;
    font-size:var(--fs-s);min-height:var(--h-md)}

  /* ---- 弹窗 ---- */
  .mask{position:fixed;inset:0;background:rgba(20,22,26,.45);display:none;z-index:50;
    align-items:center;justify-content:center;padding:var(--sp-6)}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:var(--r-md);width:min(860px,100%);max-height:86vh;
    display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.28)}
  .modal.wide{width:min(1000px,100%)}
  /* 设置弹窗加宽到 1000px：两列字段够宽，长值（JSON / 路径）不再被裁掉 */
  .modal.setting{width:min(1000px,100%)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    padding:15px 22px;border-bottom:1px solid var(--border);gap:var(--sp-3)}
  .modal-head h2{margin:0;font-size:var(--fs-title);font-weight:600}
  .modal-head .x{border:none;background:none;font-size:var(--fs-h2);line-height:1;color:var(--text-3);
    padding:3px 7px;border-radius:var(--r-sm);min-width:var(--h-sm);min-height:var(--h-sm)}
  .modal-head .x:hover{background:var(--surface-3);color:var(--text)}
  .modal-body{overflow-y:auto;padding:4px 22px}
  .modal-body::-webkit-scrollbar{width:8px}
  .modal-body::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:var(--r-sm)}
  .modal-foot{display:flex;align-items:center;gap:10px;padding:13px 22px;
    border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--r-md) var(--r-md);flex-wrap:wrap}
  .modal-foot .tip{font-size:var(--fs-meta);color:var(--text-3)}
  .btn-plain{border:1px solid var(--border);background:var(--card);color:var(--text-2);
    padding:8px 18px;border-radius:var(--r-sm);font-size:var(--fs-s);min-height:var(--h-md)}
  .btn-plain:hover{border-color:var(--border-strong);color:var(--text)}
  .btn-sm{border:1px solid var(--border);background:var(--card);color:var(--blue);
    padding:5px 12px;border-radius:var(--r-sm);font-size:var(--fs-meta);white-space:nowrap;min-height:var(--h-sm)}
  .btn-sm:hover{border-color:var(--blue-line);background:var(--blue-tint)}
  .btn-sm:disabled{color:var(--text-3);cursor:default}
  .group{padding:15px 0 4px;border-bottom:1px solid var(--border-2)}
  .group:last-child{border-bottom:none;padding-bottom:18px}
  .group > h3{margin:0 0 3px;font-size:var(--fs-s);font-weight:600}
  .group > .gdesc{font-size:var(--fs-meta);color:var(--text-3);margin:0 0 var(--sp-3)}
  /* 分组头上的"字段数 / 改动数"：不展开也能判断这里有没有要找的东西 */
  .group > h3 .gcount{font-size:var(--fs-micro);font-weight:500;color:var(--text-3);
    background:var(--surface-3);border-radius:var(--r-pill);padding:1px 8px;margin-left:var(--sp-2);vertical-align:2px}
  .group > h3 .gcount.changed{background:var(--amber-soft);color:var(--amber)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:13px 18px}
  .fields .full{grid-column:1/-1}
  .field label{display:block;font-size:var(--fs-meta);color:var(--text-2);margin-bottom:5px}
  .field .ctl{display:flex;gap:var(--sp-2);align-items:center}
  /* 「＋ 添加直播」多房间：每行一个房间号，附加行才有「移除」按钮（第一行是主直播间） */
  .roomlist{display:flex;flex-direction:column;gap:6px}
  .roomrow{display:flex;gap:var(--sp-2);align-items:center}
  .roomrow .inp{flex:1;min-width:0}
  .roomrow .roomtag{flex:0 0 auto;width:1.2em;text-align:center;font-size:var(--fs-meta);color:var(--text-3);padding:0}
  .inp{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--sp-2) 11px;
    font-size:var(--fs-s);color:var(--text);background:var(--card);min-height:var(--h-md)}
  .inp:focus{outline:none;border-color:var(--blue-line);box-shadow:0 0 0 3px rgba(11,110,168,.12)}
  .inp[readonly]{background:var(--surface-2);color:var(--text-2);cursor:default}
  .inp.num{width:98px}
  textarea.inp{min-height:70px;resize:vertical;font-family:inherit}
  /* 字段说明从 11.5px/#9499a0（2.87:1）提到 12px/--text-3（4.98:1）——
     这是最需要读懂的一类文字，不该是最读不清的一类。 */
  .hintline{font-size:var(--fs-meta);color:var(--text-3);margin-top:5px;line-height:1.6}
  .hintline.warn{color:var(--red)}
  .hintline.ok{color:var(--green)}
  /* 长说明收进折叠：默认只露结论，细节按需展开 */
  .hintline details{margin-top:4px}
  .hintline details summary{cursor:pointer;color:var(--blue);list-style:none;
    display:inline-flex;align-items:center;gap:4px}
  .hintline details summary::-webkit-details-marker{display:none}
  .hintline details summary::before{content:"▸"}
  .hintline details[open] summary::before{content:"▾"}
  .hintline details .more-hint{margin-top:6px;padding:var(--sp-2) 10px;background:var(--surface-2);
    border-radius:var(--r-sm);border-left:2px solid var(--border);color:var(--text-2);line-height:1.7}
  /* 超长说明折两行 + 「展开」（2026-10-16 评审 IA-5）。用 line-clamp 而不是切字符串 ——
     说明里带 <b> / <span class="mono-sm">，按字数切会把标签切断。 */
  .hintline.hint-clamped{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hint-toggle{border:none;background:none;color:var(--blue);font-size:var(--fs-meta);
    cursor:pointer;padding:0;margin-left:4px;vertical-align:baseline}
  .hint-toggle:hover{text-decoration:underline}
  .testres{font-size:var(--fs-meta);margin-top:5px;white-space:pre-wrap}
  .testres.ok{color:var(--green)}
  .testres.err{color:var(--red)}
  .inline-switch{display:flex;align-items:center;gap:9px;font-size:var(--fs-s);color:var(--text-2);padding-top:4px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:var(--fs-s);padding:5px 12px;border-radius:var(--r-pill);border:1px solid var(--border);
    background:var(--card);color:var(--text-2);min-height:var(--h-sm)}
  .chip.on{border-color:var(--pink);background:var(--pink-soft);color:var(--pink);font-weight:500}

  /* ---- 全局提示条 ---- */
  #toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;
    background:var(--inverse-bg);color:var(--on-accent);padding:10px 18px;border-radius:var(--r-md);font-size:var(--fs-s);
    transition:.25s;pointer-events:none;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:80vw}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---- KPI ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-1);padding:var(--sp-3) 14px}
  .kpi .k{font-size:var(--fs-meta);color:var(--text-3);margin-bottom:4px}
  /* KPI 数值统一字号：改版前"已连接"用小字、"3.22.1"用 19px，一行三个大小无法横向比较 */
  .kpi .v{font-size:var(--fs-num);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.3px}
  .kpi .v.sm{font-size:var(--fs-body);font-weight:600;line-height:1.6}
  .kpi .n{font-size:var(--fs-meta);color:var(--text-3);margin-top:3px;line-height:1.55}
  .kpi.ok{border-color:var(--green-line)} .kpi.ok .v{color:var(--green)}
  .kpi.bad{border-color:var(--red-line)} .kpi.bad .v{color:var(--red)}
  .kpi.warn{border-color:var(--amber-line)} .kpi.warn .v{color:var(--amber)}
  table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
  table.tbl th,table.tbl td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--border-2)}
  table.tbl th{color:var(--text-3);font-weight:500;font-size:var(--fs-meta);white-space:nowrap}
  table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
  /* 「与上一行相同」的占位符（2026-10-16 评审 IA-6）：让重复值不再逐行复读，
     但保留"这一列有值"的视觉连续性 —— 悬停可看原值。 */
  .rep-same{color:var(--text-4);cursor:help}
  .mono-sm{font-family:ui-monospace,Consolas,monospace;font-size:var(--fs-meta)}
  .empty{color:var(--text-3);font-size:var(--fs-s);padding:14px 4px}
  /* 空态压缩条：把"没有内容"从整张卡片收成一行，首屏让给真正有数据的东西 ——
     运行观测页原来 3 张空卡片白占约 350px，真正有用的"最近几场"被挤出首屏。 */
  .empty-strip{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);
    margin-bottom:10px;border:1px dashed var(--border);border-radius:var(--r-md);
    background:transparent;font-size:var(--fs-s);color:var(--text-3);min-height:var(--h-lg)}
  .empty-strip b{color:var(--text-2);font-weight:600}
  .empty-strip .tail{margin-left:auto;font-size:var(--fs-meta);color:var(--text-4)}
  .timeline{font-size:var(--fs-s);line-height:1.7}
  .timeline .row{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border-2)}
  .timeline .row .t{color:var(--text-3);min-width:78px;font-family:ui-monospace,Consolas,monospace;font-size:var(--fs-meta)}
  .timeline .row .s{flex:1;min-width:0}
  .timeline .row.bad .s{color:var(--red)}
  /* 录制清单的分组折叠。为什么要有：录播目录动辄几十上百场，平铺的清单会把
     **真正在录的那几条**淹掉；而「已录制完成」和「已导入过」属于回顾性内容，
     需要时才展开。所以只有「正在录制」常显，另外两组默认收起。 */
  .impgroup{display:flex;align-items:center;gap:var(--sp-2);padding:6px var(--sp-2);margin:6px 0 2px;
    border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-s);user-select:none}
  .impgroup[data-g]{cursor:pointer}
  .impgroup[data-g]:hover{background:var(--surface-3)}
  .impgroup .caret{width:10px;color:var(--text-3);display:inline-block;transition:transform .15s}
  .impgroup.open .caret{transform:rotate(90deg)}
  .impgroup .cnt{margin-left:auto;color:var(--text-3)}
  .impgroup.live{background:var(--amber-soft);color:var(--amber-ink)}
  .impgroup.none{background:transparent;padding-left:2px;color:var(--text-3)}
  pre.raw{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px;
    font-size:var(--fs-meta);overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-all}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:var(--fs-s)}
  .kv .k{color:var(--text-3)}
  .filelist{display:flex;flex-wrap:wrap;gap:6px}
  .filelist button{font-size:var(--fs-meta);padding:3px 9px;border-radius:var(--r-sm);border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-2)}
  .filelist button:hover{border-color:var(--blue-line);color:var(--blue)}
  .tag-mini{display:inline-block;font-size:var(--fs-micro);padding:0 6px;border-radius:var(--r-sm);background:var(--surface-3);color:var(--text-2);margin-right:4px}

  /* ============================================================================
   * 响应式断点（2026-10-16 新增）
   *
   * 为什么要有：改版前三栏写死 280px | 1fr | 300px 且**一条媒体查询都没有**，
   * 1280 笔记本上中栏只剩 700px —— 工具条换行、成本条折两行，
   * 粘性底栏还压住了 3 条本场要点。这里按"先收窄、再折叠"两档处理。
   * ========================================================================== */
  /* 只在窄屏出现的控件（宽屏时排期栏本来就常驻）。
     ⚠️ 必须写在下面的媒体查询**之前** —— 同权重下后写的规则会赢。 */
  .only-narrow{display:none}

  @media (max-width:1500px){
    .app{grid-template-columns:248px minmax(0,1fr) 272px}
    .brand .sub{max-width:230px}
  }
  /* 排期栏改成可收起的抽屉：宽度还给中栏，需要时从右侧滑出 */
  @media (max-width:1320px){
    .app{grid-template-columns:236px minmax(0,1fr)}
    .col-right{position:fixed;right:0;top:98px;bottom:0;width:300px;height:auto;z-index:30;
      transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
    .col-right.open{transform:none}
    /* 抽屉打开时压一层浅遮罩：让"这是一层浮在上面的面板"一眼可辨，
       也提示点旁边空白处就能收起。
       ★ 2026-10-17 修复「展开后无法收回」：遮罩改 top:98px 避开顶栏+页签，且 pointer-events 恒为 none。
         之前 inset:0 全屏 + .open 时 pointer-events:auto，遮罩（z-index:30 层）会盖在
         顶栏（z-index:20）之上拦掉「排期」按钮的点击 —— 点按钮其实点到的是遮罩，自然收不回来。 */
    .col-right::before{content:"";position:fixed;top:98px;left:0;right:0;bottom:0;background:rgba(20,22,26,.28);
      opacity:0;transition:opacity .22s;pointer-events:none;z-index:-1}
    .col-right.open::before{opacity:1}
    /* 排期栏收成抽屉后，顶栏出现「排期」按钮来开关它 */
    .only-narrow{display:inline-block}
  }
  @media (max-width:1180px){
    .app{grid-template-columns:220px minmax(0,1fr)}
    .fields{grid-template-columns:1fr}
    .fields .full{grid-column:auto}
  }
</style>

</head>
<body>
<!--__BOOT__-->

<div class="topbar">
  <div class="brand">
    <div class="logo">切</div>
    <h1>直播切片助手</h1>
    <span class="sub" id="brandSub"><span class="live-dot" id="healthDot"></span><span id="brandText">加载中…</span></span>
    <!-- ★ 2026-10-25（用户要求）：构建徽章。
         痛点：修复落了盘、测试也绿，但进程没重启 ⇒ 界面还是旧行为，只能靠翻进程启动时间猜。
         这里显示**正在运行的代码指纹**；磁盘代码更新后会自动转红提示"需重启"。 -->
    <span class="build-tag" id="buildTag" title="构建指纹：用来判断修复有没有重启生效">v—</span>
  </div>
  <div class="top-right">
    <div class="mode" id="modeBox">
      <span id="modeText">半自动 · 需确认后发布</span>
      <button class="switch" id="modeSwitch" role="switch" aria-checked="false" aria-label="全自动发布（免确认）" title="切换全自动 / 半自动。开启后切片不再等你确认，直接按排期发布。"></button>
    </div>
    <div class="mode" id="subMode" title="切片是否把转写烧成字幕。字幕准不准取决于转写引擎：本地 Fun-ASR 有字级时间戳（实测偏差 ±0.2 秒）；云端 ASR 的句级时间窗不可靠（实测 15 个字的句子占了 0→30.9 秒），烧出来会与声音错位。">
      <span id="subText">字幕：加载中…</span>
      <button class="switch" id="subSwitch" role="switch" aria-checked="false" aria-label="烧录字幕" title="开启 / 关闭字幕烧录（下一次切片生效）"></button>
    </div>
    <button class="ghost" id="btnRepairStuck" title="进程被强杀后任务会停在「切片中」这类状态，点这里修回可操作状态">修复卡住</button>
    <button class="ghost" id="btnCheckNow">立即检查</button>
    <button class="ghost" id="btnImport">导入录播</button>
    <!-- ★ 2026-10-16：主题切换。深夜看直播切片的多，深色比浅色省眼。
         选择存在 localStorage（键 liveauto.theme），并且**在页面脚本执行前**就已经
         按它设好 data-theme —— 见 00-shell-head.html 里的那行内联脚本，
         否则每次刷新都会先闪一下白底。 -->
    <button class="ghost icon-btn" id="btnTheme" aria-pressed="false" title="切换深色 / 浅色主题">
      <span id="themeIcon" aria-hidden="true">◐</span><span id="themeText">深色</span>
    </button>
    <!-- ★ 2026-10-16（UI 评审 L-3）：只在窄屏（<1320px）出现 —— 那时排期栏收成了右侧抽屉 -->
    <button class="ghost only-narrow" id="btnSchedule" aria-expanded="false" aria-controls="colRight" title="展开 / 收起发布排期栏">排期</button>
    <button class="ghost" id="btnSetting">设置</button>
  </div>
</div>

<div class="tabs" id="tabs" role="tablist" aria-label="主视图切换">
  <!-- P1-7（2026-10-13）：页签**分组**（分隔线 + 悬停说明）+ 每个页签一句"什么时候来这儿"。
       为什么用 title 而不是加一行说明文字：不动布局、不占高度，且鼠标一停就能看到。
       三个分组：干活（任务/实时监控）｜运维（健康面板/待删回收站）｜资产（稿件表现/切片库/Prompt）。

       ★ 2026-10-16（UI 评审 A-1）：补 role=tablist / role=tab / aria-selected / aria-controls。
       为什么：这 9 个页签是全站最主要的导航，之前读屏念出来只是 9 个"按钮"，
       既不知道这是一组互斥选项，也不知道当前在哪一个。aria-selected 由 switchView() 同步。 -->
  <button class="tab on" data-view="tasks" role="tab" aria-selected="true" aria-controls="viewTasks" title="日常入口：看场次列表、审核切片、改标题、发布">任务</button>
  <button class="tab" data-view="monitor" role="tab" aria-selected="false" aria-controls="viewOther" title="正在跑什么、在等什么、为什么没动（默认 5 秒自动刷新）">实时监控</button>
  <button class="tab" data-view="observe" role="tab" aria-selected="false" aria-controls="viewOther" title="边录边转的进度、压制/上传队列与 ETA、我们进程的显存与内存（默认 5 秒自动刷新）">运行观测</button>
  <span class="tabsep" aria-hidden="true" style="width:1px;height:16px;background:var(--border);margin:0 8px;display:inline-block;vertical-align:middle"></span>
  <button class="tab" data-view="health" role="tab" aria-selected="false" aria-controls="viewOther" title="现在有没有需要你处理的事（待办）/ 错误 / 磁盘 / 自检">健康面板</button>
  <!-- 「跑完自动关机」独立页签（2026-10-14 用户：「独立页面放在健康界面后面」）：
       里面是 iframe 加载 /api/shutdown/page —— 它有自己的文档与刷新节奏，
       运行观测那页每 5 秒整块重渲染**影响不到它**（这就是不抖的原因）。 -->
  <button class="tab" data-view="autoshutdown" role="tab" aria-selected="false" aria-controls="viewOther" title="跑完自动关机：开关、允许时段、冷静期倒计时与取消（独立页面，不受其它页刷新影响）">自动关机</button>
  <!-- ★ 2026-10-11 用户要求：「将这两个（查看回收站 / 查看待删清单）放到成本的位置，然后将成本放到稿件表现里」；
       随后又要求「待删清单和回收站放一起」—— 两者本来就是同一条生命周期上的两段（待删 → 已删可恢复），
       合并成一页两段，顺带去掉重复了两遍的"最近已删除"列表。 -->
  <button class="tab" data-view="trash" role="tab" aria-selected="false" aria-controls="viewOther" title="用完即删的宽限期内可反悔 / 已删除的可恢复（按天折叠）">待删 / 回收站<span id="pendingTabBadge"></span></button>
  <span class="tabsep" aria-hidden="true" style="width:1px;height:16px;background:var(--border);margin:0 8px;display:inline-block;vertical-align:middle"></span>
  <button class="tab" data-view="perf" role="tab" aria-selected="false" aria-controls="viewOther" title="长期资产视角：已发布稿件的播放/点赞/评分，以及月度成本">稿件表现</button>
  <button class="tab" data-view="clips" role="tab" aria-selected="false" aria-controls="viewOther" title="跨场次找切片：按标题/状态/评分检索，可试看、可跳到那一场">切片库</button>
  <button class="tab" data-view="prompts" role="tab" aria-selected="false" aria-controls="viewOther" title="选片与标题的提示词（改这里会影响后续场次的挑选质量）">Prompt</button>
</div>

<div id="viewTasks">
  <div class="app">
    <aside class="col col-left" aria-label="场次列表">
      <div class="searchbar">
        <input id="searchInput" placeholder="搜索标题 / 日期 / 任务 ID" aria-label="搜索场次">
        <div class="filters" id="statusFilters" role="group" aria-label="按状态筛选">
          <button data-status="" class="on" aria-pressed="true">全部</button>
          <button data-status="processing" aria-pressed="false">处理中</button>
          <button data-status="review" aria-pressed="false">待审核</button>
          <button data-status="published" aria-pressed="false">已发布</button>
          <button data-status="failed" aria-pressed="false">失败</button>
        </div>

<!-- ★ 2026-10-16（UI 评审 A-1）：role=status + aria-live=polite。
     之前所有操作结果（"已复制""保存失败"）都只走视觉，读屏用户完全收不到。 -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
/* ============================================================================
 * 基础
 * ========================================================================== */
const BOOT = window.__BOOT__ || { csrf: '', version: '?', roomId: '', platform: '' };

/** UI 构建标记：在浏览器控制台里能看到，用来确认页面是不是最新的（避免缓存导致以为功能没做） */
const UI_BUILD = 'ui-2026-10-16-standalone-5min';
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/**
 * 配置里的「切片投稿方式」：`'append'`（追加切片投稿）/ `'standalone'`（单独投稿）。
 *
 * 与服务端 `resolveClipPublishMode()` **同一套口径**：显式值优先，没设时按 `multiPart` 反推。
 * 前端只有"显示"需要判定（排期面板的提示、本场详情），绝不能凭 `multiPart` 单独猜 ——
 * 手改 config.json 时两者可能不一致，那样界面会显示成另一个模式（用户按界面理解就错了）。
 */
function clipModeOf(publish) {
  const p = publish || {};
  if (p.clipPublishMode === 'standalone') return 'standalone';
  if (p.clipPublishMode === 'append') return 'append';
  return p.multiPart === true ? 'append' : 'standalone';
}

/**
 * 当前**实际生效**的切片排期口径（服务端算好随 bootstrap 下发）。
 *
 * 为什么不在这里重算：规则是「单独投稿 ⇒ 固定定时投稿 + 设置里的相邻切片间隔 / 随机抖动
 * （间隔 300 秒保底、抖动必须小于间隔）」（服务端 `resolveClipPublishSchedule()`）。
 * 界面上「错峰 X」出现在本场详情、右栏排期、设置弹窗、排期预览四处 —— 若各自读
 * `config.publish.clipGapSec`，界面就会写着一个值、实际排另一个值（用户填 100 被抬到 300、
 * 填 900 被压到 470 时尤其明显）。同一口径两端各写一份，本仓库踩过。
 *
 * 兜底：bootstrap 里没有这个字段（旧服务端）时按 config 值显示。
 */
function publishSchedule() {
  const b = (state.bootstrap || {});
  const s = b.publishSchedule;
  if (s && Number(s.gapSec) > 0) return { ...s, gapSec: Number(s.gapSec), scheduled: s.scheduled !== false, ignored: s.ignored || '' };
  const pub = (b.config && b.config.publish) || {};
  return { mode: clipModeOf(pub), gapSec: Number(pub.clipGapSec) || 300, scheduled: pub.immediatePublish !== true, ignored: '' };
}

const state = {
  view: 'tasks',
  tasks: [],
  activeId: null,
  detail: null,
  status: '',
  q: '',
  schedule: { pending: [], published: [], retention: [] },
  /** 目录轮询状态（/api/watch）：用来在右栏显示"它在等什么" */
  watch: null,
  bootstrap: null,
  dirty: new Set(),   // 已编辑但未保存的切片：taskId:idx
  /**
   * 任务列表的多选状态（批量删除用）。
   *
   * 只在**当前可见列表**里维护选中项：切筛选/搜索时会把看不见的 id 丢掉 ——
   * 否则用户切到「处理中」再点删除，会把上一个筛选里选中的场次一起删掉（看不见却删了，最糟的交互）。
   */
  multi: { on: false, sel: new Set() },
  saving: false,
  /**
   * 实时监控页签的运行态。
   *
   * `sig` 是"去掉易变字段后的数据指纹"：5 秒一刷如果整页 innerHTML 重画，
   * 光标、滚动位置、展开的 details 都会被打断 —— 所以数据没变就只更新"最后更新"那一行。
   */
  mon: { interval: 5, paused: false, timer: null, busy: false, data: null, sig: '', lastAt: 0, lastError: '' },
};

async function api(path, opts = {}) {
  /* ★ 网络层失败与"接口报错"必须分开说。
     实测（2026-10-08 凌晨）：服务被外部杀掉/正在重启的那两分钟里，用户点「立即删除」，
     fetch 直接抛 → 旧写法把英文原文丢进 toast：「删除失败：Failed to fetch」——
     用户完全不知道是"服务不在了、等一会儿就好"，还是"这个文件删不掉、要去看日志"。
     这里（1）先自动重试一次（重启通常几秒就回来），（2）仍失败就给一句人话。 */
  const doFetch = async (attempt = 0) => {
    try {
      const res = await fetch(path, {
        method: opts.method || 'GET',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': BOOT.csrf },
        ...(opts.body ? { body: JSON.stringify(opts.body) } : {}),
      });
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
      return { res, data };
    } catch (e) {
      if (attempt === 0) {
        await new Promise((r) => setTimeout(r, 1200));
        return doFetch(1);
      }
      const err = new Error('服务不可达（多半正在重启）—— 稍等几秒重试；一直这样请到「健康」页看服务状态');
      err.network = true;
      err.cause = e;
      throw err;
    }
  };

  let { res, data } = await doFetch();

  // 服务重启后 CSRF token 会重新生成，本页持有的旧 token 随即失效。
  // 这时**不该让用户自己去刷新页面**：自动重新拉一次 token 并重放本次请求即可。
  // 只对写操作重试（读操作本来就不校验 token），且最多重试一次，避免死循环。
  const isCsrfFailure = res.status === 403 && /CSRF/i.test(String(data?.error ?? ''));
  if (isCsrfFailure && (opts.method && opts.method !== 'GET')) {
    try {
      const boot = await fetch('/api/bootstrap', { headers: { 'Cache-Control': 'no-cache' } });
      const fresh = await boot.json();
      if (fresh && typeof fresh.csrf === 'string') {
        BOOT.csrf = fresh.csrf;
        window.__BOOT__ = BOOT;
        if (!opts.__retried) {
          return api(path, { ...opts, __retried: true });
        }
      }
    } catch {
      /* 拿不到新 token 就按原错误上报 */
    }
  }

  if (!res.ok) {
    const err = new Error(data?.error || `HTTP ${res.status}`);
    err.payload = data;
    err.status = res.status;
    err.csrfFailure = isCsrfFailure;
    throw err;
  }
  return data;
}

function toast(msg, ms = 2600) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__t);
  window.__t = setTimeout(() => el.classList.remove('show'), ms);
}
window.toast = toast;

const toSec = (s) => { const p = String(s).split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1]; };
const toTime = (n) => { n = Math.max(0, Math.round(Number(n) || 0)); return [Math.floor(n / 3600), Math.floor(n % 3600 / 60), n % 60].map((x) => String(x).padStart(2, '0')).join(':'); };
/* ★ 2026-10-16（UI 评审 3.4）：入点 / 时长这类**相对时长**用 mm:ss 表达，不足 1 小时不补小时位。
   为什么单独加一个：原来排期那行写成「00:00:58 · 432 秒」，两个数字一个是 hh:mm:ss、
   一个是裸秒数，紧挨着读极易混淆。统一成「入点 00:58 · 时长 07:12」后一眼能分清。 */
const toMS = (n) => {
  n = Math.max(0, Math.round(Number(n) || 0));
  const h = Math.floor(n / 3600), m = Math.floor((n % 3600) / 60), s = n % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
};
const fmtGB = (b) => { if (!b) return '0 B'; const u = ['B', 'KB', 'MB', 'GB', 'TB']; const i = Math.min(4, Math.floor(Math.log(b) / Math.log(1024))); return (b / 1024 ** i).toFixed(i === 0 ? 0 : 1) + ' ' + u[i]; };

/** 极简 Markdown 渲染（够用即可：标题、列表、粗体、行内代码、引用、段落） */
function md(text) {
  const lines = String(text || '').split('\n');
  let out = '';
  let inUl = false;
  const closeUl = () => { if (inUl) { out += '</ul>'; inUl = false; } };
  for (let raw of lines) {
    let l = raw.replace(/^<!--.*-->$/, '').trimEnd();
    if (!l.trim()) { closeUl(); continue; }
    if (/^>\s?/.test(l)) { closeUl(); out += `<blockquote>${inline(l.replace(/^>\s?/, ''))}</blockquote>`; continue; }
    const h = /^(#{1,4})\s+(.*)$/.exec(l);
    if (h) { closeUl(); out += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`; continue; }
    const li = /^\s*[-*]\s+(.*)$/.exec(l);
    if (li) { if (!inUl) { out += '<ul>'; inUl = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    closeUl();
    out += `<p>${inline(l)}</p>`;
  }
  closeUl();
  return out;
}
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}

/* ============================================================================
 * 数据加载
 * ========================================================================== */
/* ★ 2026-10-16（UI 评审 A-1）：开关的状态必须同时反映到 class 和 aria-checked。
   之前只切 .on，读屏念出来永远是"开关"，不报开还是关。 */
function syncSwitch(sel, on) {
  const el = typeof sel === 'string' ? $(sel) : sel;
  if (!el) return null;
  el.classList.toggle('on', !!on);
  el.setAttribute('aria-checked', on ? 'true' : 'false');
  return el;
}

/* 顶栏的「字幕」开关（默认关，随时能切）。
   为什么单独给它一个按钮、而不是只留在设置里：字幕曾经被**整体关掉**，原因是云端 ASR 的
   句级时间窗不可靠 —— 实测「15 个字的句子占了 0→30.9 秒」，烧出来与声音整体错位。
   换成本地 Fun-ASR 后字级时间戳是准的（实测偏差 ±0.2 秒），那时烧字幕才成立。
   所以这个开关不只显示一个布尔值，它要顺带回答「现在这台机器上烧字幕值不值得」：
   本地引擎 → 绿色；云端引擎 → 琥珀色警告。 */
function renderSubtitleSwitch() {
  const cfg = (state.bootstrap && state.bootstrap.config) || {};
  const on = !!(cfg.clip && cfg.clip.burnSubtitles);
  const provider = String((cfg.asr && cfg.asr.provider) || '');
  const local = provider === 'local-funasr' || provider === 'whisper-cpp';
  syncSwitch('#subSwitch', on);
  const box = $('#subMode');
  if (box) {
    box.classList.toggle('ok', on && local);
    box.classList.toggle('warn', on && !local);
  }
  const t = $('#subText');
  if (t) t.textContent = !on ? '字幕：关' : (local ? '字幕：开 · 本地 ASR' : '字幕：开 · 云端 ASR 可能错位');
}

/* 顶栏的「全自动 · 免确认发布」开关。
   ★ 2026-10-16（UI 评审 3.1）：这个开关开启时**单独走琥珀色**，不再和普通开关共用品牌粉。
   为什么：它是全站唯一"点一下就会自动对外发文、且不再问你"的设置，
   之前和"字幕开关"长得一模一样 —— 高风险设置必须有区别于普通开关的视觉语言。
   另外给它加了第一次开启的显式确认（见 45- 的 onclick）。 */
function renderModeSwitch(autoPublish) {
  const sw = syncSwitch('#modeSwitch', autoPublish);
  const box = $('#modeBox');
  if (box) {
    box.classList.toggle('risk', !!autoPublish);
    sw && sw.classList.toggle('risk', !!autoPublish);
  }
  $('#modeText').textContent = autoPublish ? '全自动 · 免确认发布' : '半自动 · 需确认后发布';
}

/**
 * 构建徽章（2026-10-25）：把"进程跑的代码指纹"和"磁盘上的代码指纹"的差异直接摆到顶栏。
 *
 * 为什么值得占一个位置：配额限流那次修复已经落盘、测试全绿，但服务没重启，
 * 用户点重投依旧被旧逻辑撞死，只能靠人翻进程启动时间才能发现。
 * 现在只要徽章转红写着「需重启」，一眼就知道"修复还没生效"。
 */
function renderBuildTag(build) {
  const el = document.getElementById('buildTag');
  if (!el) return;
  const ver = (state.bootstrap && state.bootstrap.version) || '';
  const id = (build && build.id) || '--------';
  const stale = !!(build && build.stale);
  el.classList.toggle('stale', stale);
  el.textContent = stale ? '⚠ 代码已更新 · 需重启' : `v${ver} · ${id}`;
  const lines = [
    stale
      ? `磁盘代码已更新（${build.diskId || '?'}），但当前进程仍在跑 ${id}`
      : `已是最新代码（${id}）`,
    stale ? '重启服务后新修复才会生效' : '与磁盘上的 src/ 与 web/src/ 完全一致',
  ];
  if (build && build.at) {
    const d = new Date(build.at);
    lines.push(`代码最后修改：${d.toLocaleString('zh-CN')}`);
  }
  if (build && build.note) lines.push(build.note);
  el.title = lines.join('\n');
}

async function loadBootstrap() {
  state.bootstrap = await api('/api/bootstrap');
  const b = state.bootstrap;
  renderBuildTag(b.build);
  renderModeSwitch(b.mode.autoPublish);
  renderSubtitleSwitch();
  /* 房间号只有一个（它只用于"开播触发"这条次要路径），而**导入走目录轮询**、
     覆盖录制根目录下的全部主播 ⇒ 把覆盖数一并显示，免得看起来像"只处理一个直播间"
     （2026-10-13 用户就是照这里问的："只能单个直播间吗，我想两个都显示"）。 */
  const covered = Number(b.coveredStreamers || 0);
  $('#brandText').textContent =
    `房间 ${b.roomId}` +
    (covered > 1 ? `（触发）· 轮询覆盖 ${covered} 个直播间` : covered === 1 ? ' · 轮询覆盖 1 个直播间' : '') +
    ` · v${b.version}` +
    (b.mode.isOnlySelf ? ' · 仅自己可见' : '') +
    (b.seasonConfigured ? '' : ' · 未配置合集');
}

async function loadTasks() {
  const qs = new URLSearchParams();
  if (state.status) qs.set('status', state.status);
  if (state.q) qs.set('q', state.q);
  const data = await api('/api/tasks?' + qs.toString());
  state.tasks = data.tasks;
  state.monthly = data.monthly;
  if (!state.activeId && state.tasks.length) state.activeId = state.tasks[0].id;
  if (state.activeId && !state.tasks.some((t) => t.id === state.activeId)) {
    state.activeId = state.tasks.length ? state.tasks[0].id : null;
  }
  renderTaskList();
}

async function loadDetail() {
  if (!state.activeId) { $('#detail').innerHTML = '<div class="empty">左侧还没有任务。服务正在轮询录制历史，也可以在右上角点「立即检查」。</div>'; return; }
  state.detail = await api('/api/task/' + encodeURIComponent(state.activeId));
  renderDetail();
}

async function loadSchedule() {
  state.schedule = await api('/api/schedule');
  /* 自动导入的状态也一起取：用户看不到"它在等什么"时，会以为轮询没生效，
     然后自己去手动导入（于是任务标成「手动导入」，更困惑）。 */
  try { state.watch = await api('/api/watch'); } catch { state.watch = null; }
  /* 账号受限闸门（2026-10-22）：24h 内 2 次配额拒绝 ⇒ 暂停投稿。
     不取它的话，用户点「重跑发布阶段」会没反应又不知道为什么。 */
  try { state.quotaGuard = await api('/api/publish/quota-guard'); } catch { state.quotaGuard = null; }
  renderSchedule();
}

async function refreshAll(silent) {
  try {
    await loadTasks();
    await Promise.all([loadDetail(), loadSchedule()]);
    void refreshPendingBadge();
  } catch (e) {
    if (!silent) toast('加载失败：' + e.message);
  }
}

/**
 * 待删清单角标：有待删文件时直接在**页签**上显示数量和释放空间。
 *
 * 为什么要在页签上提示而不是只写在页面里：这个功能的默认宽限期是 24 小时，
 * 用户很可能根本不记得它还挂着 —— 到点删掉了源录播才发现就晚了。
 * （2026-10-11：入口从设置弹窗搬到了标签栏，角标跟着搬到页签上；旧 id 保留兼容。）
 */
async function refreshPendingBadge() {
  const badge = $('#pendingTabBadge') || $('#pendingDeleteBadge');
  const hint = $('#pendingDeleteHint');
  if (!badge) return;
  try {
    const r = await api('/api/pending-delete');
    const n = r.stats.pendingCount;
    if (n > 0) {
      badge.textContent = `（${n} 项 · ${fmtBytes(r.stats.pendingBytes)}）`;
      badge.style.color = '#c33';
      if (hint && r.stats.nextDueAt) hint.textContent = `最早 ${fmtTime(Date.parse(r.stats.nextDueAt))} 自动删除；宽限期内可取消。`;
    } else {
      badge.textContent = '';
      if (hint) hint.textContent = '本场全部切片确认投稿成功后，成片与源录播会排进待删清单，宽限期过后自动删除。宽限期内可在这里取消。';
    }
  } catch {
    /* 角标拿不到不影响主流程 */
  }
}

/**
 * 待删清单的「立即删除」：确认文案必须区分**两种截然不同的后果**。
 *
 * - 同盘（`willTrash`）→ 移入回收站，7 天内可恢复 → 文案说明"可恢复"；
 * - 异盘 → 回收站在别的盘，整份复制 20 GB 不现实 → 直接删，**不可恢复** →
 *   必须用"永久删除 / 无法恢复"这样的字眼，并把文件名列出来，别让人点下去才发现。
 *
 * 返回删除结果（`null` = 用户取消），调用方据此刷新自己的视图。
 */
async function deletePendingNow(ids, entries) {
  const list = (entries || []).filter((e) => ids.includes(e.id));
  /* 防御：真要删的条目一个都不在**待删**清单里（比如界面给了已删条目的按钮、或清单刚被别处刷新过）
     就别弹"共 0.0 MB"那种莫名其妙的话 —— 直接说清并收手。 */
  if (ids.length === 0 || list.length === 0) {
    toast('这些条目已经处理过了，无需再删', 5000);
    return null;
  }
  const permanent = list.filter((e) => e.willTrash === false);
  const gone = list.filter((e) => e.existsNow === false);
  const mb = (list.reduce((a, e) => a + (Number(e.sizeBytes) || 0), 0) / 1048576).toFixed(1);
  let msg = `立即删除 ${ids.length} 个文件（共 ${mb} MB）？\n\n不是等到宽限期，而是现在就删。`;
  const toTrash = list.length - permanent.length - gone.length;
  if (toTrash > 0) msg += `\n· ${toTrash} 个移入回收站，7 天内可恢复`;
  if (gone.length) msg += `\n· ${gone.length} 个文件已经不在磁盘上（只会标记为已删除）`;
  if (permanent.length) {
    const names = permanent.slice(0, 3).map((e) => String(e.path).split(/[\\/]/).pop());
    msg += `\n\n⚠️ 其中 ${permanent.length} 个在别的盘（回收站在本盘），删除后【无法恢复】：\n  ${names.join('\n  ')}${permanent.length > 3 ? `\n  …等 ${permanent.length} 个` : ''}`;
  }
  if (!confirm(msg)) return null;

  const body = ids.length === 1 ? { id: ids[0] } : { ids };
  const r = await api('/api/pending-delete/delete', { method: 'POST', body });
  toast(r.note, 7000);
  void refreshPendingBadge();
  return r;
}

/** 待删条目的一行标签与按钮（清单页 / 监控面板共用，两处文案不能漂移） */
function pendingRowActions(e, opts = {}) {
  /* ★ 2026-10-11 用户实测踩到：**「最近已删除」的行也挂着「立即删除」按钮** ——
     点下去还弹「立即删除 1 个文件（共 0.0 MB）？」，纯属误导（文件早就不在了；
     服务端会把它归到 skipped「这一条已经删过了」）。已删条目只留结果说明，不给任何动作按钮。
     行正文里已经写了「已移入回收站 / 已永久删除」（`deletedBy`），所以这里什么都不用再挂。 */
  if (e.deletedAt || e.deletedBy) return e.deletedBy ? '' : '<span class="tag-mini">已删除</span>';
  const willTrash = e.willTrash !== false;
  const tag = e.existsNow === false
    ? '<span class="tag-mini">文件已不在</span>'
    : willTrash
      ? '<span class="tag-mini">删除→回收站</span>'
      : '<span class="tag-mini" style="background:#fdecec;color:#c33">跨盘·删除不可恢复</span>';
  const label = e.existsNow === false ? '标记为已删除' : '立即删除';
  return `${tag}<button class="btn-sm" style="margin-left:6px" data-pending-del="${esc(e.id)}">${label}</button>` +
    (opts.cancellable ? `<button class="btn-sm" data-cancel="${esc(e.id)}">取消删除</button>` : '');
}
