/* ============================================================================
 * 实时监控（/api/monitor，默认 5 秒自动刷新）
 *
 * 为什么单独做一页而不是把「健康面板」改成自动刷新：
 *   健康面板回答的是"依赖是否正常"（biliLive-tools 连没连上、账号还有几天），
 *   是**偶发查看**的；而用户守着直播时真正要盯的是另外四件事：
 *     ① 现在在干什么（流水线跑到哪一步、进度多少、已经用了多久）
 *     ② 在等什么（等 biliLive-tools 的完整版稿件？等到什么时候？）
 *     ③ 为什么没动（目录轮询上一轮对每个文件下了什么结论 —— 这是"录播没被导入"的唯一答案）
 *     ④ 有没有坏事（最近错误、待删清单到期）
 *   把这四件事做成每 5 秒自刷的新页，既不动原有页面（改坏风险为零），也符合"守着看"的用法。
 * ========================================================================== */

/** 可选的自动刷新间隔（秒）；0 视为暂停 */
const MON_INTERVAL_OPTIONS = [3, 5, 10, 30];

function stopMonitor() {
  const m = state.mon;
  if (m.timer) { clearInterval(m.timer); m.timer = null; }
}

function startMonitor() {
  const m = state.mon;
  stopMonitor();
  if (m.paused) return;
  m.timer = setInterval(() => {
    if (state.view !== 'monitor' || document.hidden) return;
    loadMonitor(true).catch(() => {});
  }, Math.max(1, m.interval) * 1000);
}

/**
 * 数据指纹：去掉**每次必然变化**的字段再比，用来决定"要不要整页重画"。
 * 不这么做的话，5 秒一次的 innerHTML 重画会把页面变成闪烁的幻灯片。
 *
 * 实测踩到的坑（都是浏览器端到端测试 + 两次快照对比抓到的）：
 *   ① 忘了去掉 `now` —— 它是每次请求都变的时间戳，于是指纹永远不同、永远重画；
 *   ② 磁盘余量 `freeGB` 是浮点数，服务每写一行日志它就变一点点（0.00x GB），
 *      按**显示精度**（0.1 GB）比才不会因为看不见的变化而重画；原始字节数 `freeBytes` 直接跳过；
 *   ③ `account.daysLeft` 是连续倒计时（89.990336 → 89.990301），同样按显示精度比。
 */
function monSignature(d) {
  const SKIP = new Set([
    'now', 'uptimeSec', 'lastScanAgoSec', 'elapsedSec', 'remainSec', 'nextDueSec', 'scanning',
    // 原始字节数：面板显示的是 GB（已按 0.1 GB 比），这两个字段每写一行日志都在动
    'freeBytes', 'totalBytes',
  ]);
  const ROUND1 = new Set(['freeGB', 'totalGB', 'daysLeft']);
  const walk = (o) => {
    if (Array.isArray(o)) return o.map(walk);
    if (o && typeof o === 'object') {
      return Object.fromEntries(
        Object.entries(o)
          .filter(([k]) => !SKIP.has(k))
          .map(([k, v]) => [k, ROUND1.has(k) && typeof v === 'number' ? Number(v.toFixed(1)) : walk(v)]),
      );
    }
    return o;
  };
  try { return JSON.stringify(walk(d)); } catch { return String(Date.now()); }
}

async function loadMonitor(silent) {
  const m = state.mon;
  if (m.busy) return;
  m.busy = true;
  try {
    const d = await api('/api/monitor');
    m.data = d;
    m.lastAt = Date.now();
    m.lastError = '';
    const sig = monSignature(d);
    if (silent && sig === m.sig) {
      // 数据没变：只更新"最后更新"这一行，不重画（避免闪烁/打断滚动）
      const el = $('#monUpdated');
      if (el) el.textContent = `最后更新 ${new Date(m.lastAt).toLocaleTimeString()} · 无变化`;
    } else {
      m.sig = sig;
      renderMonitor($('#otherPage'));
    }
  } catch (e) {
    m.lastError = e.message;
    if (!m.data) $('#otherPage').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
    else {
      const el = $('#monUpdated');
      if (el) el.textContent = `刷新失败（显示的是旧数据）：${e.message}`;
    }
  } finally {
    m.busy = false;
  }
}

function renderMonitor(box) {
  const m = state.mon;
  const d = m.data;
  if (!d) {
    box.innerHTML = '<div class="empty">加载中…</div>';
    return;
  }
  const kpi = (k, v, n, cls) => `<div class="kpi ${cls || ''}"><div class="k">${esc(k)}</div><div class="v ${String(v).length > 8 ? 'sm' : ''}">${v}</div><div class="n">${esc(n || '')}</div></div>`;
  const badge = (txt, cls) => `<span class="badge ${cls}">${esc(txt)}</span>`;
  const fileBase = (p) => String(p || '').split(/[\\/]/).pop();
  const secText = (s) => {
    const n = Math.max(0, Math.round(Number(s) || 0));
    if (n < 60) return `${n} 秒`;
    if (n < 3600) return `${Math.floor(n / 60)} 分 ${n % 60} 秒`;
    return `${Math.floor(n / 3600)} 小时 ${Math.floor((n % 3600) / 60)} 分`;
  };
  const statusBadge = (status) => {
    const map = { PUBLISHED: ['已投稿', 'b-done'], ARCHIVED: ['已归档', 'b-done'], FAILED: ['失败', 'b-fail'], PUBLISHING: ['投稿中', 'b-run'], CLIPPING: ['切片中', 'b-run'], ANALYZING: ['分析中', 'b-run'], TRANSCRIBING: ['转写中', 'b-run'], CLIPPED: ['已切片', 'b-wait'], ANALYZED: ['待确认', 'b-wait'], PENDING: ['排队中', 'b-idle'], RECORDED: ['已录制', 'b-idle'] };
    const [txt, cls] = map[status] || [status, 'b-idle'];
    return badge(txt, cls);
  };

  /* ---- 顶部：这一页是什么、多久刷一次、最后更新 ---- */
  let html = `<h2 style="font-size:16px;margin:0 0 14px">实时监控
    <span class="mono-sm" id="monUpdated" style="font-weight:400;color:var(--text-3)">
      最后更新 ${m.lastAt ? new Date(m.lastAt).toLocaleTimeString() : '—'}${m.paused ? ' · 已暂停' : ` · 每 ${m.interval} 秒`}</span>
    <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <select id="monAuto" class="tinput" style="width:auto">
        ${MON_INTERVAL_OPTIONS.map((s) => `<option value="${s}"${s === m.interval && !m.paused ? ' selected' : ''}>每 ${s} 秒</option>`).join('')}
        <option value="0"${m.paused ? ' selected' : ''}>暂停自动刷新</option>
      </select>
      <button class="btn-sm" data-act="mon-refresh">立即刷新</button>
    </span></h2>`;

  /* ---- 状态灯 ---- */
  const h = d;
  const acct = h.account;
  html += `<div class="kpis">
    ${kpi('biliLive-tools', h.bililive && h.bililive.ok ? '已连接' : '未连接', h.bililive ? `${h.bililive.version || '?'}（核实 ${h.bililive.expected}）` : '', h.bililive && h.bililive.ok ? (h.bililive.drift ? 'warn' : 'ok') : 'bad')}
    ${kpi('B站账号', acct ? (acct.expired ? '已过期' : '有效') : '未知', acct ? `${acct.name || acct.uid}${acct.daysLeft ? ' · 剩 ' + acct.daysLeft.toFixed(1) + ' 天' : ''}` : '未获取', acct && acct.expired ? 'bad' : acct && acct.daysLeft <= 7 ? 'warn' : 'ok')}
    ${kpi('磁盘剩余', h.disk ? h.disk.freeGB.toFixed(1) + ' GB' : '未知', h.disk ? `总 ${h.disk.totalGB.toFixed(0)} GB · 阈值 ${h.disk.thresholdGB} GB` : '', h.disk && h.disk.low ? 'bad' : 'ok')}
    ${kpi('队列', h.queue && h.queue.busy ? '处理中' : '空闲', `排队 ${h.queue ? h.queue.length : 0}${h.queue && h.queue.paused ? ' · 磁盘守卫已暂停' : ''}`, h.queue && h.queue.paused ? 'bad' : '')}
    ${kpi('今日已投稿', h.dailyLimit > 0 ? `${h.todayPublished} / ${h.dailyLimit}` : String(h.todayPublished), h.dailyLimit > 0 ? '每日上限' : '不限额', h.dailyLimit > 0 && h.todayPublished >= h.dailyLimit ? 'warn' : '')}
    ${kpi('今日花费', '¥' + Number(h.costToday.total || 0).toFixed(2), `转写 ¥${Number(h.costToday.asr || 0).toFixed(2)} · 分析 ¥${Number(h.costToday.llm || 0).toFixed(4)}`, '')}
    ${kpi('待删清单', String(h.pendingDelete.count || 0), h.pendingDelete.count ? `共 ${h.pendingDelete.totalMB} MB${h.pendingDelete.nextDueSec !== null ? ' · 最近 ' + secText(h.pendingDelete.nextDueSec) + ' 后' : ''}` : '没有待删文件', h.pendingDelete.overdueCount ? 'warn' : '')}
    ${kpi('近 24h 错误', String(h.errorsLast24h), h.errors.length ? `最近：${h.errors[0].type}` : '没有错误事件', h.errorsLast24h > 0 ? 'warn' : 'ok')}
  </div>`;
  if (h.healthError) html += `<div class="barstrip warn">健康检查失败：<b>${esc(h.healthError)}</b> —— 下面显示的是"能拿到的那部分"，不代表助手没在跑。</div>`;

  /* ---- ① 现在在干什么 ---- */
  const stageStrip = (p) => (h.stageLabels || []).map((label, i) => {
    const st = (p.stages && p.stages[i]) || 'todo';
    const mark = st === 'done' ? '✓' : st === 'fail' ? '!' : st === 'active' ? '•' : '';
    const prog = st === 'active' && p.progress && p.progress.total ? `<span class="prog">${p.progress.current}/${p.progress.total}</span>` : '';
    return `<span class="stage ${st}"><span class="dot">${mark}</span>${esc(label)}${prog}</span>`;
  }).join('<span class="arrow">›</span>');

  html += `<div class="card"><h2>流水线（现在在干什么）${d.pipeline.length ? badge(`${d.pipeline.length} 个活跃任务`, 'b-run') : badge('空闲', 'b-idle')}</h2>`;
  if (d.pipeline.length) {
    html += `<table class="tbl"><thead><tr><th>任务</th><th>状态</th><th style="width:46%">阶段</th><th>已用</th><th class="num">花费</th></tr></thead><tbody>
      ${d.pipeline.map((p) => `<tr>
        <td><a href="#" data-act="mon-open" data-id="${esc(p.id)}" style="color:inherit;text-decoration:none;border-bottom:1px dotted #c9ced4">${esc(p.title)}</a>
          <div class="mono-sm" style="color:var(--text-3)">${esc(p.streamer || '')} · ${esc(p.id)} · ${esc(p.importSource === 'auto' ? '自动导入' : p.importSource === 'manual' ? '手动导入' : '录制触发')}</div></td>
        <td>${statusBadge(p.status)}${p.publishWaiting ? badge('等完整稿件', 'b-wait') : ''}${p.hasError ? badge('有错误', 'b-fail') : ''}
          <div class="mono-sm" style="color:var(--text-3)">${esc(p.statusText || '')}</div></td>
        <td><div class="stages" style="margin:0">${stageStrip(p)}</div></td>
        <td class="mono-sm">${secText(p.elapsedSec)}</td>
        <td class="num">¥${Number(p.costYuan || 0).toFixed(2)}</td></tr>`).join('')}
    </tbody></table>`;
  } else {
    html += `<div class="empty">没有正在处理的任务${h.queue && h.queue.busy ? '（队列标记为处理中，可能是刚结束一跳）' : ''}。新录播出现后这里会自动冒出来。</div>`;
  }
  html += `</div>`;

  /* ---- ② 在等什么 ---- */
  const noWait = !d.waiting.length && !d.scheduled.count && !d.pendingDelete.count;
  html += `<div class="card"><h2>在等什么</h2>`;
  if (noWait) html += `<div class="empty">没有等待项：没有任务在等完整版稿件，也没有排期待投的切片。</div>`;
  if (d.waiting.length) {
    html += `<h3 style="font-size:13px;margin:8px 0 8px">等 biliLive-tools 投出完整版（投出后切片会自动追加成分P）</h3>
      <table class="tbl"><thead><tr><th>任务</th><th>为什么等</th><th>剩余</th><th class="num">已试</th></tr></thead><tbody>
      ${d.waiting.map((w) => `<tr><td>${esc(w.title)}<div class="mono-sm" style="color:var(--text-3)">${esc(w.id)}</div></td>
        <td>${esc(w.reason)}</td>
        <td class="mono-sm">${w.expired ? '<span style="color:#c8811a">已超时，等人工处理</span>' : secText(w.remainSec)}</td>
        <td class="num">${w.attempts}</td></tr>`).join('')}</tbody></table>`;
  }
  if (d.scheduled.count || d.cutAwaitingCount) {
    html += `<h3 style="font-size:13px;margin:14px 0 8px">已排期待投（${d.scheduled.count} 条${d.cutAwaitingCount ? ` · 另有 ${d.cutAwaitingCount} 条已切好待投` : ''}）</h3>`;
    html += d.scheduled.next.length
      ? `<table class="tbl"><thead><tr><th>计划投稿时间</th><th>切片</th><th>任务</th><th>状态</th></tr></thead><tbody>
        ${d.scheduled.next.map((s) => `<tr><td class="mono-sm">${esc(s.dtimeText)}</td><td>${esc(s.title)}</td><td class="mono-sm">${esc(s.taskId)}</td><td>${statusBadge(s.status)}</td></tr>`).join('')}
        </tbody></table>`
      : `<div class="empty">没有带定时时间的切片（这些是已切好、等发布阶段的）。</div>`;
  }
  if (d.pendingDelete.count) {
    html += `<h3 style="font-size:13px;margin:14px 0 8px">待删文件（${d.pendingDelete.count} 个 · 共 ${d.pendingDelete.totalMB} MB）
      ${d.pendingDelete.count > 1 ? '<button class="btn-sm" data-pending-delall="1" style="margin-left:8px;border-color:#f0c8c8;color:#c33">全部立即删除</button>' : ''}</h3>
      <table class="tbl"><thead><tr><th>到期</th><th>文件</th><th class="num">大小</th><th>为什么删</th><th>操作</th></tr></thead><tbody>
      ${d.pendingDelete.items.map((i) => `<tr><td class="mono-sm">${esc(fmtTime(Date.parse(i.dueAt)))}</td>
        <td class="mono-sm" title="${esc(i.path)}">${esc(fileBase(i.path))}<div style="color:var(--text-3)">${esc(i.kind)} · ${esc(i.taskId || '')}</div></td>
        <td class="num">${i.sizeMB} MB</td><td style="color:var(--text-3)">${esc(String(i.reason || '').slice(0, 70))}</td>
        <td>${pendingRowActions(i)}</td></tr>`).join('')}
      </tbody></table>`;
  }
  html += `</div>`;

  /* ---- ③ 为什么没动：目录轮询 ---- */
  const w = d.watch || {};
  const outs = w.outcomes || [];
  const skipped = outs.filter((o) => o.skipped);
  html += `<div class="card"><h2>目录轮询（为什么某个录播没被导入）
    ${w.enabled ? badge(w.scanning ? '正在扫描' : '在跑', w.scanning ? 'b-run' : 'b-done') : badge('未启用', 'b-idle')}</h2>
    <div class="kv" style="margin-bottom:10px">
      <div class="k">监控目录</div><div class="mono-sm">${(w.dirs || []).map((x) => esc(x)).join('<br>') || '（无）'}</div>
      <div class="k">上次扫描</div><div>${w.lastScanAt ? `${esc(fmtTime(Date.parse(w.lastScanAt)))}（${secText(w.lastScanAgoSec)}前）` : '还没扫过'}</div>
      <div class="k">累计自动导入</div><div>${w.importedTotal || 0} 场${w.backoffCount ? ` · 失败退避中 ${w.backoffCount} 个` : ''}</div>
    </div>`;
  if (d.recordingNow.length) {
    html += `<h3 style="font-size:13px;margin:6px 0 8px">正在录制（还在写入，写稳了才会导入）</h3>
      <table class="tbl"><thead><tr><th>文件</th><th>标题</th><th class="num">大小</th></tr></thead><tbody>
      ${d.recordingNow.map((r) => `<tr><td class="mono-sm">${esc(r.fileName)}</td><td>${esc(r.title)}</td><td class="num">${r.sizeMB} MB</td></tr>`).join('')}
      </tbody></table>`;
  }
  if (outs.length) {
    const show = outs.slice(0, 12);
    html += `<h3 style="font-size:13px;margin:14px 0 8px">上一轮对每个文件的结论（共 ${outs.length} 个，其中 ${skipped.length} 个没导）</h3>
      <table class="tbl"><thead><tr><th>文件</th><th class="num">大小</th><th>结论</th></tr></thead><tbody>
      ${show.map((o) => {
        const stillWriting = /仍在写入|可能仍在录制/.test(String(o.skipped || ''));
        const verdict = o.taskId
          ? `<span style="color:var(--green)">已导入（任务 ${esc(o.taskId)}）</span>`
          : stillWriting
            ? '<span style="color:#1a86c7">正在录制，等写完</span>'
            : `<span style="color:var(--text-3)">${esc(o.skipped || o.error || '—')}</span>`;
        return `<tr><td class="mono-sm" title="${esc(o.videoPath || '')}">${esc(o.fileName)}</td><td class="num">${o.sizeMB} MB</td><td>${verdict}</td></tr>`;
      }).join('')}
      </tbody></table>
      ${outs.length > show.length ? `<div class="empty">还有 ${outs.length - show.length} 个未显示（清单太长时这里只列前 12 个）。</div>` : ''}`;
  } else {
    html += `<div class="empty">上一轮没扫到任何录播。若目录里确实有文件，点上面的「立即刷新」看结论，或去「导入录播」检查扫描目录。</div>`;
  }
  html += `</div>`;

  /* ---- ④ 它在压制/上传什么（biliLive-tools 自己的队列） ---- */
  html += `<div class="card"><h2>biliLive-tools 队列（完整版的压制与上传）${d.llcQueue.length ? badge(`${d.llcQueue.length} 个进行中`, 'b-run') : badge('空闲', 'b-idle')}</h2>`;
  if (d.llcQueue.length) {
    html += `<table class="tbl"><thead><tr><th>类型</th><th>状态</th><th>产物</th><th>ID</th></tr></thead><tbody>
      ${d.llcQueue.map((t) => `<tr><td>${esc(t.type || '')}</td><td>${esc(t.status || '')}</td><td class="mono-sm">${esc(fileBase(t.output) || '—')}</td><td class="mono-sm" style="color:var(--text-3)">${esc(String(t.id || '').slice(0, 12))}</td></tr>`).join('')}
      </tbody></table>
      <div class="empty">它把完整版（弹幕版 + 纯享版）投出去之后，上面「等完整版的切片」才会被追加成分P。</div>`;
  } else if (d.llcQueueError) {
    html += `<div class="empty">查不到它的队列（${esc(d.llcQueueError)}）—— 不影响助手本身，这只是"顺路看一眼"。</div>`;
  } else {
    html += `<div class="empty">它现在没有在跑的压制/上传任务。</div>`;
  }
  html += `</div>`;

  /* ---- 已投稿文件：盘上哪些产物已经交出去了、审核到什么程度、能不能删 ---- */
  {
    const uf = d.uploadedFiles || { count: 0, items: [], deletableCount: 0, totalMB: 0, deletedCount: 0 };
    html += `<div class="card"><h2>已投稿文件
      ${uf.deletableCount ? badge(`${uf.deletableCount} 个可删`, 'b-run') : ''}
      ${uf.totalMB ? `<span style="font-size:12px;color:var(--text-3);font-weight:400">共 ${uf.totalMB} MB</span>` : ''}
    </h2>`;
    if (uf.error) html += `<div class="hintline warn" style="margin-bottom:8px">查不到审核状态（${esc(uf.error)}）—— 下面显示的是最后一次拿到的结果</div>`;
    if (!uf.items.length) {
      html += `<div class="empty">还没有已经投出去的文件。等切片或完整版上传成功后，这里会列出来。</div>`;
    } else {
      html += `<table class="tbl"><thead><tr><th>状态</th><th>类型</th><th>文件 / 标题</th><th class="num">大小</th><th></th></tr></thead><tbody>`;
      html += uf.items.map((i) => {
        /* 状态列：投成功了就显示可点的 bv 号（和「最近投稿」一样新窗口打开），
           还在审核就显示「审核中」。后面的小字是 B站 给的状态标签，只作参考 ——
           bv 号是否可点**只由** reviewState 决定，与标签无关。 */
        const bvidTip = i.bvidFrom === 'clip'
          ? 'bvid 取自本场切片：完整版是录制结束后才压出来的，台账里没有它的 bvid，而我们的切片正是追加进它那个稿件'
          : '';
        const statusCell = i.reviewState === 'published' && i.bvid
          ? `<a href="${esc(i.url)}" target="_blank" rel="noreferrer" class="mono-sm" style="font-weight:600;text-decoration:none"${bvidTip ? ` title="${esc(bvidTip)}"` : ''}>${esc(i.bvid)}</a>`
            + (i.stateLabel && !/已通过|开放浏览/.test(String(i.stateLabel))
              ? `<br><span style="font-size:11px;color:var(--text-3)" title="B站 返回的稿件状态，仅供参考">${esc(i.stateLabel)}</span>`
              : '')
          : `<span class="tag-mini" style="background:#fff8ec;color:#c8811a" title="${esc(i.stateLabel || '')}">${esc(i.reviewText || '审核中')}</span>`;
        return `<tr>
          <td>${statusCell}</td>
          <td><span class="tag-mini">${esc(i.kindText)}</span>${i.clipIndex !== undefined ? ` <span class="mono-sm" style="color:var(--text-3)">#${i.clipIndex}</span>` : ''}</td>
          <td>${esc(String(i.fileName || i.title).slice(0, 46))}<br><span style="color:var(--text-3);font-size:12px">${esc(String(i.title).slice(0, 40))}</span></td>
          <td class="num">${esc(i.sizeText || i.sizeMB + ' MB')}</td>
          <td>${i.deletable
            ? `<button class="btn-sm" data-act="del-published" data-key="${esc(i.key)}" data-file="${esc(i.fileName || '')}" data-bvid="${esc(i.bvid || '')}" data-size="${esc(i.sizeText || '')}" data-review="${esc(i.reviewState === 'published' ? '' : (i.reviewText || ''))}" style="border-color:#f0c8c8;color:#c33">删除</button>`
            : `<span style="color:var(--text-3);font-size:12px" title="只有已经反查到 bvid 的文件才允许在这里删">审核中不可删</span>`}</td>
        </tr>`;
      }).join('');
      html += `</tbody></table>`;
      const notes = [];
      if (uf.deletedCount) notes.push(`另有 ${uf.deletedCount} 项产物已删除（在回收站里，可恢复）`);
      if (uf.deletableCount) notes.push('「删除」只删本地文件并移入回收站，**不会**撤回 B站 上的稿件');
      if (notes.length) html += `<div style="margin-top:8px;font-size:12px;color:var(--text-3)">${notes.join('；')}</div>`;
    }
    html += `</div>`;
  }

  /* ---- 最近投稿 + 最近错误 ---- */
  html += `<div class="card"><h2>最近投稿</h2>`;
  html += d.recentPublished.length

    ? d.recentPublished.map((t) => `<div style="margin-bottom:10px">
        <b>${esc(t.title)}</b> <span class="mono-sm" style="color:var(--text-3)">${esc(fmtTime(Date.parse(t.publishedAt)))} · ${esc(t.id)}</span>
        <div style="margin-top:4px">${t.clips.length ? t.clips.map((c) => `<a class="tag-mini" href="${esc(c.url)}" target="_blank" rel="noreferrer" style="text-decoration:none">${esc(c.bvid)} · ${esc(String(c.title).slice(0, 24))}</a>`).join('') : '<span style="color:var(--text-3)">没有可回查的 bvid</span>'}</div>
      </div>`).join('')
    : `<div class="empty">还没有投出去的切片。</div>`;
  html += `</div>`;

  html += `<div class="card"><h2>最近错误（errors.jsonl）</h2>`;
  html += d.errors.length
    ? `<table class="tbl"><thead><tr><th>时间</th><th>阶段</th><th>类型</th><th>消息</th><th></th></tr></thead><tbody>
      ${d.errors.map((e) => `<tr><td class="mono-sm">${esc(fmtTime(Date.parse(e.at)))}</td><td>${esc(e.stage)}</td>
        <td><span class="tag-mini">${esc(e.type)}</span></td><td>${esc(String(e.message).slice(0, 120))}</td>
        <td><button class="btn-sm" data-act="openreport" data-report="${esc(e.reportId)}">报告</button></td></tr>`).join('')}
      </tbody></table>`
    : `<div class="empty">没有错误事件。</div>`;
  html += `</div>`;

  box.innerHTML = html;

  /* ---- 绑定 ---- */
  const sel = $('#monAuto');
  if (sel) sel.onchange = () => {
    const v = Number(sel.value);
    m.paused = v === 0;
    if (!m.paused) m.interval = v;
    startMonitor();
    renderMonitor(box);
  };
  const rf = $('[data-act="mon-refresh"]');
  if (rf) rf.onclick = async () => {
    rf.disabled = true;
    try { await loadMonitor(true); toast('已刷新'); } catch (e) { toast(e.message); } finally { rf.disabled = false; }
  };
  /* 待删文件：监控页上直接能删（不用再翻到设置里的「查看待删清单」）。
     确认文案由 deletePendingNow 按"进回收站 / 永久删除"分别给出。 */
  $$('[data-pending-del]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try {
      const res = await deletePendingNow([b.dataset.pendingDel], (m.data.pendingDelete.items || []));
      if (res === null) { b.disabled = false; return; }
      await loadMonitor(true); // 立刻重画：让用户看到它从待删里消失
    } catch (e) { toast('删除失败：' + e.message, 6000); b.disabled = false; }
  });
  const delAllMon = $('[data-pending-delall]');
  if (delAllMon) delAllMon.onclick = async () => {
    delAllMon.disabled = true;
    try {
      const res = await deletePendingNow((m.data.pendingDelete.items || []).map((x) => x.id), m.data.pendingDelete.items || []);
      if (res === null) { delAllMon.disabled = false; return; }
      await loadMonitor(true);
    } catch (e) { toast('删除失败：' + e.message, 6000); delAllMon.disabled = false; }
  };
  /* 已投稿文件：只删**本地文件**，走回收站；B站 上的稿件不受影响。
     确认框必须把这两件事都说清楚 —— 用户很容易以为「删除」是把稿件撤下来。 */
  $$('[data-act="del-published"]').forEach((b) => b.onclick = async () => {
    const fileName = b.dataset.file || '';
    const bvid = b.dataset.bvid || '';
    const sizeText = b.dataset.size || '?';
    const review = b.dataset.review || '';
    const okGo = confirm(
      '删除这个已投稿的产物文件吗？\n\n' +
      `文件：${fileName}（${sizeText}）\n` +
      `对应稿件：${bvid}${review ? `（${review}）` : ''}\n\n` +
      '· 文件会**移入回收站**，可以恢复；\n' +
      '· B站 上的稿件**不会**被撤回或删除' + (review ? `，它现在${review}，删本地文件不影响审核` : '') + '；\n' +
      '· 台账里的投稿记录保留，之后重跑仍会被幂等拦住，不会重复投稿。'
    );
    if (!okGo) return;
    b.disabled = true;
    try {
      const r = await api('/api/published-file/delete', { method: 'POST', body: { key: b.dataset.key, confirm: true } });
      toast(r.note || '已删除', 7000);
      await loadMonitor(true); // 立刻重画：让那一行消失
    } catch (e) { toast('删除失败：' + e.message, 6000); b.disabled = false; }
  });
  $$('[data-act="mon-open"]').forEach((a) => a.onclick = (ev) => {
    ev.preventDefault();
    // 点标题 → 跳到任务页并选中这一场（不用自己再去列表里找）
    state.activeId = a.dataset.id;
    switchView('tasks');
    renderTaskList();
    loadDetail().catch((e) => toast(e.message));
  });
  $$('[data-act="openreport"]').forEach((b) => b.onclick = async () => {
    try {
      const r = await api('/api/error-report/' + encodeURIComponent(b.dataset.report));
      const nt = reportNote(r);
      openInfo('错误报告 · ' + b.dataset.report, nt.note + `<pre class="raw">${esc(r.timeline)}</pre>`, nt.tip);
      state.lastCopy = r.timeline;
    } catch (e) { toast('读取报告失败：' + e.message); }
  });
}

async function renderCost(box) {
  const data = await api('/api/tasks?limit=500');
  const m = data.monthly;
  const days = Object.entries(m.byDay || {}).sort((a, b) => a[0].localeCompare(b[0]));

  box.innerHTML = `<h2 style="font-size:16px;margin:0 0 14px">成本月度汇总（${esc(m.month)}）</h2>
    <div class="kpis">
      <div class="kpi"><div class="k">本月合计</div><div class="v">¥${m.total.toFixed(2)}</div><div class="n">${m.tasks} 场直播</div></div>
      <div class="kpi"><div class="k">字幕识别（估算值）</div><div class="v">¥${m.asrEstimate.toFixed(2)}</div><div class="n">音频 ${m.asrAudioHours} 小时</div></div>
      <div class="kpi"><div class="k">内容分析（实际）</div><div class="v sm">¥${m.llmActual.toFixed(4)}</div><div class="n">${m.llmCalls} 次调用 · 按 API usage 计</div></div>
    </div>
    <div class="card"><h2>说明</h2><div class="summary"><p>${esc(m.disclaimer)}</p>
      <p>结论：<b>LLM 成本几乎可以忽略，真正值得优化的是 ASR</b>。要压成本请优先考虑本地 Whisper 方案或本地剪静音，而不是换更便宜的 LLM。</p></div></div>
    <div class="card"><h2>按日分布</h2>
      ${days.length ? `<table class="tbl"><thead><tr><th>日期</th><th>字幕识别</th><th>内容分析</th><th>合计</th><th style="width:40%">占比</th></tr></thead><tbody>
      ${days.map(([d, v]) => `<tr><td class="mono-sm">${esc(m.month)}-${esc(d)}</td><td class="num">¥${v.asr.toFixed(2)}</td>
        <td class="num">¥${v.llm.toFixed(4)}</td><td class="num">¥${(v.asr + v.llm).toFixed(2)}</td>
        <td><div style="background:#eceef0;border-radius:3px;height:6px"><i style="display:block;height:100%;border-radius:3px;background:var(--pink);width:${Math.round(((v.asr + v.llm) / max) * 100)}%"></i></div></td></tr>`).join('')}

        <button class="switch sm ${c.clip.burnSubtitles ? 'on' : ''}" id="c_burnSubtitles"></button>
        <span>${c.clip.burnSubtitles ? '开启（转写已经花过钱，不烧等于白花）' : '关闭（画面只有弹幕）'}</span></div>
        <div class="hintline">字幕位置比弹幕更高、字号更大，两者不会叠在一起。</div></div>
      <div class="field"><label>字幕字号（0 = 自动）</label><input class="inp num" id="c_subtitleFontSize" value="${c.clip.subtitle.fontSize}"></div>
      <div class="field"><label>每行最多几个字</label><input class="inp num" id="c_subtitleMaxChars" value="${c.clip.subtitle.maxCharsPerLine}"></div>
      <div class="field"><label>单条最短显示（秒）</label><input class="inp num" id="c_subtitleMinDur" value="${c.clip.subtitle.minDurationSec}"></div>
      <div class="field full"><label>主播 / 常驻嘉宾（一行一个）</label>
        <textarea class="inp" id="c_glossaryAnchors" rows="2" placeholder="甲主播">${esc(glossary.anchors.join('\n'))}</textarea></div>
      <div class="field full"><label>术语 / 梗 / 栏目名（一行一个）</label>
        <textarea class="inp" id="c_glossaryTerms" rows="4" placeholder="后半夜后悔时代&#10;闪身步">${esc(glossary.terms.join('\n'))}</textarea>
        <div class="hintline">会注入到「分块要点」和「选片起标题」的提示词里，让模型知道这些词的正确写法。</div></div>
      <div class="field full"><label>纠错规则（一行一条，写成 <span class="mono-sm">错→对</span>；正则加前缀 <span class="mono-sm">re:</span>）</label>
        <textarea class="inp" id="c_glossaryRepl" rows="4" placeholder="闪身部→闪身步&#10;re:\\d+次红包→很多次红包">${esc(glossary.replacements.map((r) => `${r.regex ? 're:' : ''}${r.from}→${r.to}`).join('\n'))}</textarea>
        <div class="hintline">转写完成后做确定性替换，按书写顺序生效（先写的先跑）。<b>改完保存即生效，不需要重新转写、不重复花钱。</b></div></div>
      <div class="field full"><label>热词表</label><div class="ctl">
        <button class="btn-sm" id="btnCopyHotWords">复制热词（一行一个）</button>
        <button class="btn-sm" id="btnCopyHotWords2">复制热词（逗号分隔）</button>
        <span class="hintline">本项目的 ASR 走 biliLive-tools，实测它的 <span class="mono-sm">/ai/subtitle</span> 只收
          file/modelId/startTime/endTime/offset/song 六个参数，<b>没有热词入参</b>。所以热词在这里只能作为可复制清单：
          换成本地 whisper（initial_prompt）或云厂商控制台的「定制热词」时可直接粘贴。</span></div>
        <div class="hintline">术语表文件：<span class="mono-sm">${esc(glossary.path)}</span>（也可以直接用记事本改，保存即生效）</div></div>
    </div></div>

  <div class="group"><h3>AI 配置</h3>
    <p class="gdesc">字幕识别复用 biliLive-tools 中已配置的模型与凭据，本服务不重复管理。内容分析（LLM）由本服务自研调用。</p>
    <div class="fields">
      <div class="field full"><label>字幕识别模型</label>
        <input class="inp" readonly value="在 biliLive-tools 设置 → AI 配置 中指定（必须勾选 ASR 标签）">
        <div class="hintline">转写用于内容分析、选片，以及烧成画面字幕（可在上方「字幕与术语表」里关闭）。未配置该模型时 /ai/subtitle 会直接抛错（陷阱 #5）。</div></div>
      <div class="field full"><label>服务预设</label>
        <select class="inp" id="c_llmPreset">
          ${Object.entries({ deepseek: 'DeepSeek（推荐：结构化抽取强，支持错峰半价与缓存折扣）', aliyun: '阿里云百炼 · 通义千问（与字幕识别同一个 Key）', zhipu: '智谱 GLM-Flash（有免费档，适合先跑通链路）', ollama: '本地 Ollama（完全离线，需自备显卡）', custom: '自定义' }).map(([k, v]) => `<option value="${k}" ${c.llm.preset === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}
        </select>
        <div class="hintline" id="presetNote"></div></div>
      <div class="field full"><label>LLM 接口地址</label><input class="inp" id="c_llmUrl" value="${esc(c.llm.summary.baseUrl)}"></div>
      <div class="field"><label>API Key</label><div class="ctl">
        <input class="inp" type="password" id="c_llmKey" value="${esc(c.llm.summary.apiKey)}">
        <button class="btn-sm" data-pwd="c_llmKey">显示</button></div></div>
      <div class="field"><label>模型名（分块与总结）</label><div class="ctl">
        <input class="inp" id="c_llmModel" value="${esc(c.llm.summary.model)}">
        <button class="btn-sm" data-test="llm">测试</button></div>
        <div class="testres" id="res-llm"></div></div>
      <div class="field full"><label>选片专用模型（留空则同上）</label>
        <input class="inp" id="c_llmSelectModel" value="${esc(c.llm.select.model)}" placeholder="建议填更强的型号，仅用于选片与起标题（每场 1–2 次）">
        <div class="hintline" id="escalationHint"></div></div>
      <div class="field"><label>分块时长（分钟）</label><input class="inp num" id="c_chunkMinutes" value="${c.llm.chunkMinutes}"></div>
      <div class="field"><label>分块并发</label><input class="inp num" id="c_chunkConcurrency" value="${c.llm.chunkConcurrency}"></div>
      <div class="field full"><label>转写引擎</label>
        <select class="inp" id="c_asrProvider">
          <option value="bililive-tools" ${c.asr.provider === 'bililive-tools' ? 'selected' : ''}>云端（biliLive-tools → 阿里云 DashScope）：按时长计费，最快</option>
          <option value="local-funasr" ${c.asr.provider === 'local-funasr' ? 'selected' : ''}>本地 Fun-ASR-Nano（阿里云开源）：免费，同素材实测字错率 8.8%，慢约 5 倍</option>
          <option value="whisper-cpp" ${c.asr.provider === 'whisper-cpp' ? 'selected' : ''}>本地 faster-whisper：免费，字错率约 17%（比 Fun-ASR 差一倍）</option>
        </select>
        <div class="hintline">本地引擎需要先建好环境：Fun-ASR 用 <span class="mono-sm">node tools/local-asr/setup-funasr.mjs</span>，whisper 用 <span class="mono-sm">.venv-asr</span>。本地跑不产生任何云端费用。</div></div>
      <div class="field"><label>Fun-ASR 设备</label>
        <select class="inp" id="c_funasrDevice">
          <option value="auto" ${c.asr.localFunasr.device === 'auto' ? 'selected' : ''}>auto（有 CUDA 就用）</option>
          <option value="cuda" ${c.asr.localFunasr.device === 'cuda' ? 'selected' : ''}>cuda</option>
          <option value="cpu" ${c.asr.localFunasr.device === 'cpu' ? 'selected' : ''}>cpu</option>
        </select></div>
      <div class="field"><label>Fun-ASR 推理引擎</label>
        <select class="inp" id="c_funasrEngine">
          <option value="auto" ${c.asr.localFunasr.engine === 'auto' ? 'selected' : ''}>auto（优先 vLLM，失败退 PyTorch）</option>
          <option value="pytorch" ${c.asr.localFunasr.engine === 'pytorch' ? 'selected' : ''}>pytorch（实测 4 小时素材约 43 分钟）</option>
          <option value="vllm" ${c.asr.localFunasr.engine === 'vllm' ? 'selected' : ''}>vllm（官方 bench 快 16 倍，需另装）</option>
        </select></div>
      <div class="field"><label>Fun-ASR 每句字数上限</label><input class="inp num" id="c_funasrMaxChars" value="${c.asr.localFunasr.maxCharsPerCue}">
        <div class="hintline">按标点切句时一条字幕最多几个字，与字幕排版保持一致</div></div>
      <div class="field"><label>Fun-ASR 模型路径（Python）</label><input class="inp" id="c_funasrPython" value="${esc(c.asr.localFunasr.pythonPath || '')}" placeholder="留空 = 项目内 .venv-funasr"></div>
      <div class="field full"><label>Fun-ASR 字级时间戳</label><div class="inline-switch">
        <button class="switch sm ${c.asr.localFunasr.timestamps !== false ? 'on' : ''}" id="c_funasrTimestamps"></button>
        <span>${c.asr.localFunasr.timestamps !== false ? '开启（时间戳偏差 ±0.2s，推荐）' : '关闭（退化成 VAD 段粒度，偏差 ±2s）'}</span></div>
        <div class="hintline">开启后每句的时间取该句首字与末字的真实时刻（CTC 强制对齐），而不是整段的起止。</div></div>
      <div class="field full"><label>ASR 分段时长（分钟）</label><input class="inp num" id="c_asrSegmentMinutes" value="${c.asr.segmentMinutes}">
        <div class="hintline">/ai/subtitle 是同步阻塞接口，4 小时全片一次调用会挂 20–40 分钟；必须分段且 startTime/endTime 成对（硬约束 #7）。本地 Fun-ASR 会自动忽略它（整文件一次调用，省掉重复加载模型）。</div></div>
      <div class="field"><label>ASR 单价（元/小时，用于估算）</label><input class="inp num" id="c_asrPrice" value="${c.asr.unitPricePerHour}"></div>
      <div class="field"><label>转写输入源</label>
        <select class="inp" id="c_asrInputSource">
          <option value="raw" ${c.asr.inputSource === 'raw' ? 'selected' : ''}>录制原始文件（可与压制并行，推荐）</option>
          <option value="full" ${c.asr.inputSource === 'full' ? 'selected' : ''}>压制产物 mp4</option>
        </select></div>
    </div></div>

  <div class="group"><h3>发布策略</h3>
    <p class="gdesc">切片按设定间隔错峰发布，避免集中投稿。</p>
    <div class="fields">
      <div class="field full"><label>首片发布时间（留空 = 按公式自动排期）</label>
        <div class="ctl">
          <input class="inp" type="datetime-local" id="c_firstPublishAt" value="${esc(c.publish.firstPublishAt || '')}" style="width:auto">
          <button class="btn-sm" id="btnClearFirstAt">自动排期</button>
          <button class="btn-sm" data-quick="+3h">3 小时后</button>
          <button class="btn-sm" data-quick="tomorrow8">明早 8 点</button>
          <button class="btn-sm" data-quick="tomorrow20">明晚 8 点</button>
        </div>
        <div class="hintline" id="hintPlan"></div>
      </div>
      <div class="field"><label>首片提交余量（秒，必须 &gt;7200）</label><input class="inp num" id="c_submitGapSec" value="${c.publish.submitGapSec}">
        <div class="hintline ok" id="hintGap">公式：dtime = 提交时刻 + ${c.publish.submitGapSec} + (N-1)×${c.publish.clipGapSec} + random(0,${c.publish.jitterSec})</div>
        <div class="hintline">指定了「首片发布时间」后，这一项只作为**兜底下限**（指定时间更早时会被推迟到它）</div></div>
      <div class="field"><label>相邻切片间隔（秒）</label><input class="inp num" id="c_clipGapSec" value="${c.publish.clipGapSec}">
        <div class="hintline">B站硬限制是「相对**各稿件自身提交时刻** &gt;7200 秒」，相邻间隔不受额外限制；7500 仅为保守余量</div></div>
      <div class="field"><label>随机抖动上限（秒）</label><input class="inp num" id="c_jitterSec" value="${c.publish.jitterSec}"></div>
      <div class="field"><label>每日投稿上限</label><input class="inp num" id="c_dailyLimit" value="${c.publish.dailyLimit}"></div>
      <div class="field"><label>仅自己可见（试跑期建议开启）</label><div class="inline-switch">
        <button class="switch sm ${c.publish.isOnlySelf === 1 ? 'on' : ''}" id="c_isOnlySelf"></button>
        <span>${c.publish.isOnlySelf === 1 ? '开启' : '关闭（公开可见）'}</span></div></div>
      <div class="field"><label>全自动发布</label><div class="inline-switch">
        <button class="switch sm ${c.publish.autoPublish ? 'on' : ''}" id="c_autoPublish"></button>
        <span>${c.publish.autoPublish ? '全自动（分析完直接排期发布）' : '半自动（需确认后发布）'}</span></div>
        <div class="hintline">首次部署必须用半自动，确认选片质量稳定后再改全自动</div></div>
      <div class="field"><label>立即发布（不传 dtime）</label><div class="inline-switch">
        <button class="switch sm ${c.publish.immediatePublish ? 'on' : ''}" id="c_immediatePublish"></button>
        <span>${c.publish.immediatePublish ? '开启 —— 稿件过审后直接公开' : '关闭 —— 按公式定时发布'}</span></div>
        <div class="hintline" id="hintImmediate"></div></div>
      <div class="field"><label>多分P投稿（完整版+纯享版+切片合成一个稿件）</label><div class="inline-switch">
        <button class="switch sm ${c.publish.multiPart ? 'on' : ''}" id="c_multiPart"></button>
        <span>${c.publish.multiPart ? '开启 —— 省额度，但各分P同一时刻发布' : '关闭 —— 每片一稿，可错峰但费额度'}</span></div>
        <div class="hintline" id="hintMultiPart"></div></div>
      <div class="field"><label>完整版（弹幕版 + 纯享版）由谁投稿</label>
        <select class="inp" id="c_fullVideoBy">
          <option value="bililive-tools" ${c.publish.fullVideoBy !== 'assistant' ? 'selected' : ''}>biliLive-tools 投（默认）—— 它压制并投出完整版，本服务只把切片追加进同一个稿件</select>
          <option value="assistant" ${c.publish.fullVideoBy === 'assistant' ? 'selected' : ''}>切片助手投（例外）—— 本服务自己烧弹幕版 + remux 纯享版，新建 2+N 稿件</option>
        </select>
        <div class="hintline">规则：<b>除非你明确在这里（或该任务的 overrides.fullVideoBy）说明由切片助手投，否则完整版一律由 biliLive-tools 投</b>。
          默认路径下，如果它还没投出来，本场会停在「已切片」<b>等待</b>（最多 ${c.publish.resumeWaitMin} 分钟，可在 config.json 调 publish.resumeWaitMin），
          不会自己投完整版、也不会把切片投成独立稿件。</div></div>
      <div class="field"><label>等待完整版稿件的上限（分钟）</label><input class="inp" id="c_resumeWaitMin" type="number" min="1" max="1440" value="${c.publish.resumeWaitMin}">
        <div class="hintline">biliLive-tools 的压制 + 上传是异步的（实测录制结束后 13–15 分钟才出弹幕版）。超时后本场仍停在「已切片」并告警，交人工确认。</div></div>
      <div class="field"><label>合集 ID（seasonId，留空则无法归入合集）</label><input class="inp" id="c_seasonId" value="${c.publish.seasonId || ''}" placeholder="需在 B站创作中心手动创建后填写">
        <div class="hintline">⚠️ 没有任何接口能创建合集；留空时切片照常投稿但**不会归入同一合集**</div></div>
      <div class="field"><label>分区（默认）</label>
        <select class="inp" id="c_defaultCategory">${tags.map((t) => `<option ${c.publish.defaultCategory === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
      <div class="field full"><label>默认标签（逗号分隔）</label><input class="inp" id="c_defaultTags" value="${esc(c.publish.defaultTags.join(', '))}">
        <div class="hintline" id="hintTags"></div></div>
      <div class="field full"><label>简介模板</label><textarea class="inp" id="c_descTemplate">${esc(c.publish.descTemplate)}</textarea>
        <div class="hintline">可用变量：{{date}} {{liveTitle}} {{roomUrl}} {{startText}} {{endText}} {{desc}}（上限 250 字符，超出自动截断）</div></div>
      <div class="field full"><label>简介末尾的 AI 声明</label><textarea class="inp" id="c_aiNotice" rows="2" placeholder="留空 = 不写声明">${esc(c.publish.aiNotice || '')}</textarea>
        <div class="hintline">切片是 LLM 选段 + AI 生成标题/字幕后自动投稿的，观众与平台都该看得见。
          <b>声明最后拼、不参与 250 字符截断</b>，所以正文再长也不会把它挤掉；单切片、多分P 稿件、我们上传的完整版都会带上。
          可以多行（例如声明 + 一句求赞）。</div></div>
      <div class="field"><label>封面来源优先级</label>
        <select class="inp" id="c_coverSource">
          <option value="preset" ${c.publish.coverSource === 'preset' ? 'selected' : ''}>biliLive-tools 投稿预设（默认）</option>
          <option value="default" ${c.publish.coverSource === 'default' ? 'selected' : ''}>配置的默认封面图</option>
          <option value="fullVideo" ${c.publish.coverSource === 'fullVideo' ? 'selected' : ''}>复用完整版封面</option>
        </select></div>
      <div class="field"><label>默认封面绝对路径（可留空）</label><input class="inp" id="c_defaultCover" value="${esc(c.publish.defaultCover)}"></div>
      <div class="field"><label>创作声明</label>
        <select class="inp" id="c_creationStatement">
          ${[[-1, '不声明'], [1, '含 AI 生成内容'], [2, '含虚构演绎内容'], [3, '内容为转载'], [4, '含个人观点']].map(([v, t]) => `<option value="${v}" ${c.publish.creationStatement === v ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
        <div class="hintline">封面/文案由 AI 生成时按平台要求标注</div></div>
      <div class="field"><label>版权</label>
        <select class="inp" id="c_copyright">${[[1, '自制'], [2, '转载'], [3, '其他']].map(([v, t]) => `<option value="${v}" ${c.publish.copyright === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    </div></div>

  <div class="group"><h3>素材与清理</h3>
    <p class="gdesc">切片流程需要反复读取源视频，因此素材清理由本服务统一管理。</p>
    <div class="fields">
      <div class="field"><label>源视频保留天数（切片全部发布后起算）</label><input class="inp num" id="c_retentionDays" value="${c.cleanup.retentionDays}"></div>
      <div class="field"><label>磁盘剩余阈值（GB）</label><input class="inp num" id="c_diskFloorGB" value="${c.cleanup.diskFloorGB}"></div>
      <div class="field"><label>转写完成后删除原始分段</label><div class="inline-switch">
        <button class="switch sm ${c.cleanup.deleteRawAfterTranscribe ? 'on' : ''}" id="c_deleteRaw"></button>
        <span>${c.cleanup.deleteRawAfterTranscribe ? '开启（省空间，原始分段是最占地方的中间产物）' : '关闭'}</span></div></div>
      <div class="field"><label>失败时保留素材</label><div class="inline-switch">
        <button class="switch sm ${c.cleanup.keepFullVideoOnFailure ? 'on' : ''}" id="c_keepOnFail"></button>
        <span>${c.cleanup.keepFullVideoOnFailure ? '开启（便于重跑）' : '关闭'}</span></div></div>
      <div class="field full"><input class="inp" readonly value="biliLive-tools 的「上传后删除素材」必须关闭（afterUploadDeletAction = none）">
        <div class="hintline warn">⚠️ 若开启，稿件过审后源视频会被删除，导致转写与切片读到不存在的文件 —— 故障表现分散，很难定位（硬约束 #11）</div></div>
    </div></div>

  <div class="group"><h3>通知与告警</h3>
    <p class="gdesc">事件推送到手机，方便随时确认选片结果。告警会去重，恢复时发送恢复通知。</p>
    <div class="fields">
      <div class="field full"><label>通知渠道</label><div class="chips" id="c_channels">
        ${['serverchan', 'dingtalk', 'telegram', 'webhook'].map((ch) => `<button class="chip ${c.alert.channels.includes(ch) ? 'on' : ''}" data-ch="${ch}">${{ serverchan: 'Server酱', dingtalk: '钉钉机器人', telegram: 'Telegram', webhook: '自定义 Webhook' }[ch]}</button>`).join('')}
      </div></div>
      <div class="field"><label>Server酱 SendKey</label><div class="ctl">
        <input class="inp" type="password" id="c_scKey" value="${esc(c.alert.serverchan.sendKey)}">
        <button class="btn-sm" data-pwd="c_scKey">显示</button>
        <button class="btn-sm" data-test="alert" data-ch="serverchan">测试</button></div>
        <div class="testres" id="res-alert"></div></div>
      <div class="field"><label>钉钉 Webhook</label><input class="inp" id="c_dtWebhook" value="${esc(c.alert.dingtalk.webhook)}"></div>

/**
 * 排期预览：把「首片/末片什么时候发、我指定的时间是否被推迟」直接显示出来。
 * 这些没有理由让用户自己按公式算。
 */
function renderDtimePlanPreview() {
  const el = $('#hintPlan');
  if (!el) return;
  const v = ($('#c_firstPublishAt') || {}).value || '';
  const b = state.bootstrap || {};
  const plan = b.dtimePlan || {};
  if (!v) {
    el.className = 'hintline';
    el.textContent = `自动排期：首片约 ${plan.firstText || '—'}，末片约 ${plan.lastText || '—'}（间隔 ${fmtSpan((b.config && b.config.publish.clipGapSec) || 7500)}）`;
    return;
  }
  const ms = Date.parse(v.replace(' ', 'T'));
  if (!Number.isFinite(ms)) { el.className = 'hintline warn'; el.textContent = '无法解析这个时间'; return; }
  const earliestMs = (plan.earliestAllowed || 0) * 1000;
  if (ms / 1000 < Math.floor(Date.now() / 1000) + 7200) {
    el.className = 'hintline warn';
    el.textContent = `⚠ 这个时间距现在不足 7200 秒（B站要求 dtime 晚于提交时刻 7200 秒）—— 实际会推迟到 ${plan.earliestAllowedText || '最早合法时间'} 发布`;
  } else {
    el.className = 'hintline ok';
    el.textContent = `✓ 首片 ${fmtTime(ms)} 发布，其余按间隔顺延`;
  }
}

function updateEscalationHint() {
  const sum = $('#c_llmModel').value.trim();
  const sel = $('#c_llmSelectModel').value.trim();
  const el = $('#escalationHint');
  if (!el) return;
  if (sel && sel === sum) {
    el.className = 'hintline warn';
    el.textContent = '⚠️ 与总结档配置为同一模型：「契约校验失败升级重跑」会退化为同模型重试一次，仍失败即直接降级。建议配一个更强的模型。';
  } else {
    el.className = 'hintline';
    el.textContent = '契约校验失败时会升级到该模型重跑，而不是在便宜模型上原地重试。';
  }
}
function updateTagHint() {
  const el = $('#hintTags');
  if (!el) return;
  const n = $('#c_defaultTags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean).length;
  el.className = n > 10 ? 'hintline warn' : 'hintline';
  el.textContent = n > 10 ? `已填 ${n} 个，超出 B站上限 10 个` : `已填 ${n} 个（上限 10 个，与 LLM 生成的标签合并后仍会去重与截断）`;
}

function bindCfg() {

  const toLocalInput = (ms) => {
    const d = new Date(ms);

    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  $$('#cfgBody [data-quick]').forEach((b) => (b.onclick = () => {

    } else {

      d.setDate(d.getDate() + 1);
      d.setHours(kind === 'tomorrow8' ? 8 : 20, 0, 0, 0);

    }
    // 不能早于 B站下限（提交后 7200 秒）；更早的话实际也会被推迟，这里直接给合法值更省事

/**
 * 把术语表两个输入框的内容整理成数组。
 * 一行一个，忽略空行与以 # 开头的注释行。
 */
function linesOf(id) {
  const el = document.getElementById(id);
  if (!el) return [];
  return String(el.value || '')
    .split('\n')
    .map((s) => s.trim())
    .filter((s) => s && !s.startsWith('#'));
}

/**
 * 解析纠错规则输入框：每行 `错→对`，正则加 `re:` 前缀。
 *
 * 分隔符接受 `→`、`->`、`=>`（用户从别处粘贴时三种都可能出现）。
 * 认不出来的行会被收集起来提示，而不是静默丢弃 —— 静默丢弃会让人以为规则生效了。
 */
function parseReplacementLines(text) {
  const out = [];
  const bad = [];
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    const m = /^(re:)?([\s\S]*?)\s*(?:→|->|=>)\s*([\s\S]*)$/.exec(line);
    if (!m) { bad.push(line); continue; }
    const from = m[2].trim();
    const to = m[3].trim();
    if (!from) { bad.push(line); continue; }
    out.push({ from, to, ...(m[1] ? { regex: true } : {}) });
  }
  return { out, bad };
}

/** 当前表单里的热词（术语 + 主播名），用于「复制热词」 */
function hotWordsFromForm() {
  const all = [...linesOf('c_glossaryAnchors'), ...linesOf('c_glossaryTerms')];
  return { perLine: all.join('\n'), commaSeparated: all.join('，') };
}

/**
 * 分P 标题模板的前端渲染（与服务端 `renderPartTitle` 同一套规则）。
 *
 * 为什么在前端也实现一份：模板是用户在输入框里现敲的，必须**边敲边看**。
 * 为了不让两份实现漂移，这里只支持同样的 6 个变量，未知变量原样保留并给出警告
 * （服务端行为一致：未知变量不替换）。
 */
function renderPartTitleClient(template, vars) {
  const map = { n: vars.n, title: vars.title, anchor: vars.anchor, date: vars.date, mainTitle: vars.mainTitle, kind: vars.kind };
  return String(template || 'P{n} {title}')
    .replace(/\{(n|title|anchor|date|mainTitle|kind)\}/g, (_, k) => String(map[k] ?? ''))
    .replace(/\s{2,}/g, ' ')
    .trim();
}

/* 「报告文件已不存在」的提示条。

 * 为什么要有它：`data/error-report/*.json` 会被清理，也可能当初就没写成功（磁盘满/被 kill），
 * 而 `errors.jsonl` 的事件行（同步追加）还在。服务端现在会**用事件行合成**一份最小报告
 * （`reportFileMissing: true`）。合成件缺的是请求上下文 / biliLive-tools 日志 / 堆栈 ——
 * 必须在弹窗里如实说明，否则用户会把"细节没了"当成"这个错本来就这么点信息"。
 * 三个页签（任务详情 / 健康 / 实时监控）共用这一份，避免以后改一处漏两处。 */
function reportNote(r) {
  const missing = !!(r && r.reportFileMissing);
  return {
    note: missing
      ? `<div class="warnbox">⚠ 原始报告文件已不存在（可能已被清理，或当初写盘失败）。以下内容由
         <code>errors.jsonl</code> 的事件行合成：时间、阶段、类型、消息、重试次数是真的，
         请求上下文 / biliLive-tools 侧日志 / 堆栈已不可得。</div>`
      : '',
    tip: missing ? '降级内容（仅事件记录）—— 已脱敏，可一键复制' : '报告已脱敏，可直接复制给开发者',
  };
}

    </div>
    <div id="impPreview"></div>
    <p class="hintline">用途：补跑漏掉的场次、测试新 prompt、处理其他渠道获得的录播。会跑完整链路（受当前 dry-run / 付费开关约束）。</p>
    <div style="margin-top:12px"><button class="primary" style="margin-left:0" id="impGo">创建任务并开始处理</button></div>`);

  /**
   * 渲染扫描范围：哪些目录是自动来的（biliLive-tools 的保存目录）、
   * 哪些是用户手动加的（可移除），以及这次实际扫了哪些、历史查了哪些房间。
   *
   * 为什么要显示这些：用户反馈过「路径太绝对，我还有别的主播的录播没显示」——
   * 只有把「扫了哪里」摊开，用户才知道该往哪里加目录。
   */
  const renderDirs = (info) => {
    const box = $('#impDirs');
    if (!box) return;
    const rows = [];
    for (const d of info.detectedDirs || []) {
      rows.push(`<div class="row"><span class="t" style="color:var(--text-3)">自动</span><span class="s">
        <span class="mono-sm" style="word-break:break-all">${esc(d)}</span>
        <br><span style="color:var(--text-3);font-size:11.5px">来自 biliLive-tools 的保存目录</span></span></div>`);
    }
    for (const d of info.configuredDirs || []) {
      rows.push(`<div class="row"><span class="t" style="color:var(--text-3)">手动</span><span class="s">
        <span class="mono-sm" style="word-break:break-all">${esc(d)}</span>
        <button class="btn-sm" data-rmdir="${esc(d)}" style="margin-left:8px">移除</button></span></div>`);
    }
    if (!rows.length) rows.push('<div class="row"><span class="s" style="color:var(--text-3)">（还没有额外目录）</span></div>');
    const scanned = (info.scanRoots || []).length
      ? `<p class="hintline">本次实际扫描：${(info.scanRoots || []).map((r) => `<span class="mono-sm">${esc(r)}</span>`).join('　')}</p>`
      : '';
    const hist = info.historyTotal
      ? `<p class="hintline">录制历史：查了 ${info.roomIds.length} 个房间（${(info.roomIds || []).join('、')}）共 ${info.historyTotal} 条${info.historyMissing ? `，其中 <span style="color:#c8811a">${info.historyMissing} 条的文件已不在磁盘</span>` : ''}</p>`
      : '';
    box.innerHTML = `<div class="timeline">${rows.join('')}</div>${scanned}${hist}`;
    $$('#impDirs [data-rmdir]').forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      try {
        await api('/api/recordings/dirs', { method: 'POST', body: { remove: b.dataset.rmdir } });
        toast('已移除扫描目录：' + b.dataset.rmdir);
        loadList(true);
      } catch (e) { toast('移除失败：' + e.message, 5000); b.disabled = false; }
    }));
  };

  /** 载入清单；refresh=1 时绕过服务端 20 秒缓存 */
  const loadList = async (refresh) => {
    const box = $('#impList');
    box.innerHTML = '<div class="row"><span class="s" style="color:var(--text-3)">正在扫描录播目录…</span></div>';
    try {
      const r = await api('/api/recordings' + (refresh ? '?refresh=1' : ''));
      renderDirs(r);
      $('#impScanInfo').textContent = `共 ${r.count} 场${r.cached ? '（缓存）' : ''}`;
      if (!r.candidates.length) {
        box.innerHTML = '<div class="row"><span class="s" style="color:var(--text-3)">没有找到可导入的录播。可在「设置」里加扫描目录，或直接在下面粘贴绝对路径。</span></div>';
        return;
      }
      box.innerHTML = r.candidates.map((c, i) => {
        const flags = [];
        /* 在「自动导入目录」里的文件要标出来：两条路（轮询自动捡 / 你手动点）会分别记成
           「自动导入」和「手动导入」，用户需要事先知道这件事，而不是事后奇怪为什么标手动 */
        const w = state.watch;
        if (w && w.enabled && (w.dirs || []).some((d) => c.videoPath.toLowerCase().startsWith(String(d).toLowerCase()))) {
          flags.push('<span style="color:var(--blue,#00aeec)">在自动导入目录</span>');
        }
        if (c.possiblyRecording) flags.push('<span style="color:#c8811a">可能仍在录制</span>');
        if (c.importedBy) flags.push('<span style="color:#c8811a">已导入</span>');
        if (c.hasDanmakuInPicture) flags.push('<span style="color:#c8811a">画面已烧弹幕</span>');
        if (!c.usable) flags.push('<span style="color:#c33">文件不可用</span>');
        if (c.asr && c.asr.cacheHits >= c.asr.windows && c.asr.windows > 0) flags.push('<span style="color:var(--green)">ASR 已缓存</span>');
        return `<div class="row" data-imp="${i}" style="cursor:pointer">
          <span class="t">${esc(c.group)}</span>
          <span class="s"><b>${esc(c.title)}</b> ${flags.join(' ')}<br>
            <span style="color:var(--text-3)">${esc(c.summary)}${c.asr ? ` · 预估 ASR ¥${c.asr.estCost.toFixed(2)}（${c.asr.cacheHits}/${c.asr.windows} 段已缓存）` : ''}</span><br>
            <span class="mono-sm" style="color:var(--text-3);word-break:break-all">${esc(c.videoPath)}</span></span>
        </div>`;
      }).join('');
      // 点一行 → 填进表单并预览
      $$('#impList .row[data-imp]').forEach((el) => (el.onclick = () => {
        const c = r.candidates[Number(el.dataset.imp)];
        if (!c) return;
        $$('#impList .row[data-imp]').forEach((x) => (x.style.background = ''));
        el.style.background = 'var(--bg-2,#f5f7fa)';
        $('#impVideo').value = c.videoPath;
        $('#impDanma').value = c.danmaPath || '';
        $('#impTitle').value = c.title || '';
        showPreview(c.videoPath);
      }));
    } catch (e) {
      box.innerHTML = `<div class="row bad"><span class="s">扫描失败：${esc(e.message)}</span></div>`;
    }
  };

  /** 选中后做一次完整预览：配对弹幕、时长、费用、已导入、是否仍在录制 */
  const showPreview = async (videoPath) => {
    const box = $('#impPreview');
    box.innerHTML = '<p class="hintline">正在检查这个文件…</p>';
    try {
      const p = await api('/api/import/preview', { method: 'POST', body: { videoPath } });
      // 预览里更权威的弹幕对应关系（biliLive-tools 自己的映射）覆盖掉清单里的猜测
      if (p.danmaPath && !$('#impDanma').value.trim()) $('#impDanma').value = p.danmaPath;
      const rows = [
        ['时长', p.durationSec > 0 ? toTime(p.durationSec) : '未知'],
        ['大小', p.sizeMB + ' MB'],
        ['分辨率', p.resolution || '-'],
        ['分段', p.segmentCount > 1 ? `${p.segmentCount} 个（将合并为一场）` : '1 个'],
        ['弹幕', p.danmaPath ? `${p.danmaPath.split(/[\\/]/).pop()}（来源：${{ 'bililive-tools': 'biliLive-tools 对应关系', sibling: '同名文件', none: '未找到' }[p.danmaSource]}）` : '未找到'],
        ['画面弹幕', p.hasDanmakuInPicture ? '已烧进画面（切片时不再叠 ASS）' : '未烧，切片时烧入'],
        ['ASR', p.asr ? `${p.asr.windows} 段，缓存命中 ${p.asr.cacheHits}，预估 ¥${p.asr.estCost.toFixed(2)}` : '-'],
      ];
      box.innerHTML = `<div class="kv">${rows.map(([k, v]) => `<div class="k">${k}</div><div>${esc(String(v))}</div>`).join('')}</div>` +
        (p.variants.length > 1
          ? `<div style="margin-top:10px"><div class="k" style="font-size:11.5px;color:var(--text-3);margin-bottom:6px">这一场的其它版本（点一下换用它）</div>
             <div class="filelist">${p.variants.map((v, i) => `<button data-variant="${i}" ${v.videoPath === p.videoPath ? 'style="border-color:var(--blue,#00aeec)"' : ''}>${esc(v.fileName)}（${v.sizeMB} MB${v.hasDanmakuInPicture ? ' · 已烧弹幕' : ''}）</button>`).join('')}</div></div>`
          : '') +
        (p.importedBy ? `<div class="barstrip warn">这个文件已属于任务 <span class="mono-sm">${esc(p.importedBy.taskId)}</span>（${esc(p.importedBy.status)}）—— 再次导入会新建一场并重新花 ASR 费用</div>` : '') +
        (() => {
          const w = state.watch;
          const inWatch = !!w && w.enabled && (w.dirs || []).some((d) => String(p.videoPath).toLowerCase().startsWith(String(d).toLowerCase()));
          return inWatch
            ? `<div class="barstrip">这个文件在**自动导入目录**里：不点导入的话，轮询也会处理它，但要先等它写完（体积连续两轮不变且稳定 ${w.stableSec} 秒，通常 1–2 分钟）。` +
              `两条路的记账不同 —— 你点的是<b>手动导入</b>，轮询捡起来的记<b>自动导入</b>。</div>`
            : '';
        })() +
        (p.warnings.length ? `<div class="timeline">${p.warnings.slice(0, 5).map((w) => `<div class="row"><span class="t">注意</span><span class="s">${esc(w)}</span></div>`).join('')}</div>` : '');
      // 换用同一场的另一个版本（原始 flv ↔ 已烧弹幕的压制产物）
      $$('#impPreview [data-variant]').forEach((btn) => (btn.onclick = () => {
        const v = p.variants[Number(btn.dataset.variant)];
        if (!v) return;
        $('#impVideo').value = v.videoPath;
        showPreview(v.videoPath);
      }));
    } catch (e) {
      box.innerHTML = `<div class="row bad"><span class="s">预览失败：${esc(e.message)}</span></div>`;
    }
  };

  $('#impRefresh').onclick = () => loadList(true);
  // 添加扫描目录（这是「别的主播的录播没显示」的直接解法）
  { const ab = $('#impDirAddBtn'); if (ab) ab.onclick = async () => {
    const d = $('#impDirAdd').value.trim();
    if (!d) { toast('请填写目录路径'); return; }
    ab.disabled = true;
    try {
      const r = await api('/api/recordings/dirs', { method: 'POST', body: { add: d } });
      $('#impDirAdd').value = '';
      toast(r.note || '已添加');
      loadList(true);
    } catch (e) { toast('添加失败：' + e.message, 6000); }
    ab.disabled = false;
  }; }
  { const inp = $('#impDirAdd'); if (inp) inp.onkeydown = (ev) => { if (ev.key === 'Enter') $('#impDirAddBtn').click(); }; }
  $('#impVideo').onchange = () => { const v = $('#impVideo').value.trim(); if (v) showPreview(v); };
  loadList(false);

  $('#impGo').onclick = async () => {
    const videoPath = $('#impVideo').value.trim();
    if (!videoPath) { toast('请从上面的清单点选一个录播，或粘贴视频文件路径'); return; }
    $('#impGo').disabled = true; $('#impGo').textContent = '创建中…';
    try {
      const r = await api('/api/import', { method: 'POST', body: {
        videoPath,
        danmaPath: $('#impDanma').value.trim() || undefined,
        title: $('#impTitle').value.trim() || undefined,
        roomId: $('#impRoom').value.trim() || undefined,
        // 文件名带「-弹幕版」→ 源文件画面里已有弹幕，切片时不能再叠一层（陷阱 #8）
        hasDanmakuInPicture: /-弹幕版|-danmaku|（弹幕版）/.test(videoPath.replace(/\.[^.]+$/, '')),
      } });
      closeInfo();
      /* 手动导入的文件如果就躺在「自动导入目录」里，用户会以为"它应该自己跑" ——
         实测就为此困惑过（看到任务卡标着「手动导入」以为标错了）。
         这里把两条路的区别一次说清：谁点的就记谁，轮询那条路要等文件写完。 */
      const w = state.watch;
      const inWatch = !!w && w.enabled && (w.dirs || []).some((d) => videoPath.toLowerCase().startsWith(String(d).toLowerCase()));
      toast(
        `已创建任务 ${r.taskId}，处理已开始` +
          (inWatch ? '（这个文件在自动导入目录里，轮询也会捡它 —— 本次按你手动导入记账，所以标「手动导入」）' : ''),
        inWatch ? 8000 : 4000,
      );
      state.activeId = r.taskId;
      setTimeout(() => refreshAll(true), 1200);
    } catch (e) { toast('导入失败：' + e.message, 5000); $('#impGo').disabled = false; $('#impGo').textContent = '创建任务并开始处理'; }
  };
};
$('#modeSwitch').onclick = async () => {
  const on = !$('#modeSwitch').classList.contains('on');
  if (on && !confirm('切换到全自动后，分析完成会直接按评分阈值选片、切片并排期发布，全程无人工。确定开启？')) return;
  try {
    await api('/api/config', { method: 'POST', body: { patch: { publish: { autoPublish: on } } } });
    $('#modeSwitch').classList.toggle('on', on);
    $('#modeText').textContent = on ? '全自动 · 免确认发布' : '半自动 · 需确认后发布';
    toast(on ? '已切换为全自动：分析完成后直接排期发布' : '已切换为半自动：需你确认后才发布');
    await loadBootstrap();
  } catch (e) { toast('切换失败：' + e.message); }
};
$('#infoCopy').onclick = async () => {
  const text = state.lastCopy || $('#infoBody').innerText;
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制到剪贴板');
  } catch {
    // 剪贴板 API 在非安全上下文不可用时的兜底
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch { toast('复制失败，请手动选择文本'); }
    ta.remove();
  }
};
/* 包装一层：直接把 saveCfg 挂到 onclick 会把**事件对象**当 force 传进去，
   于是「强制覆盖」会在毫不知情的情况下生效，乐观锁等于白做。 */
$('#btnSaveCfg').onclick = () => saveCfg();
$$('#tabs .tab').forEach((t) => t.onclick = () => switchView(t.dataset.view));
let searchTimer;
$('#searchInput').oninput = (e) => {
  state.q = e.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadTasks().catch(() => {}), 300);
};
$$('#statusFilters button').forEach((b) => b.onclick = () => {
  $$('#statusFilters button').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  state.status = b.dataset.status;
  loadTasks().catch((e) => toast(e.message));
});
$('#cfgMask').onclick = (e) => { if (e.target.id === 'cfgMask') closeCfg(); };
$('#infoMask').onclick = (e) => { if (e.target.id === 'infoMask') closeInfo(); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeCfg(); closeInfo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && $('#cfgMask').classList.contains('show')) { e.preventDefault(); saveCfg(); }
});
window.addEventListener('beforeunload', (e) => {
  if (state.dirty.size) { e.preventDefault(); e.returnValue = ''; }
});

/* ============================================================================
 * 启动
 * ========================================================================== */
(async function init() {
  // 自检：把关键元素的存在性打出来，便于排查「点了没反应」
  console.info('%c[live_auto] UI 构建 ' + UI_BUILD, 'color:#00aeec;font-weight:bold');
  const probe = ['#taskList', '#btnRepairStuck', '#btnSetting', '#btnImport', '#tabs'];
  console.info('[live_auto] 关键元素:', probe.map((x) => x + '=' + (document.querySelector(x) ? 'OK' : 'MISSING')).join(' '));

  try {
    await loadBootstrap();
    await refreshAll();
  } catch (e) {
    $('#detail').innerHTML = `<div class="errbar"><div class="ico">!</div><div class="txt"><b>初始化失败</b><br>${esc(e.message)}<br>
      <span style="color:var(--text-3)">请确认服务已启动，并且你是通过 http://127.0.0.1:${state.bootstrap ? '' : ''}${location.port} 访问（不是通过其它主机名）。</span></div></div>`;
  }
  // 自动刷新：有任务在处理时 4 秒，否则 20 秒
  setInterval(async () => {
    if (document.hidden) return;
    const active = state.tasks.some((t) => ['TRANSCRIBING', 'ANALYZING', 'CLIPPING', 'PUBLISHING', 'TRANSCRIBED', 'PENDING', 'RECORDED'].includes(t.status));
    if (state.view !== 'tasks') return;
    if (state.dirty.size) return;
    await refreshAll(true).catch(() => {});
  }, 8000);
})();
</script>
</body>
</html>
