<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直播切片助手</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --border:#e6e8eb; --border-2:#f0f1f3;
    --text:#18191c; --text-2:#61666d; --text-3:#9499a0;
    --pink:#fb7299; --pink-soft:#fff1f5; --blue:#00aeec; --green:#2bb673;
    --amber:#f5a623; --red:#d94a4a; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer} input,select,textarea{font:inherit}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}

  .topbar{height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:26px;height:26px;border-radius:7px;background:var(--pink);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
  .brand h1{margin:0;font-size:15px;font-weight:600;white-space:nowrap}
  .brand .sub{color:var(--text-3);font-size:12px;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 3px rgba(43,182,115,.15);display:inline-block;margin-right:6px}
  .live-dot.bad{background:var(--red);box-shadow:0 0 0 3px rgba(217,74,74,.15)}
  .mode{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--border);
    border-radius:999px;font-size:12.5px;color:var(--text-2);background:#fafbfc;white-space:nowrap}
  .switch{position:relative;width:36px;height:20px;border-radius:999px;background:#d6d9dd;
    border:none;padding:0;transition:background .18s;flex:0 0 auto}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on{background:var(--pink)}
  .switch.on::after{transform:translateX(16px)}
  .switch.sm{width:32px;height:18px}
  .switch.sm::after{width:14px;height:14px}
  .switch.sm.on::after{transform:translateX(14px)}
  .ghost{border:1px solid var(--border);background:#fff;color:var(--text-2);
    padding:6px 12px;border-radius:8px;font-size:13px;white-space:nowrap}
  .ghost:hover{border-color:#cfd3d8;color:var(--text)}
  .ghost.on{background:var(--pink-soft);border-color:var(--pink);color:#d94d7a}

  .tabs{display:flex;gap:4px;padding:8px 18px 0;background:var(--card);border-bottom:1px solid var(--border);
    position:sticky;top:56px;z-index:19}
  .tab{padding:7px 14px;font-size:13px;color:var(--text-2);border:none;background:none;
    border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
  .tab:hover{background:#fafbfc}
  .tab.on{color:var(--pink);border-bottom-color:var(--pink);font-weight:600}

  .app{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;height:calc(100vh - 56px - 41px)}
  .col{overflow-y:auto;height:100%}
  .col-left{border-right:1px solid var(--border);background:var(--card)}
  .col-mid{padding:18px 22px 60px}
  .col-right{border-left:1px solid var(--border);background:var(--card);padding:16px 14px}
  .col::-webkit-scrollbar{width:8px}
  .col::-webkit-scrollbar-thumb{background:#dcdfe3;border-radius:4px}
  .col-label{font-size:11.5px;letter-spacing:.06em;color:var(--text-3);
    padding:14px 16px 8px;text-transform:uppercase}
  .fullpage{height:calc(100vh - 56px - 41px);overflow-y:auto;padding:18px 22px 60px}

  .searchbar{padding:10px 12px 6px;display:flex;flex-direction:column;gap:8px}
  .searchbar input{width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px}
  .searchbar input:focus{outline:none;border-color:#cfe6f7;box-shadow:0 0 0 3px rgba(0,174,236,.1)}
  .filters{display:flex;gap:5px;flex-wrap:wrap}
  .filters button{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);
    background:#fff;color:var(--text-2)}
  .filters button.on{border-color:var(--pink);background:var(--pink-soft);color:#d94d7a;font-weight:600}

  .task{padding:11px 14px 12px;border-left:3px solid transparent;cursor:pointer;
    border-bottom:1px solid var(--border-2)}
  .task:hover{background:#fafbfc}
  .task.active{border-left-color:var(--pink);background:var(--pink-soft)}
  .task .when{font-size:11.5px;color:var(--text-3);margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
  .task .name{font-size:13.2px;font-weight:500;line-height:1.45;margin-bottom:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .task .meta{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  /* 任务列表项的操作入口：悬停显示「⋯」，右键也可打开 */
  .task{position:relative}
  .task .more{position:absolute;top:7px;right:7px;width:24px;height:24px;line-height:1;
    border:1px solid var(--border);background:#fff;border-radius:6px;color:var(--text-2);
    font-size:15px;font-weight:600;padding:0;cursor:pointer;z-index:2;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .task .more:hover{border-color:#cfe6f7;color:#1a86c7;background:#f7fcff}
  .task .more:hover{border-color:#cfd3d8;background:#f7f8f9;color:var(--text)}
  .task-menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--border);
    border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:4px;min-width:186px;font-size:13px}
  .task-menu button{display:block;width:100%;text-align:left;border:none;background:none;
    padding:7px 11px;border-radius:6px;color:var(--text);font-size:13px}
  .task-menu button:hover{background:#f4f5f7}
  .task-menu button.danger{color:#c33}
  .task-menu button.danger:hover{background:#fef2f2}
  .task-menu .sep{height:1px;background:var(--border-2);margin:4px 6px}
  .task-menu .head{padding:6px 11px 4px;font-size:11.5px;color:var(--text-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  .badge{padding:1px 7px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
  .b-done{background:#eef7f1;color:var(--green)}
  .b-run{background:#eef6fd;color:#1a86c7}
  .b-wait{background:#fff6e8;color:#c8811a}
  .b-fail{background:#fef2f2;color:#c33}
  .b-idle{background:#f2f3f5;color:var(--text-3)}

  .stages{display:flex;align-items:center;gap:2px;margin-bottom:14px;flex-wrap:wrap}
  .stage{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:999px;
    font-size:12.5px;color:var(--text-3);background:var(--card);border:1px solid var(--border)}
  .stage .dot{width:15px;height:15px;border-radius:50%;background:#e3e5e8;color:#fff;
    display:grid;place-items:center;font-size:10px;font-weight:700}
  .stage.done{color:var(--green);border-color:#d9ece2}
  .stage.done .dot{background:var(--green)}
  .stage.active{color:#1a86c7;border-color:#cfe6f7;background:#f6fbff}
  .stage.active .dot{background:var(--blue);animation:pulse 1.6s infinite}
  .stage.fail{color:#c33;border-color:#f8d7d7;background:#fef2f2}
  .stage.fail .dot{background:var(--red)}
  .stage .prog{font-size:11.5px;color:#5aa9d6;margin-left:2px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,174,236,.5)}50%{box-shadow:0 0 0 4px rgba(0,174,236,0)}}
  .arrow{color:#cfd3d8;font-size:11px}

  .barstrip{display:flex;align-items:center;gap:10px;font-size:12.6px;padding:9px 14px;
    border-radius:9px;margin-bottom:14px;border:1px solid var(--border);background:var(--card);color:var(--text-2);flex-wrap:wrap}
  .barstrip b{color:var(--text);font-weight:600}
  .barstrip.cost{background:#fafbfc}
  .barstrip.warn{background:#fffbf2;border-color:#f2dfa8;color:#8a6d1a}
  .barstrip.warn b{color:#a56a00}
  .barstrip.info{background:#f6fbff;border-color:#cfe6f7;color:#1a6a9c}
  .errbar{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;border-radius:10px;
    background:#fef2f2;border:1px solid #f8d7d7;margin-bottom:14px}
  .errbar .ico{width:20px;height:20px;border-radius:50%;background:#e05252;color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto;margin-top:1px}
  .errbar .txt{font-size:13px;color:#8a3b3b;line-height:1.55;min-width:0}
  .errbar .txt b{color:#c33}
  .errbar .acts{margin-left:auto;display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
  .btn-retry{border:1px solid #f0c8c8;background:#fff;color:#c33;padding:6px 13px;
    border-radius:8px;font-size:12.5px;white-space:nowrap}
  .btn-retry:hover{background:#fff7f7;border-color:#e8b0b0}
  .btn-detail{border:none;background:none;color:#a97a7a;font-size:12.5px;padding:6px 4px}
  .btn-detail:hover{text-decoration:underline}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:13.5px;font-weight:600;color:var(--text-2);
    display:flex;align-items:center;gap:8px}
  .ai-tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#f0f6ff;color:#2b7cd3;font-weight:400}
  .summary p{margin:0 0 10px}
  .summary ul{margin:6px 0 0;padding-left:20px;color:var(--text-2)}
  .summary li{margin-bottom:5px}
  .summary b{color:var(--text)}
  .summary h2,.summary h3{font-size:14px;margin:14px 0 8px}
  .summary blockquote{margin:8px 0;padding:8px 12px;background:#fffbf2;border-left:3px solid #f2dfa8;
    border-radius:0 6px 6px 0;color:#8a6d1a;font-size:12.6px}
  .summary code{background:#f4f5f7;padding:1px 5px;border-radius:4px;font-size:12.5px}

  details.scoped{margin:0 0 14px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
  details.scoped summary{padding:10px 16px;font-size:13px;color:var(--text-2);cursor:pointer;
    list-style:none;display:flex;align-items:center;gap:8px}
  details.scoped summary::-webkit-details-marker{display:none}
  details.scoped summary::before{content:"▸";color:var(--text-3)}
  details.scoped[open] summary::before{content:"▾"}
  details.scoped .inner{padding:2px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:13px 18px}
  details.scoped .inner .full{grid-column:1/-1}

  .clips-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px;flex-wrap:wrap;gap:8px}
  .clips-head h3{margin:0;font-size:14px;font-weight:600}
  .clips-head .hint{font-size:12px;color:var(--text-3)}
  .clip{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 15px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s}
  .clip:hover{border-color:#d5d9de;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .clip.off{opacity:.55}
  .clip.degraded{background:#fffbf2;border-color:#f2dfa8}
  .clip.failed{border-color:#f8d7d7}
  .clip-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
  .clip-head input[type=checkbox]{width:15px;height:15px;accent-color:var(--pink);cursor:pointer;margin:0}
  .tinput{width:82px;border:1px solid var(--border);border-radius:6px;padding:3px 6px;
    font-size:12.3px;color:var(--text-2);text-align:center}
  .tinput:focus{outline:none;border-color:#cfe6f7;background:#fff;color:var(--text)}
  .tinput.changed{border-color:#f0c060;background:#fffaf0;color:#a56a00;font-weight:600}
  .dash{color:var(--text-3);font-size:12px}
  .dur{font-size:11.5px;color:var(--text-3);padding:1px 6px;background:#f6f7f8;border-radius:4px}
  .dur.bad{background:#fef2f2;color:#c33}
  .changed-tag{font-size:11px;padding:1.5px 7px;border-radius:5px;background:#fff8ec;color:#c8811a}
  .score{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600}
  .score .bar{width:52px;height:4px;border-radius:2px;background:#eceef0;overflow:hidden}
  .score .bar i{display:block;height:100%;border-radius:2px;background:var(--pink)}
  .score.low .bar i{background:var(--amber)}
  .title-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .clip-title{flex:1;min-width:0;border:1px solid transparent;background:#fafbfc;border-radius:7px;
    padding:7px 9px;font-size:13.8px;font-weight:600;color:var(--text)}
  .clip-title:hover{background:#f5f6f8}
  .clip-title:focus{outline:none;background:#fff;border-color:#cfe6f7;box-shadow:0 0 0 3px rgba(0,174,236,.1)}
  .cnt{font-size:11.5px;color:var(--text-3);flex:0 0 auto;min-width:44px;text-align:right}
  .cnt.over{color:#d94a4a;font-weight:600}
  .degraded-note{font-size:12px;color:#a56a00;margin-bottom:8px;display:flex;gap:6px;align-items:center}
  /* 墓碑拦截态：故意不投的切片。用灰紫而不是红色 —— 它不是错误，
     是「已经投过了」的保护动作，用红色会让人以为出了故障并去点重试。 */
  .clip.tomb{background:#faf9fc;border-color:#ded8ea}
  .pill.tomb{background:#efe9f8;color:#6b4fa8}
  .tomb-note{font-size:12px;line-height:1.65;color:#5b5070;background:#f5f2fb;border:1px solid #e3dbf3;
    border-radius:8px;padding:9px 11px;margin-bottom:9px}
  .tomb-note b{color:#4b3a78}
  .tomb-note a{color:#6b4fa8}
  .tomb-meta{margin:5px 0;color:#6d6484;font-size:11.5px;word-break:break-all}
  .tomb-meta code{background:#fff;border:1px solid #e3dbf3;border-radius:4px;padding:0 4px}
  .linkbtn.danger{color:#b3261e}
  .linkbtn.danger:hover{color:#8c1d18}
  /* 错误报告降级提示：报告文件没了、内容由事件行合成时必须说清，
     否则用户会以为"细节本来就没有"。用琥珀色 —— 是"信息不完整"，不是"又出错了"。 */
  .warnbox{font-size:12px;line-height:1.6;color:#7a4a06;background:#fff8e6;border:1px solid #f0dca8;
    border-radius:8px;padding:8px 11px;margin-bottom:10px}
  .warnbox code{background:#fff;border:1px solid #f0dca8;border-radius:4px;padding:0 4px;word-break:break-all}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .tags span{font-size:11.5px;padding:1.5px 8px;border-radius:5px;background:#f4f5f7;color:#5c6169}
  .why{font-size:12.6px;color:var(--text-2);margin:0 0 10px;padding-left:10px;border-left:2px solid var(--border)}
  .why b{color:var(--pink);font-weight:600}
  .clip-foot{display:flex;align-items:center;gap:12px;font-size:12.5px;flex-wrap:wrap}
  .linkbtn{border:none;background:none;color:var(--blue);padding:0}
  .linkbtn:hover{text-decoration:underline}
  .sched{margin-left:auto;color:var(--text-3)}
  .pill{font-size:11.5px;padding:1.5px 8px;border-radius:999px;background:#eef7f1;color:var(--green)}
  .pill.fail{background:#fef2f2;color:#c33}
  .pill.wait{background:#fff6e8;color:#c8811a}

  .sched-group{margin-bottom:20px}
  .sched-title{display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--text-3);margin-bottom:9px}
  .sched-title b{color:var(--text);font-size:12.5px;font-weight:600}
  .slot{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
  .slot:last-child{border-bottom:none}
  .slot .t{font-variant-numeric:tabular-nums;font-size:12px;color:var(--pink);font-weight:600;
    min-width:52px;font-family:ui-monospace,Consolas,monospace}
  .slot .b{min-width:0;flex:1}
.slot .b .acts{margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.slot .b .acts .linkbtn{font-size:11.5px}
  .slot .b .n{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .slot .b .s{font-size:11.5px;color:var(--text-3);margin-top:2px}
  .published .n{color:var(--text-2)}

  .actionbar{margin-top:20px;display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;flex-wrap:wrap;
    position:sticky;bottom:12px;box-shadow:0 -4px 20px rgba(0,0,0,.05)}
  .actionbar .info{font-size:13px;color:var(--text-2)}
  .actionbar .info b{color:var(--text)}
  .primary{margin-left:auto;background:var(--pink);color:#fff;border:none;border-radius:8px;
    padding:9px 20px;font-size:13.5px;font-weight:600;box-shadow:0 2px 8px rgba(251,114,153,.3)}
  .primary:hover{background:#f96389}
  .primary:disabled{background:#e3e5e8;color:#a9adb3;box-shadow:none;cursor:not-allowed}
  .danger{border:1px solid #f0c8c8;background:#fff;color:#c33;border-radius:8px;padding:8px 16px;font-size:13px}

  .mask{position:fixed;inset:0;background:rgba(20,22,26,.45);display:none;z-index:50;
    align-items:center;justify-content:center;padding:24px}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:14px;width:min(820px,100%);max-height:86vh;
    display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.28)}
  .modal.wide{width:min(1000px,100%)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    padding:15px 22px;border-bottom:1px solid var(--border);gap:12px}
  .modal-head h2{margin:0;font-size:15.5px;font-weight:600}
  .modal-head .x{border:none;background:none;font-size:17px;line-height:1;color:var(--text-3);
    padding:3px 7px;border-radius:6px}
  .modal-head .x:hover{background:#f2f3f5;color:var(--text)}
  .modal-body{overflow-y:auto;padding:4px 22px}
  .modal-body::-webkit-scrollbar{width:8px}
  .modal-body::-webkit-scrollbar-thumb{background:#dcdfe3;border-radius:4px}
  .modal-foot{display:flex;align-items:center;gap:10px;padding:13px 22px;
    border-top:1px solid var(--border);background:#fcfcfd;border-radius:0 0 14px 14px;flex-wrap:wrap}
  .modal-foot .tip{font-size:12px;color:var(--text-3)}
  .btn-plain{border:1px solid var(--border);background:#fff;color:var(--text-2);
    padding:8px 18px;border-radius:8px;font-size:13.5px}
  .btn-plain:hover{border-color:#cfd3d8;color:var(--text)}
  .btn-sm{border:1px solid var(--border);background:#fff;color:var(--blue);
    padding:7px 12px;border-radius:8px;font-size:12.5px;white-space:nowrap}
  .btn-sm:hover{border-color:#b9dcf0;background:#f7fcff}
  .btn-sm:disabled{color:var(--text-3);cursor:default}
  .group{padding:15px 0 4px;border-bottom:1px solid var(--border-2)}
  .group:last-child{border-bottom:none;padding-bottom:18px}
  .group > h3{margin:0 0 3px;font-size:13px;font-weight:600}
  .group > .gdesc{font-size:12px;color:var(--text-3);margin:0 0 12px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:13px 18px}
  .fields .full{grid-column:1/-1}
  .field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px}
  .field .ctl{display:flex;gap:8px;align-items:center}
  .inp{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 11px;
    font-size:13.2px;color:var(--text);background:#fff}
  .inp:focus{outline:none;border-color:#cfe6f7;box-shadow:0 0 0 3px rgba(0,174,236,.1)}
  .inp[readonly]{background:#f7f8f9;color:var(--text-2);cursor:default}
  .inp.num{width:98px}
  textarea.inp{min-height:70px;resize:vertical;font-family:inherit}

<body>

<div id="toast"></div>

<script>
/* ============================================================================
 * 基础
 * ========================================================================== */
const BOOT = window.__BOOT__ || { csrf: '', version: '?', roomId: '', platform: '' };

/** UI 构建标记：在浏览器控制台里能看到，用来确认页面是不是最新的（避免缓存导致以为功能没做） */
const UI_BUILD = 'ui-2026-09-24-monitor-panel';
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const state = {
  view: 'tasks',
  tasks: [],
  activeId: null,
  detail: null,
  status: '',
  q: '',
  schedule: { pending: [], published: [], retention: [] },
  /** 目录轮询状态（/api/watch）：用来在右栏显示"它在等什么" */
  watch: null,
  bootstrap: null,
  dirty: new Set(),   // 已编辑但未保存的切片：taskId:idx
  saving: false,
  /**
   * 实时监控页签的运行态。
   *
   * `sig` 是"去掉易变字段后的数据指纹"：5 秒一刷如果整页 innerHTML 重画，
   * 光标、滚动位置、展开的 details 都会被打断 —— 所以数据没变就只更新"最后更新"那一行。
   */
  mon: { interval: 5, paused: false, timer: null, busy: false, data: null, sig: '', lastAt: 0, lastError: '' },
};

async function api(path, opts = {}) {
  const doFetch = async () => {
    const res = await fetch(path, {
      method: opts.method || 'GET',
      headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': BOOT.csrf },
      ...(opts.body ? { body: JSON.stringify(opts.body) } : {}),
    });
    const text = await res.text();
    let data;
    try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
    return { res, data };
  };

  let { res, data } = await doFetch();

  // 服务重启后 CSRF token 会重新生成，本页持有的旧 token 随即失效。
  // 这时**不该让用户自己去刷新页面**：自动重新拉一次 token 并重放本次请求即可。
  // 只对写操作重试（读操作本来就不校验 token），且最多重试一次，避免死循环。
  const isCsrfFailure = res.status === 403 && /CSRF/i.test(String(data?.error ?? ''));
  if (isCsrfFailure && (opts.method && opts.method !== 'GET')) {
    try {
      const boot = await fetch('/api/bootstrap', { headers: { 'Cache-Control': 'no-cache' } });
      const fresh = await boot.json();
      if (fresh && typeof fresh.csrf === 'string') {
        BOOT.csrf = fresh.csrf;
        window.__BOOT__ = BOOT;
        if (!opts.__retried) {
          return api(path, { ...opts, __retried: true });
        }
      }
    } catch {
      /* 拿不到新 token 就按原错误上报 */
    }
  }

  if (!res.ok) {
    const err = new Error(data?.error || `HTTP ${res.status}`);
    err.payload = data;
    err.status = res.status;
    err.csrfFailure = isCsrfFailure;
    throw err;
  }
  return data;
}

function toast(msg, ms = 2600) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__t);
  window.__t = setTimeout(() => el.classList.remove('show'), ms);
}
window.toast = toast;

const toSec = (s) => { const p = String(s).split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1]; };
const toTime = (n) => { n = Math.max(0, Math.round(Number(n) || 0)); return [Math.floor(n / 3600), Math.floor(n % 3600 / 60), n % 60].map((x) => String(x).padStart(2, '0')).join(':'); };
const fmtGB = (b) => { if (!b) return '0 B'; const u = ['B', 'KB', 'MB', 'GB', 'TB']; const i = Math.min(4, Math.floor(Math.log(b) / Math.log(1024))); return (b / 1024 ** i).toFixed(i === 0 ? 0 : 1) + ' ' + u[i]; };

/** 极简 Markdown 渲染（够用即可：标题、列表、粗体、行内代码、引用、段落） */
function md(text) {
  const lines = String(text || '').split('\n');
  let out = '';
  let inUl = false;
  const closeUl = () => { if (inUl) { out += '</ul>'; inUl = false; } };
  for (let raw of lines) {
    let l = raw.replace(/^<!--.*-->$/, '').trimEnd();
    if (!l.trim()) { closeUl(); continue; }
    if (/^>\s?/.test(l)) { closeUl(); out += `<blockquote>${inline(l.replace(/^>\s?/, ''))}</blockquote>`; continue; }
    const h = /^(#{1,4})\s+(.*)$/.exec(l);
    if (h) { closeUl(); out += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`; continue; }
    const li = /^\s*[-*]\s+(.*)$/.exec(l);
    if (li) { if (!inUl) { out += '<ul>'; inUl = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    closeUl();
    out += `<p>${inline(l)}</p>`;
  }
  closeUl();
  return out;
}
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}

/* ============================================================================
 * 数据加载
 * ========================================================================== */
async function loadBootstrap() {
  state.bootstrap = await api('/api/bootstrap');
  const b = state.bootstrap;
  $('#modeSwitch').classList.toggle('on', b.mode.autoPublish);
  $('#modeText').textContent = b.mode.autoPublish ? '全自动 · 免确认发布' : '半自动 · 需确认后发布';
  $('#brandText').textContent = `房间 ${b.roomId} · v${b.version}` + (b.mode.isOnlySelf ? ' · 仅自己可见' : '') + (b.seasonConfigured ? '' : ' · 未配置合集');
}

async function loadTasks() {
  const qs = new URLSearchParams();
  if (state.status) qs.set('status', state.status);
  if (state.q) qs.set('q', state.q);
  const data = await api('/api/tasks?' + qs.toString());
  state.tasks = data.tasks;
  state.monthly = data.monthly;
  if (!state.activeId && state.tasks.length) state.activeId = state.tasks[0].id;
  if (state.activeId && !state.tasks.some((t) => t.id === state.activeId)) {
    state.activeId = state.tasks.length ? state.tasks[0].id : null;
  }
  renderTaskList();
}

async function loadDetail() {
  if (!state.activeId) { $('#detail').innerHTML = '<div class="empty">左侧还没有任务。服务正在轮询录制历史，也可以在右上角点「立即检查」。</div>'; return; }
  state.detail = await api('/api/task/' + encodeURIComponent(state.activeId));
  renderDetail();
}

async function loadSchedule() {
  state.schedule = await api('/api/schedule');
  /* 自动导入的状态也一起取：用户看不到"它在等什么"时，会以为轮询没生效，
     然后自己去手动导入（于是任务标成「手动导入」，更困惑）。 */
  try { state.watch = await api('/api/watch'); } catch { state.watch = null; }
  renderSchedule();
}

async function refreshAll(silent) {
  try {
    await loadTasks();
    await Promise.all([loadDetail(), loadSchedule()]);
    void refreshPendingBadge();
  } catch (e) {
    if (!silent) toast('加载失败：' + e.message);
  }
}

/**
 * 待删清单角标：有待删文件时直接在按钮上显示数量和释放空间。
 *
 * 为什么要在按钮上提示而不是只在弹窗里：这个功能的默认宽限期是 24 小时，
 * 用户很可能根本不记得它还挂着 —— 到点删掉了源录播才发现就晚了。
 */
async function refreshPendingBadge() {
  const btn = $('#btnPendingDelete');
  const badge = $('#pendingDeleteBadge');
  const hint = $('#pendingDeleteHint');
  if (!btn || !badge) return;
  try {
    const r = await api('/api/pending-delete');
    const n = r.stats.pendingCount;
    if (n > 0) {
      badge.textContent = `（${n} 项 · ${fmtBytes(r.stats.pendingBytes)}）`;
      badge.style.color = '#c33';
      if (hint && r.stats.nextDueAt) hint.textContent = `最早 ${fmtTime(Date.parse(r.stats.nextDueAt))} 自动删除；宽限期内可取消。`;
    } else {
      badge.textContent = '';
      if (hint) hint.textContent = '本场全部切片确认投稿成功后，成片与源录播会排进待删清单，宽限期过后自动删除。宽限期内可在这里取消。';
    }
  } catch {
    /* 角标拿不到不影响主流程 */
  }
}

/**
 * 待删清单的「立即删除」：确认文案必须区分**两种截然不同的后果**。
 *
 * - 同盘（`willTrash`）→ 移入回收站，7 天内可恢复 → 文案说明"可恢复"；
 * - 异盘 → 回收站在别的盘，整份复制 20 GB 不现实 → 直接删，**不可恢复** →
 *   必须用"永久删除 / 无法恢复"这样的字眼，并把文件名列出来，别让人点下去才发现。
 *
 * 返回删除结果（`null` = 用户取消），调用方据此刷新自己的视图。
 */
async function deletePendingNow(ids, entries) {
  const list = (entries || []).filter((e) => ids.includes(e.id));
  const permanent = list.filter((e) => e.willTrash === false);
  const gone = list.filter((e) => e.existsNow === false);
  const mb = (list.reduce((a, e) => a + (Number(e.sizeBytes) || 0), 0) / 1048576).toFixed(1);
  let msg = `立即删除 ${ids.length} 个文件（共 ${mb} MB）？\n\n不是等到宽限期，而是现在就删。`;
  const toTrash = list.length - permanent.length - gone.length;
  if (toTrash > 0) msg += `\n· ${toTrash} 个移入回收站，7 天内可恢复`;
  if (gone.length) msg += `\n· ${gone.length} 个文件已经不在磁盘上（只会标记为已删除）`;
  if (permanent.length) {
    const names = permanent.slice(0, 3).map((e) => String(e.path).split(/[\\/]/).pop());
    msg += `\n\n⚠️ 其中 ${permanent.length} 个在别的盘（回收站在本盘），删除后【无法恢复】：\n  ${names.join('\n  ')}${permanent.length > 3 ? `\n  …等 ${permanent.length} 个` : ''}`;
  }
  if (!confirm(msg)) return null;

  const body = ids.length === 1 ? { id: ids[0] } : { ids };
  const r = await api('/api/pending-delete/delete', { method: 'POST', body });
  toast(r.note, 7000);
  void refreshPendingBadge();
  return r;
}

/** 待删条目的一行标签与按钮（清单弹窗与监控面板共用，两处文案不能漂移） */
function pendingRowActions(e, opts = {}) {
  const willTrash = e.willTrash !== false;
  const tag = e.existsNow === false
    ? '<span class="tag-mini">文件已不在</span>'
    : willTrash
      ? '<span class="tag-mini">删除→回收站</span>'
      : '<span class="tag-mini" style="background:#fdecec;color:#c33">跨盘·删除不可恢复</span>';
  const label = e.existsNow === false ? '标记为已删除' : '立即删除';
  return `${tag}<button class="btn-sm" style="margin-left:6px" data-pending-del="${esc(e.id)}">${label}</button>` +
    (opts.cancellable ? `<button class="btn-sm" data-cancel="${esc(e.id)}">取消删除</button>` : '');
}

/* ============================================================================
 * 左栏：任务列表
 * ========================================================================== */
/* ---------------------------------------------------------------------------
 * 任务操作菜单（列表项的「⋯」按钮与右键都能打开）
 *
 * 为什么需要：进程被强杀后任务会永久停在「切片中」这类状态，
 * 界面上既没有失败提示、也没有重跑入口，用户唯一的出路是手改 ledger.json。
 * ------------------------------------------------------------------------- */
function closeTaskMenu() {
  const m = document.getElementById('taskMenu');
  if (m) m.remove();
}

/** 复制文本到剪贴板（clipboard API 在非安全上下文不可用，留 execCommand 兜底） */
async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`已复制${label || ''}`);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      toast(`已复制${label || ''}`);
    } catch {
      toast('复制失败，请手动选择文本');
    }
    ta.remove();
  }
}

/**
 * 汇总一个任务已投稿切片的链接（标题 + 视频地址）。
 *
 * 为什么需要：本地删除**不会撤回 B站 上的稿件**，真要下架必须去创作中心。
 * 一次把链接全给用户，省得他一个个点开卡片找 BV 号。
 */
async function collectPublishedLinks(taskId) {
  const d = await api('/api/task/' + encodeURIComponent(taskId));
  return (d.clips || [])
    .filter((c) => c.bvid)
    .map((c) => (c.title || '(无标题)') + '\t' + 'https://www.bilibili.com/video/' + c.bvid);
}

function openTaskMenu(taskId, anchorEl) {
  closeTaskMenu();
  const t = state.tasks.find((x) => x.id === taskId);
  if (!t || !anchorEl) return;
  const running = ['TRANSCRIBING','ANALYZING','CLIPPING','PUBLISHING','PENDING','RECORDED','TRANSCRIBED'].includes(t.status);
  const done = ['PUBLISHED','ARCHIVED'].includes(t.status);
  const menu = document.createElement('div');
  menu.className = 'task-menu';
  menu.id = 'taskMenu';
  menu.innerHTML = `
    <div class="head" title="${esc(t.title)}">${esc(t.title)}${t.publishedCount ? `　·　已投稿 ${t.publishedCount}` : ''}</div>
    <button data-op="open">查看详情</button>
    ${running ? '<button data-op="stop">停止处理</button>' : ''}
    <button data-op="retry">从某阶段重跑…</button>
    <div class="sep"></div>
    ${t.publishedCount ? '<button data-op="copy-links">复制全部稿件链接</button>' : ''}
    ${t.publishedCount ? '<button data-op="center">打开 B站 稿件管理</button>' : ''}
    ${t.publishedCount ? '<div class="sep"></div>' : ''}
    <button data-op="copy">复制任务 ID</button>
    <button data-op="dir">打开产物目录</button>
    ${done ? '<button data-op="perf">刷新稿件表现数据</button>' : ''}
    <div class="sep"></div>
    <button data-op="delete" class="danger">删除任务…</button>`;
  document.body.appendChild(menu);
  const r = anchorEl.getBoundingClientRect();
  const mw = 200;
  const mh = menu.offsetHeight || 230;
  menu.style.left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8)) + 'px';
  menu.style.top = (r.bottom + mh > window.innerHeight ? Math.max(8, r.top - mh) : r.bottom + 4) + 'px';
  menu.querySelectorAll('button[data-op]').forEach((b) => (b.onclick = (ev) => {
    ev.stopPropagation();
    const op = b.dataset.op;
    closeTaskMenu();
    handleTaskOp(op, taskId);
  }));
}

async function handleTaskOp(op, taskId) {
  const t = state.tasks.find((x) => x.id === taskId);
  try {
    if (op === 'open') {
      if (state.dirty.size && !confirm('有未保存的切片修改，切换任务会丢失。确定切换？')) return;
      state.dirty.clear();
      state.activeId = taskId;
      renderTaskList();
      await loadDetail();
    } else if (op === 'copy-links') {
      const lines = await collectPublishedLinks(taskId);
      if (!lines.length) { toast('该任务还没有已投稿的稿件'); return; }
      await copyText(lines.join('\n'), ` ${lines.length} 条稿件链接（可粘到创作中心核对）`);
    } else if (op === 'center') {
      window.open('https://member.bilibili.com/platform/manage/index', '_blank', 'noopener,noreferrer');
      toast('已打开 B站 稿件管理页 —— 删除已投稿件只能在这里操作', 6000);
    } else if (op === 'copy') {
      try { await navigator.clipboard.writeText(taskId); toast('已复制任务 ID'); } catch { toast(taskId, 6000); }
    } else if (op === 'dir') {
      const d = await api('/api/task/' + encodeURIComponent(taskId));
      openInfo('产物位置', '<div class="kv"><div class="k">任务目录</div><div class="mono-sm" style="word-break:break-all">' + esc(d.taskDirHint || '') + '</div><div class="k">切片产物</div><div class="mono-sm" style="word-break:break-all">' + esc(d.clipsDirHint || '(无)') + '</div></div><p class="hintline">可直接复制上面的路径到资源管理器打开。</p>');
    } else if (op === 'perf') {
      toast('正在拉取稿件表现数据…');
      const r = await api('/api/performance/refresh', { method: 'POST' });
      toast('已更新 ' + r.updated + '/' + r.checked);
    } else if (op === 'stop') {
      if (!confirm('停止处理这个任务？\n\n会把它移出待处理队列并把状态修回可操作状态。\n注意：biliLive-tools 里已在跑的 ffmpeg 会自己跑完。')) return;
      const r = await api('/api/task/' + encodeURIComponent(taskId) + '/stop', { method: 'POST' });
      toast(r.from + ' → ' + r.to + '：' + r.reason, 6000);
      setTimeout(() => refreshAll(true), 700);
    } else if (op === 'retry') {
      openInfo('从某阶段重跑', '<p style="font-size:13px;color:var(--text-2)">转写结果与切片产物都会复用，重跑不会重复产生 ASR 费用。</p><div class="chips" id="retryStages">' +
        [['ANALYZED','重新分析（重跑 LLM 选片）'],['TRANSCRIBED','重新转写（复用缓存）'],['RECORDED','从源素材重来'],['CLIPPED','重新切片与投稿']]
          .map(([v, label]) => '<button class="chip" data-stage="' + v + '">' + label + '</button>').join('') + '</div>');
      // ⚠️ 必须用 $$（querySelectorAll）：$ 是 querySelector，返回**单个元素**，
      //    元素上没有 .forEach → 抛 TypeError → 整段绑定从不执行，界面上就是「按钮点不了」
      $$('#retryStages .chip').forEach((c) => (c.onclick = async () => {
        c.classList.add('on');
        try {
          const r = await api('/api/task/' + encodeURIComponent(taskId) + '/retry', { method: 'POST', body: { fromStage: c.dataset.stage } });
          closeInfo();
          toast(r.note || '已提交重跑', 5000);
          setTimeout(() => refreshAll(true), 1200);
        } catch (e) { toast('重跑失败：' + e.message, 5000); c.classList.remove('on'); }
      }));
    } else if (op === 'delete') {
      await openDeleteDialog(taskId);
    }
  } catch (e) {
    toast('操作失败：' + e.message, 6000);
  }
  void t;
}

/** 删除对话框：先给「删什么、释放多少、有没有已投稿切片」的预览，再让用户确认 */
async function openDeleteDialog(taskId) {
  const plan = await api('/api/task/' + encodeURIComponent(taskId) + '/delete-plan');
  const p = plan.plan;
  const rawList = p.rawFiles.filter((r) => r.exists);
  let html = '';
  if (plan.warning) html += '<div class="barstrip warn">' + esc(plan.warning) + '</div>';
  html += '<p style="font-size:13px">勾选要一并删除的内容。<b>默认只删切片产物</b>（最占地方，且随时可重新切）。</p>';
  html += '<div class="fields" style="grid-template-columns:1fr">';
  html += '<div class="field"><label><input type="checkbox" id="delClips"' + (p.clipsFiles ? ' checked' : ' disabled') + '> 切片产物（' + p.clipsFiles + ' 个文件，' + p.clipsMB + ' MB）</label></div>';
  html += '<div class="field"><label><input type="checkbox" id="delTaskDir"> 任务目录（压制产物 ' + (p.taskFullMB || 0) + ' MB + 转写 / 弹幕信号 / 总结 ' + (p.taskMetaMB || 0) + ' MB，合计 ' + p.taskMB + ' MB）</label>';
  html += '<div class="hintline">大头是 full/ 下的压制产物（弹幕版 + 纯净版）。删掉后无法回看本场总结与转写；重跑需重新转写（会再花 ASR 费用）。</div></div>';
  rawList.forEach((r, i) => {
    html += '<div class="field"><label><input type="checkbox" id="delRaw' + i + '"' + (r.sharedWith.length ? ' disabled' : '') + '> 源素材 ' + esc(r.name) + '（' + r.MB + ' MB）' + (r.sharedWith.length ? ' <span style="color:#c8811a">被其它任务共用，已锁定</span>' : '') + '</label></div>';
  });
  html += '</div>';
  html += '<p class="hintline">合计约 ' + p.totalMB + ' MB。删除不可逆，且<b>不会撤回已投稿件</b>。</p>';
  html += '<div style="margin-top:14px"><button class="danger" id="doDelete">确认删除</button></div>';
  openInfo('删除任务：' + String(p.title).slice(0, 28), html);
  $('#doDelete').onclick = async () => {
    let anyRaw = false;
    rawList.forEach((r, i) => {
      const el = document.getElementById('delRaw' + i);
      if (el && el.checked && !el.disabled) anyRaw = true;
    });
    const btn = $('#doDelete');
    const wantTaskDir = !!($('#delTaskDir') && $('#delTaskDir').checked);
    btn.disabled = true;
    try {
      const r = await api('/api/task/' + encodeURIComponent(taskId) + '/delete', {
        method: 'POST',
        body: {
          confirm: true,
          deleteClips: !!($('#delClips') && $('#delClips').checked),
          deleteTaskDir: wantTaskDir,
          deleteRaw: anyRaw,
        },
      });
      closeInfo();
      toast(
        (wantTaskDir ? (r.trashId ? '已移入回收站（可在「设置 → 回收站」恢复），释放 ' : '已删除，释放 ') : '已删除所选文件（任务记录保留，可随时重切），释放 ') +
          r.freedMB + ' MB' + (r.skipped.length ? '（' + r.skipped.length + ' 项跳过）' : ''),
        6000,
      );
      // 只删文件时不要清空选中项，否则用户会以为整个任务也没了
      if (wantTaskDir) {
        if (state.activeId === taskId) state.activeId = null;
        state.dirty.clear();
      }
      setTimeout(() => refreshAll(true), 700);
    } catch (e) {
      toast('删除失败：' + e.message, 6000);
      btn.disabled = false;
    }
  };
}
function renderTaskList() {
  const badge = { processing: 'b-run', review: 'b-wait', failed: 'b-fail', published: 'b-done' };
  const group = (s) => (['PUBLISHED', 'ARCHIVED'].includes(s) ? 'published'
    : s === 'FAILED' ? 'failed' : s === 'ANALYZED' ? 'review' : 'processing');
  $('#taskList').innerHTML = state.tasks.length ? state.tasks.map((t) => {
    const g = group(t.status);
    const extra = [];
    if (t.progress) extra.push(`${t.progress.label}`);
    if (t.clipCount) extra.push(`${t.clipCount} 候选`);
    if (t.degradedCount) extra.push(`${t.degradedCount} 降级`);
    // 来源标记：目录轮询自动捡起来的（auto）与人工点的（manual）必须一眼分得清
    if (t.importSource === 'auto') extra.push('自动导入');
    else if (t.manual || t.importSource === 'manual') extra.push('手动导入');
    // 在等 biliLive-tools 投完整版：这是默认规则下的正常中间态，必须一眼看出来（否则像卡住了）
    if (t.publishWaiting) extra.push('⏳ 等完整版稿件');
    return `<div class="task ${t.id === state.activeId ? 'active' : ''}" data-id="${esc(t.id)}">
      <div class="when"><span>${esc(t.when)}</span><span>${toTime(t.durationSec)}</span></div>
      <div class="name">${esc(t.title)}</div>
      <div class="meta"><span class="badge ${badge[g] || 'b-idle'}">${esc(t.statusText)}</span>${extra.map((x) => `<span>${esc(x)}</span>`).join('')}</div>
      <button class="more" data-more="${esc(t.id)}" title="任务操作（右键同样可打开）">⋯</button>
    </div>`;
  }).join('') : '<div class="empty" style="padding:16px">没有符合条件的任务</div>';
  // ---- 交互绑定 ----
  // 点击卡片：切换任务
  $$('#taskList .task').forEach((el) => (el.onclick = () => {
    if (state.dirty.size && !confirm('有未保存的切片修改，切换任务会丢失。确定切换？')) return;
    state.dirty.clear();
    state.activeId = el.dataset.id;
    renderTaskList();
    loadDetail().catch((e) => toast(e.message));
  }));

  // 「⋯」按钮：打开操作菜单。
  // 必须 stopPropagation —— 否则点「⋯」会顺带触发任务切换，菜单刚开就被重渲染冲掉。
  $$('#taskList .task .more').forEach((b) => (b.onclick = (ev) => {
    ev.stopPropagation();
    openTaskMenu(b.dataset.more, b);
  }));

  // 右键任务卡片：同样打开菜单（Windows 用户的第一直觉）
  $$('#taskList .task').forEach((el) => (el.oncontextmenu = (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    openTaskMenu(el.dataset.id, el);
  }));

  // 点空白处 / Esc 关闭菜单（全局只注册一次，避免每次重渲染叠加监听）
  if (!window.__taskMenuCloseBound) {
    window.__taskMenuCloseBound = true;
    document.addEventListener('click', (ev) => {
      const inMenu = ev.target && ev.target.closest && ev.target.closest('.task-menu');
      if (!inMenu) closeTaskMenu();
    });
    document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeTaskMenu(); });
  }
}

      <span id="publishHint" style="font-size:12px;color:var(--text-3)"></span>

  } else {

      : ['TRANSCRIBING', 'TRANSCRIBED', 'ANALYZING'].includes(d.status) ? '正在处理中，完成后会自动进入内容分析。'
      : ['ANALYZED'].includes(d.status) ? '分析完成但未产出候选切片。'
      : '该场次暂无切片。';
    html += `<div class="card"><h2>状态</h2><div class="summary"><p style="color:var(--text-3)">${esc(msg)}</p></div></div>`;
  }

  // 素材与文件
  html += `<div class="card"><h2>素材与产出</h2>
    <div class="kv">
      <div class="k">主播</div><div>${d.streamer
        ? `${esc(d.streamer)} <span style="color:var(--text-3)">（按录制目录名/弹幕/转写识别，总结与标题都按这个名字写）</span>`
        : '<span style="color:#c8811a">未识别</span> <span style="color:var(--text-3)">—— 提示词不会注入主播名，模型只依据转写内容</span>'}</div>
      <div class="k">源文件</div><div>${d.source.rawCount} 个分段 · ${fmtGB(d.source.rawTotalGB * 1024 ** 3)}${d.source.fullVideoExists ? ' · 压制产物已就绪' : ' · 无压制产物'}</div>
      <div class="k">弹幕</div><div>${d.source.danmaAss ? 'ASS ✓' : 'ASS ✗'} / ${d.source.danmaXml ? 'XML ✓' : 'XML ✗'} · 烧弹幕=${d.source.fullVideoHasDanmaku ? '源文件已含弹幕（不重复烧）' : '切片时烧入'}</div>
      <div class="k">素材保留</div><div>${esc(d.retention.fullVideoReason)}</div>
      <div class="k">封面</div><div>来源 ${esc(d.cover.source)}${d.cover.cover ? ' · ' + esc(String(d.cover.cover).split(/[\\/]/).pop()) : ''}</div>
      ${d.seasonId ? `<div class="k">合集</div><div>seasonId=${d.seasonId}</div>` : '<div class="k">合集</div><div style="color:#c8811a">未配置 —— 切片不会归入同一合集</div>'}
    </div>
    ${d.files && d.files.length ? `<div style="margin-top:12px"><div class="k" style="font-size:11.5px;color:var(--text-3);margin-bottom:6px">任务目录文件（点击预览）</div>
      <div class="filelist">${d.files.map((f) => `<button data-act="preview" data-file="${esc(f)}">${esc(f)}</button>`).join('')}</div></div>` : ''}
  </div>`;

  if (d.transcriptPreview && d.transcriptPreview.length) {
    html += `<div class="card"><h2>转写预览（前 ${d.transcriptPreview.length} 条）</h2>
      <div class="timeline">${d.transcriptPreview.map((t) => `<div class="row"><span class="t">${esc(t.time)}</span><span class="s">${esc(t.text)}</span></div>`).join('')}</div></div>`;
  }

  box.innerHTML = html;
  bindDetail();
}

function clipHTML(c) {
  const pct = Math.round((c.score / 10) * 100);
  const over = c.title.length > 80;
  const dur = c.end - c.start;
  const durBad = dur < state.bootstrap.config.clip.minDurationSec || dur > state.bootstrap.config.clip.maxDurationSec;
  const failed = c.status === 'FAILED';
  /* 墓碑拦截：这一片**故意没投**（内容以前已经投过 B站，而那次的任务被删了）。
     不是失败、也不该被"重试"救回来 —— 重试只会再撞一次墓碑。所以既不显示"失败"，
     也不给"重新切片"，只说明原因 + 给一个显式的解除入口。
     ★ 判据用**服务端解析出来的** `c.tombstone`，而不是 `c.blockedByTombstone`：
       后者是切片上持久化的历史标记，解除墓碑之后它不会自己消失（要靠服务端清理）。
       若用标记判断，解除完界面还会挂着墓碑说明，看起来像"解除没生效"。 */
  const tomb = c.tombstone || null;
  const statusPill = tomb ? `<span class="pill tomb">🪦 墓碑拦截</span>`
    : c.status === 'PUBLISHED' ? `<span class="pill">已发布${c.bvid ? ' ' + esc(c.bvid) : ''}</span>`
    : failed ? `<span class="pill fail">失败</span>`
    : c.status === 'SUBMITTED' ? `<span class="pill wait">已提交待确认</span>`
    : c.status === 'CUT' || c.status === 'CUTTING' ? `<span class="pill wait">已切片</span>` : '';
  return `<article class="clip ${c.selected ? '' : 'off'} ${c.degraded ? 'degraded' : ''} ${failed ? 'failed' : ''} ${tomb ? 'tomb' : ''}" data-clip="${c.index}">
    <div class="clip-head">
      <input type="checkbox" ${c.selected ? 'checked' : ''} data-act="select">
      <input class="tinput" data-k="start" value="${toTime(c.start)}">
      <span class="dash">–</span>
      <input class="tinput" data-k="end" value="${toTime(c.end)}">
      <span class="dur ${durBad ? 'bad' : ''}" data-role="dur">${dur.toFixed(0)} 秒</span>
      <span class="changed-tag" data-role="changed" style="display:${c.edited ? 'inline-block' : 'none'}">已改</span>
      <span class="score ${c.score < 7 ? 'low' : ''}"><span class="bar"><i style="width:${pct}%"></i></span>${Number(c.score).toFixed(1)}</span>
    </div>
    ${c.degraded ? '<div class="degraded-note">⚠ 降级产出：由弹幕密度选出，标题需人工填写后再发布</div>' : ''}
    ${tomb ? `<div class="tomb-note">
      <b>🪦 墓碑拦截 —— 这一片没有投稿（不是失败）</b>
      <div>这段内容<b>以前已经投过 B站</b>，而当时那个任务/切片已被删除。删除会清掉本地的幂等指纹，
      于是「重新导入同一份素材 → 重新分析出同一区间」就会再投一次、在 B站 上多出一个内容相同的稿件
      （B站 没有删除稿件的开放接口）。墓碑就是拦这件事的。</div>
      <div class="tomb-meta">
        ${tomb.bvid ? `旧稿件：<a href="https://www.bilibili.com/video/${esc(tomb.bvid)}" target="_blank" rel="noreferrer">${esc(tomb.bvid)}</a>` : '旧稿件：未反查到 bvid（当时只走到「已提交」）'}
        ${tomb.taskId ? ` · 原任务 <code>${esc(tomb.taskId)}</code>` : ''}
        ${tomb.retiredAt ? ` · 立碑于 ${esc(String(tomb.retiredAt).slice(0, 19).replace('T', ' '))}` : ''}
        ${tomb.title ? ` · 原标题「${esc(tomb.title)}」` : ''}
      </div>
      <div>确认 B站 上那个稿件<b>确实已经不存在</b>之后，再点下面的按钮解除；解除后重跑本场即可正常投稿。</div>
      <button class="linkbtn danger" data-act="release-tomb">确认旧稿件已删除，解除墓碑并允许重投</button>
    </div>` : ''}
    <div class="title-row">
      <input class="clip-title" data-act="title" value="${esc(c.title)}">
      <span class="cnt ${over ? 'over' : ''}" data-role="cnt">${c.title.length}/80</span>
    </div>
    ${over ? '<div class="hintline warn" style="margin:-4px 0 8px">超出 B站标题上限 80 字符，保存时会自动截断</div>' : ''}
    <div class="tags">${(c.tags || []).map((x) => `<span>${esc(x)}</span>`).join('')}<span style="background:#f0f6ff;color:#2b7cd3">${esc(c.category)}</span></div>
    <p class="why">${inline(c.reason || '')}</p>
    ${failed && c.failReason ? `<div class="hintline warn" style="margin-bottom:8px">失败原因：${esc(c.failReason)}</div>` : ''}
    <div class="clip-foot">
      <button class="linkbtn" data-act="preview-cut">试看</button>
      <button class="linkbtn" data-act="open-llc">在 biliLive-tools 中编辑</button>
      ${c.dtime ? `<span style="color:var(--text-3)">排期 ${esc(fmtTime(c.dtime * 1000))}</span>` : ''}
      ${statusPill}
      ${c.bvid ? `<a href="https://www.bilibili.com/video/${esc(c.bvid)}" target="_blank" rel="noreferrer" style="font-size:12px">查看稿件</a>` : ''}
      ${!tomb && (c.status === 'FAILED' || c.status === 'CUT') ? '<button class="linkbtn" data-act="recut" style="color:#c8811a">重新切片</button>' : ''}
    </div>
  </article>`;
}

function uploadStatusText(s) {
  return { NOT_APPLICABLE: '由 biliLive-tools 自动上传（不跟踪）', WAITING: '等待压制产物', UPLOADING: '上传中（未确认）', CONFIRMED: '已确认', FAILED: '失败' }[s] || s;
}

/** 把秒数格式化成好看的时间跨度（避免出现 2.0833333333333335h 这种浮点噪声） */
function fmtSpan(sec) {
  const s = Math.max(0, Math.round(Number(sec) || 0));
  const h = s / 3600, m = s / 60;
  if (s % 3600 === 0) return `${h} 小时`;
  if (s % 60 === 0 && s < 3600) return `${m} 分钟`;
  if (s >= 3600) return `${h.toFixed(1)} 小时`;
  return m < 1 ? `${s} 秒` : `${m.toFixed(0)} 分钟`;
}

/** 从 ISO 时间或毫秒时间戳得到 YYYY-MM-DD HH:mm */
function fmtTime(ts) {
  const n = Number(ts);
  if (!Number.isFinite(n) || n <= 0) return '';
  const d = new Date(n);
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/**
 * 人类可读字节数（与 src/util.ts 的 fmtBytes 保持一致）。
 *
 * ★ 这个函数曾经**只被调用、从未被定义** —— 「查看待删清单」与「回收站」两个弹窗
 *   一打开就抛 `ReferenceError: fmtBytes is not defined`，界面上只看到一句
 *   「读取待删清单失败：fmtBytes is not defined」，功能等于完全不可用。
 *   是 `npm run ui-e2e` 的第 12 段（真点按钮）把它抓出来的：纯 DOM 断言看不出来，
 *   因为弹窗的 HTML 根本没被渲染。
 *   为什么服务端测试也抓不到：那几个用例都直接调 HTTP 接口，不经过页面。
 */
function fmtBytes(bytes) {
  const n = Number(bytes);
  if (!Number.isFinite(n) || n <= 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  return `${(n / 1024 ** i).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

  const d = state.detail;
  if (!d) return;

  // ---- 任务级操作 ----
  const stopBtn = $('[data-act="stop-task"]');
  if (stopBtn) stopBtn.onclick = async () => {
    if (!confirm('停止处理这个任务？\n\n会把它移出待处理队列并把状态修回可操作状态。\n注意：若 biliLive-tools 里已有 ffmpeg 在跑，它会自己跑完。')) return;
    stopBtn.disabled = true;
    try {
      const r = await api(`/api/task/${encodeURIComponent(d.id)}/stop`, { method: 'POST' });
      toast(`${r.from} → ${r.to}：${r.reason}`, 6000);
      setTimeout(() => refreshAll(true), 800);
    } catch (e) { toast('停止失败：' + e.message, 5000); stopBtn.disabled = false; }
  };

  const retryFromBtn = $('[data-act="retry-from"]');
  if (retryFromBtn) retryFromBtn.onclick = () => {
    openInfo('从某阶段重跑', `

      <div class="fields" style="grid-template-columns:1fr">

          <div class="chips" id="retryStages">

    $$('#retryStages .chip').forEach((c) => (c.onclick = async () => {

      // 线上核对单独一个按钮，因为它要访问 B站、慢且对「定时未到点」的稿件必然显示不可见。

      const batchRows = rep.batches.map((b) => {

        const bvid = b.confirmedBvids.length

          <div class="field"><label><input type="checkbox" id="delClips" ${p.clipsFiles ? 'checked' : ''}> 切片产物（${p.clipsFiles} 个文件，${p.clipsMB} MB）</label></div>
          <div class="field"><label><input type="checkbox" id="delTaskDir"> 任务目录（压制产物 ${p.taskFullMB || 0} MB + 转写 / 弹幕信号 / 总结 ${p.taskMetaMB || 0} MB，合计 ${p.taskMB} MB）</label>
            <div class="hintline">大头是 full/ 下的压制产物（弹幕版 + 纯净版）。<b>勾选它 = 整体删除该任务记录</b>，之后无法回看本场总结与转写；重跑需重新转写（会再花 ASR 费用）</div></div>
          ${p.rawFiles.map((r, i) => `<div class="field"><label><input type="checkbox" id="delRaw${i}" ${r.sharedWith.length ? 'disabled' : ''}> 源素材 ${esc(r.name)}（${r.MB} MB）${r.sharedWith.length ? ` <span style="color:#c8811a">被其它任务共享，已锁定</span>` : ''}</label></div>`).join('')}
        </div>
        <p class="hintline">合计约 ${p.totalMB} MB。文件会先移入回收站（可恢复）。</p>`);
      $('#infoBody').dataset.rawCount = String(p.rawFiles.length);
      $('#infoBody').insertAdjacentHTML('beforeend', '<div style="margin-top:14px"><button class="danger" id="doDelete">确认删除</button></div>');
      $('#doDelete').onclick = async () => {
        const rawIdx = [];
        for (let i = 0; i < Number($('#infoBody').dataset.rawCount || 0); i++) {
          const el = document.getElementById('delRaw' + i);
          if (el && el.checked && !el.disabled) rawIdx.push(i);
        }
        const body = {
          confirm: true,
          deleteClips: $('#delClips').checked,
          deleteTaskDir: $('#delTaskDir').checked,
          deleteRaw: rawIdx.length > 0,
        };
        $('#doDelete').disabled = true;
        try {
          const r = await api(`/api/task/${encodeURIComponent(d.id)}/delete`, { method: 'POST', body });
          closeInfo();
          const kept = body.deleteTaskDir !== true; // 没勾「任务目录」= 只清文件，任务仍在
          toast(
            (kept ? '已删除所选文件（任务记录保留，可随时重切）' : r.trashId ? '已移入回收站（可在「设置 → 回收站」恢复）' : '已删除')
              + `，释放 ${r.freedMB} MB${r.skipped.length ? `（${r.skipped.length} 项跳过）` : ''}`,
            6000,
          );
          // 只有整体删除才清空当前选中项；只删文件时保持选中，否则用户会以为任务也没了
          if (!kept) {
            state.activeId = null;
            state.dirty.clear();
          }
          setTimeout(() => refreshAll(true), 800);
        } catch (e) { toast('删除失败：' + e.message, 6000); $('#doDelete').disabled = false; }
      };
    } catch (e) { toast('无法获取删除预览：' + e.message, 5000); }
  };

  // 重跑
  const retryBtn = $('[data-act="retry"]');
  if (retryBtn) retryBtn.onclick = async () => {
    const stageMap = { '录制': 'RECORDED', '转写': 'TRANSCRIBED', '分析': 'ANALYZED', '切片': 'CLIPPED', '发布': 'PUBLISHED' };
    const from = stageMap[retryBtn.dataset.stage] || d.stage;
    retryBtn.disabled = true; retryBtn.textContent = '已提交…';
    try {
      const r = await api(`/api/task/${encodeURIComponent(d.id)}/retry`, { method: 'POST', body: { fromStage: from } });
      toast(r.note || '已提交重跑');
      setTimeout(() => refreshAll(true), 1500);
    } catch (e) { toast('重跑失败：' + e.message); retryBtn.disabled = false; retryBtn.textContent = '从该阶段重跑'; }
  };

  // 查看日志（渲染后的错误时间线）
  const reportBtn = $('[data-act="report"]');
  if (reportBtn) reportBtn.onclick = async () => {
    try {
      const r = await api('/api/error-report/' + encodeURIComponent(reportBtn.dataset.report));
      const nt = reportNote(r);
      openInfo('错误报告 · ' + reportBtn.dataset.report, nt.note + `<div class="timeline">${(r.report.timeline || []).map((t) =>
        `<div class="row ${t.ok ? '' : 'bad'}"><span class="t">${esc(fmtTime(Date.parse(t.at)))}</span>
         <span class="s"><b>${esc(t.step)}</b>${t.model ? ` <span class="tag-mini">${esc(t.model)}</span>` : ''}${t.detail ? '<br>' + esc(t.detail) : ''}${t.elapsedMs ? ` <span style="color:var(--text-3)">${t.elapsedMs}ms</span>` : ''}</span></div>`).join('')}</div>
        <h3 style="font-size:13px;margin:16px 0 8px">错误本体</h3>
        <div class="kv"><div class="k">类型</div><div>${esc(r.report.error.type)}</div>
        <div class="k">消息</div><div>${esc(r.report.error.message)}</div>
        <div class="k">阶段</div><div>${esc(r.report.stage)}</div></div>
        ${r.report.request ? `<h3 style="font-size:13px;margin:16px 0 8px">请求上下文（已脱敏）</h3><pre class="raw">${esc(JSON.stringify(r.report.request, null, 2))}</pre>` : ''}
        ${r.report.env && r.report.env.biliLiveToolsLogTail ? `<h3 style="font-size:13px;margin:16px 0 8px">biliLive-tools 侧日志片段</h3><pre class="raw">${esc(String(r.report.env.biliLiveToolsLogTail).slice(-3000))}</pre>` : ''}
        <h3 style="font-size:13px;margin:16px 0 8px">完整报告 JSON</h3><pre class="raw">${esc(JSON.stringify(r.report, null, 2))}</pre>`,
        nt.tip);
      state.lastCopy = r.timeline;
    } catch (e) { toast('读取报告失败：' + e.message); }
  };

  // 本场设置的开关：`.switch` 需要**逐个绑定**（本项目没有全局委托），
  // 漏绑的后果是"点了没反应、保存下去永远是 false" —— 实测 `#ovSkip` 和 `#ovFullVideoBy` 都漏过。
  ['#ovSkip', '#ovFullVideoBy'].forEach((sel) => {
    const el = $(sel);
    if (el) el.onclick = () => el.classList.toggle('on');
  });

  // 本场设置
  const saveOv = $('[data-act="save-overrides"]');
  if (saveOv) saveOv.onclick = async () => {
    const skip = $('#ovSkip').classList.contains('on');
    const maxClips = Number($('#ovMaxClips').value) || undefined;
    const extraTags = $('#ovTags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
    const fullVideoBy = $('#ovFullVideoBy') && $('#ovFullVideoBy').classList.contains('on') ? 'assistant' : null;
    const resumeAid = ($('#ovResumeAid') ? $('#ovResumeAid').value.trim() : '') || null;
    try {
      /* ★ 真写台账（以前只是塞进 state.pendingOverrides，从没有发出去 —— 按钮是死的） */
      const r = await api(`/api/task/${encodeURIComponent(d.id)}/overrides`, {
        method: 'POST',
        body: { ...(maxClips !== undefined ? { maxClips } : {}), skipAutoPublish: skip, extraTags, fullVideoBy, resumeAid },
      });
      toast(r.note || '本场设置已保存', 4000);
      state.pendingOverrides = undefined;
      await loadDetail();
    } catch (e) { toast('保存失败：' + e.message, 5000); }
  };

  // 文件预览
  $$('#detail [data-act="preview"]').forEach((el) => el.onclick = async () => {
    const f = el.dataset.file;
    try {
      const res = await fetch(`/api/preview/${encodeURIComponent(d.id)}/${encodeURIComponent(f)}`, { headers: { 'X-CSRF-Token': BOOT.csrf } });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const text = await res.text();
      openInfo(d.id + ' / ' + f, `<pre class="raw">${esc(text.slice(0, 60000))}</pre>`, '仅显示前 60000 字符');
    } catch (e) { toast('预览失败：' + e.message); }
  });

  // 切片卡片
  $$('#detail .clip').forEach((card) => {
    const idx = Number(card.dataset.clip);
    const clip = d.clips.find((c) => c.index === idx);
    if (!clip) return;

    const sel = card.querySelector('[data-act="select"]');
    sel.onchange = () => {
      clip.selected = sel.checked;
      card.classList.toggle('off', !sel.checked);
      updateSelectedCount();
      patchClip(d.id, idx, { selected: sel.checked }).catch((e) => toast(e.message));
    };

    const ti = card.querySelector('[data-act="title"]');
    const cnt = card.querySelector('[data-role="cnt"]');
    ti.oninput = () => {
      const n = ti.value.length;
      cnt.textContent = `${n}/80`;
      cnt.classList.toggle('over', n > 80);
      state.dirty.add(d.id + ':' + idx);
      clearTimeout(card.__titleTimer);
      card.__titleTimer = setTimeout(() => saveTitle(card, d.id, idx, ti.value), 900);
    };
    ti.onblur = () => saveTitle(card, d.id, idx, ti.value);

    card.querySelectorAll('.tinput').forEach((inp) => {
      inp.onchange = async () => {
        const start = toSec(card.querySelector('[data-k="start"]').value);
        const end = toSec(card.querySelector('[data-k="end"]').value);
        if (!(end > start)) { toast('结束时间必须大于开始时间'); return; }
        try {
          const r = await patchClip(d.id, idx, { start, end });
          card.querySelector('[data-role="dur"]').textContent = `${(end - start).toFixed(0)} 秒`;
          card.querySelector('[data-role="changed"]').style.display = 'inline-block';
          inp.classList.add('changed');
          for (const w of (r.warnings || [])) toast(w, 4000);
          toast('时间范围已保存，发布时会重新切片');
        } catch (e) {
          toast('保存失败：' + e.message, 5000);
          inp.value = toTime(inp.dataset.k === 'start' ? clip.start : clip.end);
        }
      };
    });

    /* 试看：**定位切片产物 + 用系统自带播放器前台播放**。
       不转码、不弹大弹窗 —— 点了就直接在系统播放器里看（实测 1.4 秒内完成）。
       失败时才弹说明，并给出替代动作（如实说明，不假装成功）。 */
    card.querySelector('[data-act="preview-cut"]').onclick = async () => {
      const btn = card.querySelector('[data-act="preview-cut"]');
      const old = btn.textContent;
      btn.disabled = true; btn.textContent = '打开中…';
      try {
        const r = await api('/api/preview-cut', { method: 'POST', body: { taskId: d.id, index: idx } });
        if (r.ok) {
          toast(`已用 ${r.player || '系统播放器'} 播放该片段${r.playerForeground ? '' : '（可能被其它窗口挡住）'}`, 3500);
        } else if (r.notCut) {
          openInfo('试看', `<p style="color:#c8811a;font-weight:600">${esc(r.note)}</p>
            <div class="kv">
              <div class="k">区间</div><div class="mono">${toTime(r.startSec)} – ${toTime(r.endSec)}</div>
              <div class="k">源文件</div><div class="mono-sm" style="word-break:break-all">${esc(r.sourcePath || '(未设置)')}</div>
            </div>
            <div style="margin-top:10px"><button class="linkbtn" data-reveal="source">在文件夹中打开源文件</button></div>`);
        } else {
          /* 定位成功但播放器打不开（例如本机 .mp4 关联坏掉 / 没装播放器）：
             给出两个替代动作 —— 在浏览器里看，或去文件夹里拿原件。 */
          openInfo('试看（播放器打开失败）', `
            <p style="color:#c8811a;font-weight:600">${esc(r.note || '未知原因')}</p>
            <div class="kv">
              <div class="k">区间</div><div class="mono">${toTime(r.startSec)} – ${toTime(r.endSec)}</div>
              <div class="k">产物</div><div class="mono-sm" style="word-break:break-all">${esc(r.cutOutput || '')}</div>
            </div>
            <div style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap">
              <button class="linkbtn" id="pvInline">在浏览器里播放</button>
              <button class="linkbtn" data-reveal="cut">在文件夹中定位产物</button>
            </div>
            <div id="pvBox" style="margin-top:10px"></div>`);
          const bi = document.getElementById('pvInline');
          if (bi) bi.onclick = async () => {
            bi.disabled = true; bi.textContent = '生成中…（首次需转码）';
            try {
              const r2 = await api('/api/preview-cut', { method: 'POST', body: { taskId: d.id, index: idx, inline: true } });
              const box = document.getElementById('pvBox');
              if (box && r2.videoUrl) {
                box.innerHTML = `<video src="${esc(r2.videoUrl)}" controls autoplay muted playsinline
                  style="width:100%;max-height:50vh;background:#000;border-radius:6px;display:block"></video>`;
              } else { toast('内联生成失败：' + (r2.note || ''), 5000); }
            } catch (e) { toast('失败：' + e.message, 5000); }
            bi.disabled = false; bi.textContent = '在浏览器里播放';
          };
        }
        document.querySelectorAll('#infoBody [data-reveal]').forEach((b) => {
          b.onclick = async () => {
            try {
              const rr = await api('/api/reveal', { method: 'POST', body: { taskId: d.id, kind: b.dataset.reveal, index: idx } });
              toast('已打开：' + rr.target, 4000);
            } catch (e) { toast('打开失败：' + e.message, 5000); }
          };
        });
      } catch (e) { toast(e.message, 5000); }
      btn.disabled = false; btn.textContent = old;
    };
    card.querySelector('[data-act="open-llc"]').onclick = () => {
      const llc = d.llcFile;
      openInfo('在 biliLive-tools 中打开', llc
        ? `<p>已为该任务生成项目文件：<code>${esc(llc)}</code></p>
           <p>在 biliLive-tools 的「切片」页面用「打开项目」选择它（位于任务目录）：</p>
           <pre class="raw">${esc(d.source.fullVideoPath || (d.source.segments[0] && d.source.segments[0].name) || '')}</pre>
           <p style="color:var(--text-3);font-size:12.5px">任务目录：data/tasks/${esc(d.id)}/</p>`
        : '<p>尚未生成 .llc 项目文件（分析完成后会生成；若失败请看日志）。</p>');
    };
    const recut = card.querySelector('[data-act="recut"]');
    if (recut) recut.onclick = async () => {
      recut.disabled = true;
      try {
        await patchClip(d.id, idx, { selected: true });
        const r = await api(`/api/task/${encodeURIComponent(d.id)}/approve`, { method: 'POST', body: { indices: [idx] } });
        toast('已重新提交切片与投稿');
        setTimeout(() => refreshAll(true), 2000);
      } catch (e) { toast('失败：' + (e.payload && e.payload.problems ? e.payload.problems.join('；') : e.message), 6000); recut.disabled = false; }
    };
    /* 解除墓碑：这是「允许同一内容再投一次」的唯一开关，所以必须二次确认，
       而且确认文案要把不可逆的后果说清楚（旧稿件不会因为本地解除而消失）。 */
    const rel = card.querySelector('[data-act="release-tomb"]');
    if (rel) rel.onclick = async () => {
      const t = (d.clips.find((x) => x.index === idx) || {}).tombstone || {};
      const okGo = confirm(
        '确认要解除墓碑吗？\n\n' +
        '这意味着「同一录制区间」以后可以再次投稿到 B站。\n' +
        (t.bvid ? `请先确认 B站 上 ${t.bvid} 这个稿件确实已经删除。\n` : '请注意：当时并未反查到 bvid，无法确认那次投稿是否成功。\n') +
        '\n解除后重跑本场，这一片会照常切片并投稿。'
      );
      if (!okGo) return;
      rel.disabled = true;
      try {
        const fp = (d.clips.find((x) => x.index === idx) || {}).blockedByTombstone || (t && t.fingerprint);
        const r = await api('/api/tombstone/release', { method: 'POST', body: { fingerprint: fp, confirm: true, note: 'UI 手动解除' } });
        toast(r.note || '已解除墓碑', 6000);
        setTimeout(() => refreshAll(true), 600);
      } catch (e) {
        toast('解除失败：' + e.message, 6000);
        rel.disabled = false;
      }
    };
  });

  const btn = $('#publishBtn');
  if (btn) btn.onclick = async () => {
    const indices = state.detail.clips.filter((c) => c.selected && c.status !== 'PUBLISHED').map((c) => c.index);
    if (!indices.length) return;
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const r = await api(`/api/task/${encodeURIComponent(state.activeId)}/approve`, { method: 'POST', body: { indices } });
      const mode = state.bootstrap.mode.isOnlySelf ? '（仅自己可见）' : '';
      toast(`已提交 ${r.count} 个切片${mode}，按 ${fmtSpan(state.bootstrap.config.publish.clipGapSec)}间隔加入排期`, 5000);
      setTimeout(() => refreshAll(true), 1500);
    } catch (e) {
      const problems = e.payload && e.payload.problems;
      if (problems && problems.length) {
        // 发布前校验未通过：把每一条都列出来，别只给一句概览
        toast('发布前校验未通过：' + problems.join('；'), 10000);
      } else if (e.csrfFailure) {
        // api() 已经自动换过 token 并重试过一次，仍失败说明服务刚重启
        toast('服务刚重启，安全令牌已自动更新 —— 请再点一次「加入排期并发布」', 6000);
      } else {
        toast('发布失败：' + e.message, 8000);
      }
      btn.disabled = false; btn.textContent = '加入排期并发布';
    }
  };
  updateSelectedCount();
}

function updateSelectedCount() {
  const el = $('#cntSelected');
  if (el && state.detail) el.textContent = state.detail.clips.filter((c) => c.selected).length;
  const hint = $('#publishHint');
  if (hint && state.detail) {
    const bad = state.detail.clips.filter((c) => c.selected && (c.degraded && c.title.startsWith('（待填写）') || c.title.length > 80 || c.title.length === 0));
    hint.textContent = bad.length ? `⚠ ${bad.length} 个已选切片标题不合规，发布会被拦下` : '';
  }
}

async function saveTitle(card, taskId, idx, value) {
  const clip = state.detail.clips.find((c) => c.index === idx);
  if (!clip || clip.title === value) { state.dirty.delete(taskId + ':' + idx); return; }
  try {
    const r = await patchClip(taskId, idx, { title: value });
    clip.title = r.clip.title;
    const input = card.querySelector('[data-act="title"]');
    if (input.value !== r.clip.title) input.value = r.clip.title;
    state.dirty.delete(taskId + ':' + idx);
    card.querySelector('[data-role="changed"]').style.display = 'inline-block';
    for (const w of (r.warnings || [])) toast(w, 4000);
    updateSelectedCount();
  } catch (e) { toast('保存标题失败：' + e.message); }
}

async function patchClip(taskId, idx, patch) {
  return api(`/api/task/${encodeURIComponent(taskId)}/clip/${idx}`, { method: 'PATCH', body: patch });
}

/* ============================================================================
 * 右栏：发布排期
 * ========================================================================== */
function renderSchedule() {
  const s = state.schedule || { pending: [], published: [], retention: [] };
  const onlySelf = state.bootstrap && state.bootstrap.mode.isOnlySelf;
  const multiPart = !!(state.bootstrap && state.bootstrap.config.publish.multiPart);
  let html = `<div class="sched-group"><div class="sched-title"><b>待发布 ${s.pending.length}</b>
    <span>错峰 ${fmtSpan(state.bootstrap.config.publish.clipGapSec)}</span></div>
    ${multiPart && s.pending.length ? '<div class="hintline" style="margin:2px 0 6px">多分P 模式：整个稿件只有一个发布时间，逐片排期不生效</div>' : ''}
    ${s.pending.length ? s.pending.map((c) => `<div class="slot">
      <span class="t">${c.dtimeText ? esc(c.dtimeText.slice(5, 16)) : '待定'}</span>
      <div class="b"><div class="n">${esc(c.title)}</div>
      <div class="s">${toTime(c.start)} · ${Math.round(c.durationSec)} 秒 · ${esc(clipStatusText(c.status))}${c.degraded ? ' · 降级' : ''}</div>
      <div class="acts">
        <button class="linkbtn" data-sched-act="edit" data-task="${esc(c.taskId)}" data-idx="${c.index}">编辑</button>
        <button class="linkbtn" data-sched-act="time" data-task="${esc(c.taskId)}" data-idx="${c.index}">改发布时间</button>
        <button class="linkbtn" data-sched-act="del" data-task="${esc(c.taskId)}" data-idx="${c.index}" style="color:#c0392b">删除</button>
      </div></div>
    </div>`).join('') : '<div class="empty" style="padding:6px 0">暂无排期</div>'}</div>`;

  html += `<div class="sched-group published"><div class="sched-title"><b>已发布 ${s.published.length}</b>
    ${onlySelf ? '<span style="color:#c8811a">仅自己可见</span>' : ''}</div>
    ${s.published.length ? s.published.map((c) => `<div class="slot"><span class="t">✓</span>
      <div class="b"><div class="n">${esc(c.title)}</div>
      <div class="s">${c.dtimeText ? esc(c.dtimeText.slice(5, 16)) : ''} ${c.url ? `· <a href="${esc(c.url)}" target="_blank" rel="noreferrer">${esc(c.bvid)}</a>` : ''}</div>
    </div></div>`).join('') : '<div class="empty" style="padding:6px 0">暂无</div>'}</div>`;

  html += `<div class="sched-group"><div class="sched-title"><b>素材保留</b><span>缓冲期 ${state.bootstrap.config.cleanup.retentionDays} 天</span></div>
    ${(s.retention || []).slice(0, 12).map((r) => `<div class="slot"><span class="t">${r.keep ? '保' : '删'}</span>
      <div class="b"><div class="n">${esc(r.title)}</div><div class="s">${esc(r.note)}</div></div></div>`).join('') || '<div class="empty" style="padding:6px 0">暂无</div>'}</div>`;

  /* 自动导入：把「它在等什么」摆出来。
     用户看不到等待队列时，会以为轮询没生效 → 自己去手动导入 → 任务标成「手动导入」→ 更困惑。 */
  const w = state.watch;
  if (w && w.enabled) {
    const waiting = (w.lastOutcomes || []).filter((o) => !o.taskId && /等下一轮|仍在写入/.test(String(o.skipped || '')));
    const backlog = (w.lastOutcomes || []).filter((o) => /首次启用时已存在|重新登记基线|轮询启用之前/.test(String(o.skipped || ''))).length;
    html += `<div class="sched-group"><div class="sched-title"><b>自动导入</b>
      <span>每 ${w.intervalSec} 秒扫 ${(w.dirs || []).length} 个目录</span></div>
      <div class="slot"><span class="t">等</span><div class="b">
        <div class="n">${waiting.length ? `正在等 ${waiting.length} 个文件写完` : '暂无等待中的文件'}</div>
        <div class="s">${waiting.length
          ? waiting.slice(0, 3).map((o) => `${esc(o.fileName)}（${esc(String(o.skipped).replace(/（.*/, ''))}）`).join('、')
          : `已自动导入 ${w.importedTotal} 个${backlog ? `；${backlog} 个历史文件按配置不自动导入` : ''}`}</div>
      </div></div>
      <div class="slot"><span class="t">录</span><div class="b">
        <div class="s" style="margin-top:0">路径规则：体积连续两轮不变且稳定 ${w.stableSec || 30} 秒才导（避免导到半场素材）；你手动点的记「手动导入」，它自己捡的记「自动导入」</div>
      </div></div></div>`;
  }
  $('#schedule').innerHTML = html;
  bindScheduleActions();
}

/* ============================================================================
 * 排期栏的逐片操作：编辑 / 改发布时间 / 删除
 *
 * 为什么放在排期栏（而不是只在详情页）：用户是在排期栏里"看这一场会发什么"的，
 * 发现某一片不想要、或时间不合适时，就在原地处理，不必先去左侧切到那一场。
 * ========================================================================== */
function bindScheduleActions() {
  $$('#schedule [data-sched-act]').forEach((btn) => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const taskId = btn.dataset.task;
      const idx = Number(btn.dataset.idx);
      const act = btn.dataset.schedAct;
      if (act === 'edit') {
        // 切到那一场：详情页里有完整的标题/区间/标签编辑器
        state.activeId = taskId;
        await loadDetail();
        renderTaskList();
        toast('已切到该场，可在右侧切片卡片里编辑');
        return;
      }
      if (act === 'time') return openDtimeEditor(taskId, idx);
      if (act === 'del') return deleteClipFromSchedule(taskId, idx);
    };
  });
}

/** 逐片排期：手填发布时间（或清空回自动排期） */
function openDtimeEditor(taskId, idx) {
  const c = (state.schedule.pending || []).find((x) => x.taskId === taskId && x.index === idx);
  const cur = c && c.dtime ? new Date(c.dtime * 1000) : null;
  const local = (d) => {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const in2h = local(new Date(Date.now() + 2.5 * 3600_000));
  const tomorrow8 = local(new Date(new Date().setHours(8, 0, 0, 0) + 86_400_000));
  openInfo(
    '改发布时间（切片 #' + idx + '）',
    '<p style="font-size:13px;color:var(--text-2)">B站 要求定时发布时间必须**晚于提交时刻 2 小时以上**（硬约束 #4）。' +
      '手填的时间会盖过自动排期；留空并保存 = 回到自动排期。</p>' +
      `<div style="margin:10px 0"><input id="dtimeInput" type="datetime-local" value="${cur ? local(cur) : in2h}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></div>` +
      '<div class="chips">' +
      `<button class="chip" data-quick="${in2h}">2 小时后</button>` +
      `<button class="chip" data-quick="${tomorrow8}">明天 08:00</button>` +
      `<button class="chip" data-quick="">清空（自动排期）</button>` +
      '</div>' +
      '<div class="modal-foot" style="padding:12px 0 0"><span class="tip" id="dtimeTip"></span>' +
      '<button class="btn-sm" id="dtimeSave" style="margin-left:auto">保存</button></div>',
  );
  $$('#infoBody [data-quick]').forEach((b) => (b.onclick = () => {
    const v = b.dataset.quick;
    if (!v) { $('#dtimeInput').value = ''; return; }
    $('#dtimeInput').value = v;
  }));
  $('#dtimeSave').onclick = async () => {
    const v = $('#dtimeInput').value;
    $('#dtimeTip').textContent = '保存中…';
    try {
      const r = await patchClip(taskId, idx, v ? { dtime: v } : { clearDtime: true });
      for (const w of r.warnings || []) toast(w, 4000);
      toast(v ? '已设置发布时间' : '已改回自动排期');
      closeInfo();
      await loadSchedule();
      if (state.activeId === taskId) await loadDetail();
    } catch (e) {
      // 后端 400 时会带上 earliestAllowed：直接告诉用户最早能选什么时候
      const p = e && e.payload ? e.payload : null;
      let msg = (p && p.error) || e.message;
      if (p && p.earliestAllowed) msg += '（最早可选 ' + fmtTime(p.earliestAllowed * 1000) + '）';
      $('#dtimeTip').textContent = msg;
      toast(msg, 5000);
    }
  };
}

/** 排期栏里直接删掉一条切片 */
async function deleteClipFromSchedule(taskId, idx) {
  const c = (state.schedule.pending || []).find((x) => x.taskId === taskId && x.index === idx);
  if (!confirm(`删除切片 #${idx}？\n\n${c ? c.title : ''}\n\n只从本场清单里移除，不会删掉已切好的成片文件，也不影响 B站 上已有的稿件。`)) return;
  try {
    const r = await api(`/api/task/${encodeURIComponent(taskId)}/clip/${idx}/delete`, { method: 'POST', body: { deleteOutput: false } });
    toast(r.fingerprintsRemoved ? `已删除切片，并清掉 ${r.fingerprintsRemoved} 条幂等指纹` : '已删除切片');
    await loadSchedule();
    if (state.activeId === taskId) await loadDetail();
  } catch (e) {
    toast('删除失败：' + e.message, 5000);
  }
}

function clipStatusText(s) {
  return { CANDIDATE: '候选', PENDING_UPLOAD: '待切片', CUTTING: '切片中', CUT: '已切片', SUBMITTING: '投稿中', SUBMITTED: '已提交待确认', PUBLISHED: '已发布', FAILED: '失败', SKIPPED: '已跳过' }[s] || s;
}

/* ============================================================================
 * 其它页签：健康 / 成本 / 表现 / Prompt
 * ========================================================================== */
function switchView(v) {
  state.view = v;
  $$('#tabs .tab').forEach((t) => t.classList.toggle('on', t.dataset.view === v));
  const isTasks = v === 'tasks';
  $('#viewTasks').style.display = isTasks ? '' : 'none';
  $('#viewOther').style.display = isTasks ? 'none' : '';
  /* 监控页签自己带定时器：切走就停（没人看的时候不必每 5 秒问一次服务端） */
  if (v === 'monitor') {
    startMonitor();
    loadMonitor(false).catch(() => {});
  } else {
    stopMonitor();
  }
  if (!isTasks) renderOther(v);
}

async function renderOther(v) {
  const box = $('#otherPage');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    if (v === 'monitor') {
      // 已有数据就直接画（切回来不该重新等一次请求）；没有则拉一次
      if (state.mon.data) return renderMonitor(box);
      await loadMonitor(false);
      return;
    }
    if (v === 'health') return renderHealth(box);
    if (v === 'cost') return renderCost(box);
    if (v === 'perf') return renderPerf(box);
    if (v === 'prompts') return renderPrompts(box);
  } catch (e) {
    box.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}
